<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ASDF — Track Select</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#080808;
    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action:none;
}

button{

    font-family:inherit;

}


/* ================================================= */
/* 전체 */
/* ================================================= */

#app{

    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;

}


/* ================================================= */
/* 화면 */
/* ================================================= */

.screen{

    position:absolute;

    inset:0;

    display:none;

}

.screen.active{

    display:block;

}


/* ================================================= */
/* 트랙 선택 화면 */
/* ================================================= */

#trackScreen{

    background:#080808;

    overflow-y:auto;

    padding:40px 25px;

}


.track-container{

    width:min(850px,100%);

    margin:0 auto;

}


.track-header{

    margin-bottom:35px;

}


.small-title{

    font-size:11px;

    color:#666;

    letter-spacing:4px;

    margin-bottom:10px;

}


.track-header h1{

    font-size:42px;

    letter-spacing:-2px;

}


.track-header p{

    margin-top:10px;

    color:#666;

    font-size:14px;

}


/* ================================================= */
/* 홈 버튼 */
/* ================================================= */

.home-button{

    position:fixed;

    top:20px;
    left:20px;

    z-index:100;

    padding:9px 14px;

    border:1px solid #333;

    border-radius:9px;

    background:#111;

    color:#aaa;

    cursor:pointer;

    transition:.2s;

}

.home-button:hover{

    background:#1c1c1c;

    color:white;

}


/* ================================================= */
/* 트랙 리스트 */
/* ================================================= */

.track-list{

    display:flex;

    flex-direction:column;

    gap:12px;

}


.track{

    position:relative;

    width:100%;

    min-height:100px;

    padding:20px 24px;

    border:1px solid #292929;

    border-radius:16px;

    background:#111;

    color:white;

    text-align:left;

    cursor:pointer;

    transition:.2s;

}


.track:hover{

    background:#181818;

    border-color:#555;

    transform:translateY(-2px);

}


.track-number{

    position:absolute;

    top:20px;
    right:22px;

    font-size:12px;

    color:#555;

}


.track-title{

    font-size:20px;

    font-weight:700;

    margin-bottom:9px;

}


.track-info{

    display:flex;

    gap:14px;

    color:#777;

    font-size:12px;

}


.track-difficulty{

    color:#aaa;

}


.track.locked{

    opacity:.35;

    cursor:not-allowed;

}


.track.locked:hover{

    transform:none;

    background:#111;

    border-color:#292929;

}


/* ================================================= */
/* 게임 화면 */
/* ================================================= */

#gameScreen{

    background:#080808;

}


/* ================================================= */
/* 상단 */
/* ================================================= */

.top{

    position:absolute;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    width:min(900px,90%);

    display:flex;

    justify-content:space-between;

    align-items:center;

    z-index:20;

}


.song-info{

    display:flex;

    flex-direction:column;

    gap:5px;

}


.song-title{

    font-size:18px;

    font-weight:700;

}


.song-subtitle{

    font-size:11px;

    color:#666;

    letter-spacing:2px;

}


.score-box{

    text-align:right;

}


.score{

    font-size:22px;

    font-weight:700;

}


.combo{

    margin-top:4px;

    font-size:12px;

    color:#888;

}


/* ================================================= */
/* 게임 영역 */
/* ================================================= */

.playfield{

    position:absolute;

    left:50%;
    top:0;

    transform:translateX(-50%);

    width:min(560px,100%);

    height:100%;

    display:flex;

}


/* ================================================= */
/* 레인 */
/* ================================================= */

.lane{

    position:relative;

    flex:1;

    height:100%;

    border-left:1px solid #1b1b1b;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,.015),
            rgba(255,255,255,.035)
        );

}


.lane:last-child{

    border-right:1px solid #1b1b1b;

}


/* ================================================= */
/* 키 */
/* ================================================= */

.key{

    position:absolute;

    bottom:18px;

    left:50%;

    transform:translateX(-50%);

    width:72%;

    height:52px;

    border:1px solid #333;

    border-radius:12px;

    background:#141414;

    color:#888;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:20px;

    font-weight:700;

    z-index:10;

    transition:.08s;

}


.key.active{

    background:white;

    color:black;

    transform:
        translateX(-50%)
        scale(.92);

}


/* ================================================= */
/* 판정선 */
/* ================================================= */

.judgement-line{

    position:absolute;

    left:0;
    right:0;

    bottom:88px;

    height:2px;

    background:#777;

    box-shadow:
        0 0 12px rgba(255,255,255,.15);

    z-index:5;

}


/* ================================================= */
/* 노트 */
/* ================================================= */

.note{

    position:absolute;

    left:50%;

    transform:translateX(-50%);

    width:68%;

    aspect-ratio:1 / 1;

    max-width:34px;

    min-width:20px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 12px rgba(255,255,255,.35);

    z-index:4;

}


/* ================================================= */
/* 판정 */
/* ================================================= */

.judgement{

    position:absolute;

    left:50%;
    top:43%;

    transform:
        translate(-50%,-50%)
        scale(.9);

    opacity:0;

    font-size:22px;

    font-weight:800;

    letter-spacing:2px;

    z-index:30;

    pointer-events:none;

}


.judgement.show{

    animation:
        judgement .42s ease-out;

}


@keyframes judgement{

    0%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.9);

    }

    100%{

        opacity:0;

        transform:
            translate(-50%,-70%)
            scale(1.15);

    }

}


/* ================================================= */
/* 시작 오버레이 */
/* ================================================= */

.overlay{

    position:absolute;

    inset:0;

    background:rgba(5,5,5,.94);

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    z-index:100;

    text-align:center;

    padding:25px;

}


.overlay.hidden{

    display:none;

}


.overlay h1{

    font-size:42px;

    margin-bottom:10px;

}


.overlay p{

    color:#888;

    font-size:14px;

    line-height:1.8;

}


.start-button{

    margin-top:30px;

    border:none;

    background:white;

    color:black;

    padding:15px 35px;

    border-radius:12px;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

}


/* ================================================= */
/* 결과 화면 */
/* ================================================= */

.result{

    position:absolute;

    inset:0;

    background:rgba(5,5,5,.96);

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    z-index:200;

    text-align:center;

}


.result.show{

    display:flex;

}


.result h1{

    font-size:42px;

    margin-bottom:30px;

}


.result-score{

    font-size:36px;

    font-weight:800;

}


.result-info{

    margin-top:18px;

    color:#888;

    line-height:2;

}


.result-buttons{

    display:flex;

    gap:10px;

    margin-top:30px;

}


.result-button{

    padding:14px 25px;

    border:none;

    border-radius:10px;

    background:white;

    color:black;

    font-weight:700;

    cursor:pointer;

}


.result-button.secondary{

    background:#181818;

    color:white;

    border:1px solid #333;

}


/* ================================================= */
/* ESC / 뒤로가기 */
/* ================================================= */

.back-button{

    position:absolute;

    top:20px;
    right:20px;

    padding:9px 14px;

    border:1px solid #333;

    border-radius:8px;

    background:#111;

    color:#aaa;

    cursor:pointer;

    z-index:250;

}


.back-button:hover{

    color:white;

    background:#1b1b1b;

}


/* ================================================= */
/* 모바일 */
/* ================================================= */

@media(max-width:600px){

    #trackScreen{

        padding:
            75px
            18px
            30px;

    }


    .track-header h1{

        font-size:32px;

    }


    .track-header p{

        font-size:13px;

    }


    .track{

        min-height:92px;

        padding:18px;

        border-radius:14px;

    }


    .track-title{

        font-size:18px;

    }


    .track-number{

        right:18px;

    }


    .top{

        top:12px;

        width:92%;

    }


    .song-title{

        font-size:14px;

    }


    .song-subtitle{

        font-size:9px;

    }


    .score{

        font-size:18px;

    }


    .combo{

        font-size:10px;

    }


    .key{

        bottom:14px;

        height:45px;

        border-radius:10px;

        font-size:17px;

    }


    .judgement-line{

        bottom:73px;

    }


    .overlay h1{

        font-size:30px;

    }


    .overlay p{

        font-size:13px;

    }


    .result h1{

        font-size:34px;

    }


    .result-buttons{

        flex-direction:column;

        width:80%;

    }


    .result-button{

        width:100%;

    }

}


/* ================================================= */
/* 작은 스마트폰 */
/* ================================================= */

@media(max-width:380px){

    .key{

        height:40px;

    }


    .judgement-line{

        bottom:66px;

    }

}

</style>

</head>


<body>


<div id="app">


<!-- ================================================= -->
<!-- 트랙 선택 -->
<!-- ================================================= -->

<section
    id="trackScreen"
    class="screen active"
>


    <button
        class="home-button"
        onclick="goHome()"
    >
        ← 나가기
    </button>


    <div class="track-container">


        <div class="track-header">

            <div class="small-title">
                ASDF
            </div>

            <h1>
                SELECT TRACK
            </h1>

            <p>
                플레이할 곡을 선택하세요.
            </p>

        </div>


        <div
            class="track-list"
            id="trackList"
        ></div>


    </div>

</section>


<!-- ================================================= -->
<!-- 게임 -->
<!-- ================================================= -->

<section
    id="gameScreen"
    class="screen"
>


    <button
        class="back-button"
        onclick="leaveGame()"
    >
        ESC
    </button>


    <div class="top">


        <div class="song-info">

            <div
                class="song-title"
                id="songTitle"
            >
                Rhythm Walk
            </div>

            <div
                class="song-subtitle"
                id="songSubtitle"
            >
                TRACK 01 · 114 BPM
            </div>

        </div>


        <div class="score-box">

            <div
                class="score"
                id="score"
            >
                000000
            </div>

            <div
                class="combo"
                id="combo"
            >
                COMBO 0
            </div>

        </div>


    </div>


    <div class="playfield">


        <div
            class="lane"
            data-lane="0"
        >

            <div class="key">
                A
            </div>

        </div>


        <div
            class="lane"
            data-lane="1"
        >

            <div class="key">
                S
            </div>

        </div>


        <div
            class="lane"
            data-lane="2"
        >

            <div class="key">
                D
            </div>

        </div>


        <div
            class="lane"
            data-lane="3"
        >

            <div class="key">
                F
            </div>

        </div>


        <div class="judgement-line"></div>


    </div>


    <div
        class="judgement"
        id="judgement"
    ></div>


    <div
        class="overlay"
        id="startOverlay"
    >

        <h1 id="startTitle">
            Rhythm Walk
        </h1>

        <p>
            A / S / D / F 키를 사용하세요.<br>
            노트가 판정선에 들어오는 순간 누르세요.<br>
            모바일에서는 해당 레인을 터치하세요.
        </p>

        <button
            class="start-button"
            id="startButton"
        >
            START
        </button>

    </div>


</section>


<!-- ================================================= -->
<!-- 결과 -->
<!-- ================================================= -->

<section
    class="result"
    id="result"
>


    <button
        class="back-button"
        onclick="showTrackSelect()"
    >
        ← 곡 선택
    </button>


    <h1>
        RESULT
    </h1>


    <div
        class="result-score"
        id="resultScore"
    >
        0
    </div>


    <div
        class="result-info"
        id="resultInfo"
    ></div>


    <div class="result-buttons">


        <button
            class="result-button"
            onclick="retryTrack()"
        >
            다시 플레이
        </button>


        <button
            class="result-button secondary"
            onclick="showTrackSelect()"
        >
            곡 선택
        </button>


    </div>


</section>


</div>


<script>


/* ================================================= */
/* TRACK DATA */
/* ================================================= */


/*
    새로운 곡을 추가할 때는
    이 배열에 하나씩 추가하면 된다.
*/

const tracks = [

    {

        id:1,

        title:"Rhythm Walk",

        artist:"Joyful Rhythm Walk Funk",

        difficulty:"EASY",

        bpm:114.84,

        audio:
            "../../project/lightbeatsmusic-joyful-rhythm-walk-funk-513936.mp3"

    },


    /*
        앞으로 곡이 추가되면
        아래와 같은 형식으로 추가.

        {
            id:2,
            title:"곡 이름",
            artist:"아티스트",
            difficulty:"NORMAL",
            bpm:120,
            audio:"../../project/곡파일.mp3"
        }
    */

];


/* ================================================= */
/* 현재 트랙 */
/* ================================================= */

let currentTrack =
    null;


/* ================================================= */
/* DOM */
/* ================================================= */

const trackScreen =
    document.getElementById(
        "trackScreen"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const resultScreen =
    document.getElementById(
        "result"
    );


const trackList =
    document.getElementById(
        "trackList"
    );


const songTitle =
    document.getElementById(
        "songTitle"
    );


const songSubtitle =
    document.getElementById(
        "songSubtitle"
    );


const startTitle =
    document.getElementById(
        "startTitle"
    );


const startOverlay =
    document.getElementById(
        "startOverlay"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const lanes =
    document.querySelectorAll(
        ".lane"
    );


const keys =
    document.querySelectorAll(
        ".key"
    );


const scoreElement =
    document.getElementById(
        "score"
    );


const comboElement =
    document.getElementById(
        "combo"
    );


const judgementElement =
    document.getElementById(
        "judgement"
    );


const resultScore =
    document.getElementById(
        "resultScore"
    );


const resultInfo =
    document.getElementById(
        "resultInfo"
    );


/* ================================================= */
/* AUDIO */
/* ================================================= */

let audio =
    new Audio();

audio.preload =
    "auto";

audio.volume =
    0.8;


/* ================================================= */
/* 게임 설정 */
/* ================================================= */

const NOTE_TRAVEL_TIME =
    1.5;


const PERFECT =
    0.075;


const GREAT =
    0.14;


const GOOD =
    0.22;


/* ================================================= */
/* 게임 상태 */
/* ================================================= */

let playing =
    false;


let finished =
    false;


let animationFrame =
    null;


let score =
    0;


let combo =
    0;


let maxCombo =
    0;


let perfectCount =
    0;


let greatCount =
    0;


let goodCount =
    0;


let missCount =
    0;


let notes =
    [];


/* ================================================= */
/* 트랙 선택 화면 생성 */
/* ================================================= */

function buildTrackList(){

    trackList.innerHTML =
        "";


    tracks.forEach(
        track => {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "track";


            button.innerHTML = `

                <div class="track-number">
                    ${String(track.id).padStart(2,"0")}
                </div>

                <div class="track-title">
                    ${track.title}
                </div>

                <div class="track-info">

                    <span>
                        ${track.artist}
                    </span>

                    <span class="track-difficulty">
                        ${track.difficulty}
                    </span>

                    <span>
                        ${track.bpm} BPM
                    </span>

                </div>

            `;


            button.addEventListener(
                "click",
                () => {

                    selectTrack(
                        track
                    );

                }
            );


            trackList.appendChild(
                button
            );

        }
    );

}


/* ================================================= */
/* 트랙 선택 */
/* ================================================= */

function selectTrack(track){

    currentTrack =
        track;


    /*
        기존 오디오 정리
    */

    audio.pause();

    audio.currentTime =
        0;


    audio =
        new Audio(
            track.audio
        );


    audio.preload =
        "auto";

    audio.volume =
        0.8;


    /*
        화면 변경
    */

    trackScreen.classList.remove(
        "active"
    );


    resultScreen.classList.remove(
        "show"
    );


    gameScreen.classList.add(
        "active"
    );


    /*
        곡 정보
    */

    songTitle.textContent =
        track.title;


    songSubtitle.textContent =
        `TRACK ${String(track.id).padStart(2,"0")} · ${track.bpm} BPM`;


    startTitle.textContent =
        track.title;


    /*
        초기화
    */

    resetGame();


    startOverlay.classList.remove(
        "hidden"
    );

}


/* ================================================= */
/* 게임 초기화 */
/* ================================================= */

function resetGame(){

    playing =
        false;

    finished =
        false;


    if(
        animationFrame
    ){

        cancelAnimationFrame(
            animationFrame
        );

    }


    score =
        0;

    combo =
        0;

    maxCombo =
        0;

    perfectCount =
        0;

    greatCount =
        0;

    goodCount =
        0;

    missCount =
        0;


    notes =
        [];


    /*
        화면에 남은 노트 제거
    */

    document
        .querySelectorAll(".note")
        .forEach(
            note => note.remove()
        );


    updateUI();

}


/* ================================================= */
/* 노트 생성 */
/* ================================================= */

function createNotes(){

    notes =
        [];


    const bpm =
        currentTrack.bpm;


    const beat =
        60 / bpm;


    const duration =
        audio.duration ||
        138;


    /*
        첫 박자
    */

    const firstBeat =
        0.0907;


    let index =
        0;


    for(
        let time = firstBeat;
        time < duration - 1;
        time += beat
    ){

        const patterns = [

            [0,1,2,3],

            [1,3,0,2],

            [2,0,3,1],

            [3,2,1,0]

        ];


        const pattern =
            patterns[
                Math.floor(index / 8)
                % patterns.length
            ];


        const lane =
            pattern[
                index % 4
            ];


        notes.push({

            time:time,

            lane:lane,

            hit:false,

            missed:false,

            element:null

        });


        /*
            일부 박자에는
            반박 노트 추가
        */

        if(
            index > 8 &&
            index % 8 === 3
        ){

            notes.push({

                time:
                    time +
                    beat / 2,

                lane:
                    (lane + 2) % 4,

                hit:false,

                missed:false,

                element:null

            });

        }


        index++;

    }

}


/* ================================================= */
/* 노트 DOM */
/* ================================================= */

function createNoteElement(note){

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "note";


    lanes[note.lane]
        .appendChild(
            element
        );


    note.element =
        element;

}


/* ================================================= */
/* 노트 위치 */
/* ================================================= */

function updateNotes(
    currentTime
){

    const playfield =
        document.querySelector(
            ".playfield"
        );


    const playfieldHeight =
        playfield.clientHeight;


    const judgementY =
        playfieldHeight - 88;


    const startY =
        -40;


    for(
        const note of notes
    ){

        if(
            note.hit ||
            note.missed
        ){

            continue;

        }


        const difference =
            note.time -
            currentTime;


        /*
            화면에 진입
        */

        if(
            difference <=
                NOTE_TRAVEL_TIME
            &&
            difference >
                -GOOD
        ){

            if(
                !note.element
            ){

                createNoteElement(
                    note
                );

            }


            const progress =
                1 -
                (
                    difference /
                    NOTE_TRAVEL_TIME
                );


            const y =
                startY +
                (
                    judgementY -
                    startY
                ) *
                progress;


            note.element.style.top =
                y + "px";

        }


        /*
            판정선 통과
        */

        if(
            difference <
            -GOOD
        ){

            miss(
                note
            );

        }

    }

}


/* ================================================= */
/* MISS */
/* ================================================= */

function miss(note){

    if(
        note.hit ||
        note.missed
    ){

        return;

    }


    note.missed =
        true;


    missCount++;


    combo =
        0;


    updateUI();


    showJudgement(
        "MISS"
    );


    removeNote(
        note
    );

}


/* ================================================= */
/* 노트 제거 */
/* ================================================= */

function removeNote(note){

    if(
        note.element
    ){

        note.element.remove();

        note.element =
            null;

    }

}


/* ================================================= */
/* 레인 입력 */
/* ================================================= */

function hitLane(lane){

    if(
        !playing ||
        finished
    ){

        return;

    }


    const currentTime =
        audio.currentTime;


    let target =
        null;


    let smallestDifference =
        Infinity;


    for(
        const note of notes
    ){

        if(
            note.hit ||
            note.missed ||
            note.lane !== lane
        ){

            continue;

        }


        const difference =
            Math.abs(
                note.time -
                currentTime
            );


        if(
            difference <
            smallestDifference
        ){

            smallestDifference =
                difference;

            target =
                note;

        }

    }


    if(
        !target
    ){

        return;

    }


    if(
        smallestDifference <=
        PERFECT
    ){

        hitNote(
            target,
            "PERFECT",
            1000
        );

    }

    else if(
        smallestDifference <=
        GREAT
    ){

        hitNote(
            target,
            "GREAT",
            700
        );

    }

    else if(
        smallestDifference <=
        GOOD
    ){

        hitNote(
            target,
            "GOOD",
            400
        );

    }

}


/* ================================================= */
/* HIT */
/* ================================================= */

function hitNote(
    note,
    judgement,
    points
){

    if(
        note.hit ||
        note.missed
    ){

        return;

    }


    note.hit =
        true;


    if(
        judgement ===
        "PERFECT"
    ){

        perfectCount++;

    }

    else if(
        judgement ===
        "GREAT"
    ){

        greatCount++;

    }

    else{

        goodCount++;

    }


    combo++;


    maxCombo =
        Math.max(
            maxCombo,
            combo
        );


    const multiplier =
        1 +
        Math.min(
            combo / 100,
            1
        );


    score +=
        Math.round(
            points *
            multiplier
        );


    updateUI();


    showJudgement(
        judgement
    );


    removeNote(
        note
    );

}


/* ================================================= */
/* UI 업데이트 */
/* ================================================= */

function updateUI(){

    scoreElement.textContent =
        String(score)
            .padStart(
                6,
                "0"
            );


    comboElement.textContent =
        `COMBO ${combo}`;

}


/* ================================================= */
/* 판정 표시 */
/* ================================================= */

function showJudgement(
    text
){

    judgementElement.textContent =
        text;


    judgementElement.classList.remove(
        "show"
    );


    void judgementElement.offsetWidth;


    judgementElement.classList.add(
        "show"
    );

}


/* ================================================= */
/* 키 애니메이션 */
/* ================================================= */

function pressKey(lane){

    const key =
        keys[lane];


    key.classList.add(
        "active"
    );


    setTimeout(
        () => {

            key.classList.remove(
                "active"
            );

        },
        90
    );

}


/* ================================================= */
/* 게임 루프 */
/* ================================================= */

function gameLoop(){

    if(
        !playing
    ){

        return;

    }


    const currentTime =
        audio.currentTime;


    updateNotes(
        currentTime
    );


    if(
        audio.ended
        ||
        currentTime >=
        audio.duration - 0.05
    ){

        finishGame();

        return;

    }


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* ================================================= */
/* 게임 시작 */
/* ================================================= */

async function startGame(){

    if(
        playing ||
        !currentTrack
    ){

        return;

    }


    try{

        /*
            사용자가 START 버튼을 눌렀기 때문에
            모바일 브라우저에서도
            오디오 재생 가능.
        */

        await audio.play();

    }

    catch(error){

        console.error(
            error
        );

        alert(
            "음악을 재생할 수 없습니다."
        );

        return;

    }


    createNotes();


    score =
        0;

    combo =
        0;

    maxCombo =
        0;

    perfectCount =
        0;

    greatCount =
        0;

    goodCount =
        0;

    missCount =
        0;


    finished =
        false;

    playing =
        true;


    updateUI();


    startOverlay.classList.add(
        "hidden"
    );


    gameLoop();

}


/* ================================================= */
/* 게임 종료 */
/* ================================================= */

function finishGame(){

    if(
        finished
    ){

        return;

    }


    finished =
        true;

    playing =
        false;


    if(
        animationFrame
    ){

        cancelAnimationFrame(
            animationFrame
        );

    }


    audio.pause();


    /*
        남은 노트 제거
    */

    notes.forEach(
        note => {

            removeNote(
                note
            );

        }
    );


    resultScore.textContent =
        score.toLocaleString();


    resultInfo.innerHTML =

        `PERFECT : ${perfectCount}<br>` +

        `GREAT : ${greatCount}<br>` +

        `GOOD : ${goodCount}<br>` +

        `MISS : ${missCount}<br>` +

        `MAX COMBO : ${maxCombo}`;


    resultScreen.classList.add(
        "show"
    );

}


/* ================================================= */
/* 다시 플레이 */
/* ================================================= */

function retryTrack(){

    resultScreen.classList.remove(
        "show"
    );


    gameScreen.classList.add(
        "active"
    );


    audio.pause();


    audio.currentTime =
        0;


    resetGame();


    startOverlay.classList.remove(
        "hidden"
    );

}


/* ================================================= */
/* 곡 선택으로 */
/* ================================================= */

function showTrackSelect(){

    /*
        게임 정지
    */

    playing =
        false;


    finished =
        true;


    if(
        animationFrame
    ){

        cancelAnimationFrame(
            animationFrame
        );

    }


    audio.pause();


    audio.currentTime =
        0;


    /*
        노트 제거
    */

    document
        .querySelectorAll(".note")
        .forEach(
            note => note.remove()
        );


    resultScreen.classList.remove(
        "show"
    );


    gameScreen.classList.remove(
        "active"
    );


    trackScreen.classList.add(
        "active"
    );

}


/* ================================================= */
/* 게임에서 나가기 */
/* ================================================= */

function leaveGame(){

    /*
        게임 중이면
        곡 선택 화면으로
    */

    if(
        playing
    ){

        playing =
            false;

        finished =
            true;


        if(
            animationFrame
        ){

            cancelAnimationFrame(
                animationFrame
            );

        }


        audio.pause();

        audio.currentTime =
            0;

    }


    showTrackSelect();

}


/* ================================================= */
/* 홈 */
/* ================================================= */

function goHome(){

    location.href =
        "../";

}


/* ================================================= */
/* 키보드 */
/* ================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
            ESC
        */

        if(
            event.key ===
            "Escape"
        ){

            event.preventDefault();

            if(
                resultScreen.classList.contains(
                    "show"
                )
            ){

                showTrackSelect();

            }

            else if(
                gameScreen.classList.contains(
                    "active"
                )
            ){

                leaveGame();

            }

            else{

                goHome();

            }

            return;

        }


        if(
            !playing
        ){

            return;

        }


        const key =
            event.key.toLowerCase();


        const keyMap = {

            "a":0,

            "s":1,

            "d":2,

            "f":3

        };


        if(
            key in keyMap
        ){

            event.preventDefault();


            const lane =
                keyMap[key];


            pressKey(
                lane
            );


            hitLane(
                lane
            );

        }

    }
);


/* ================================================= */
/* 모바일 터치 */
/* ================================================= */

lanes.forEach(
    (lane,index) => {


        lane.addEventListener(
            "touchstart",
            event => {

                event.preventDefault();


                if(
                    !playing
                ){

                    return;

                }


                pressKey(
                    index
                );


                hitLane(
                    index
                );

            },
            {
                passive:false
            }
        );


        /*
            PC 마우스도 가능
        */

        lane.addEventListener(
            "mousedown",
            event => {

                if(
                    event.button !== 0
                ){

                    return;

                }


                if(
                    !playing
                ){

                    return;

                }


                pressKey(
                    index
                );


                hitLane(
                    index
                );

            }
        );

    }
);


/* ================================================= */
/* START 버튼 */
/* ================================================= */

startButton.addEventListener(
    "click",
    () => {

        startGame();

    }
);


/* ================================================= */
/* 오디오 오류 */
/* ================================================= */

audio.addEventListener(
    "error",
    () => {

        if(
            currentTrack
        ){

            alert(
                "음원 파일을 찾을 수 없습니다.\n\n" +
                currentTrack.audio
            );

        }

    }
);


/* ================================================= */
/* 초기화 */
/* ================================================= */

buildTrackList();

</script>

</html>
