<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ASDF</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#080808;
    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action:none;
}


/* ========================= */
/* 게임 전체 */
/* ========================= */

.game{

    position:relative;

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;
    align-items:center;

}


/* ========================= */
/* 상단 정보 */
/* ========================= */

.top{

    position:absolute;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    width:min(900px,90%);

    display:flex;

    justify-content:space-between;
    align-items:center;

    z-index:20;

}

.song{

    font-size:15px;

    font-weight:bold;

}

.score{

    font-size:15px;

    color:#aaa;

}


/* ========================= */
/* 플레이 영역 */
/* ========================= */

.playfield{

    position:relative;

    width:min(600px,92vw);

    height:80vh;

    max-height:800px;

    display:flex;

}


/* ========================= */
/* 레인 */
/* ========================= */

.lane{

    position:relative;

    flex:1;

    height:100%;

    border-left:1px solid #202020;

    overflow:hidden;

}

.lane:last-child{

    border-right:1px solid #202020;

}


/* ========================= */
/* 판정선 */
/* ========================= */

.judgement-line{

    position:absolute;

    left:0;
    bottom:100px;

    width:100%;
    height:3px;

    background:#777;

    box-shadow:
        0 0 12px rgba(255,255,255,.2);

    z-index:5;

}


/* ========================= */
/* 노트 */
/* ========================= */

.note{

    position:absolute;

    width:48px;
    height:48px;

    left:50%;

    transform:
        translateX(-50%)
        rotate(45deg);

    border-radius:8px;

    background:white;

    box-shadow:
        0 0 20px rgba(255,255,255,.25);

    z-index:10;

}


/* ========================= */
/* 판정 표시 */
/* ========================= */

.judgement{

    position:absolute;

    left:50%;
    bottom:145px;

    transform:translateX(-50%);

    font-size:22px;

    font-weight:bold;

    opacity:0;

    pointer-events:none;

    z-index:30;

}

.judgement.show{

    animation:
        judgement .45s ease-out;

}

@keyframes judgement{

    0%{

        opacity:1;

        transform:
            translateX(-50%)
            translateY(0);

    }

    100%{

        opacity:0;

        transform:
            translateX(-50%)
            translateY(-25px);

    }

}


/* ========================= */
/* 입력 영역 */
/* ========================= */

.keys{

    position:absolute;

    bottom:35px;
    left:50%;

    transform:translateX(-50%);

    width:min(600px,92vw);

    display:flex;

    z-index:20;

}

.key{

    flex:1;

    height:55px;

    margin:0 5px;

    border:1px solid #333;

    background:#151515;

    color:#aaa;

    border-radius:12px;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:20px;

    font-weight:bold;

    transition:.08s;

    user-select:none;

}

.key.active{

    background:white;

    color:black;

    transform:scale(.94);

}


/* ========================= */
/* 시작 화면 */
/* ========================= */

.overlay{

    position:absolute;

    inset:0;

    background:rgba(0,0,0,.92);

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    z-index:100;

    padding:30px;

}

.overlay h1{

    font-size:38px;

    margin-bottom:15px;

}

.overlay p{

    color:#888;

    line-height:1.7;

    margin-bottom:30px;

}

.start-button{

    border:none;

    background:white;

    color:black;

    padding:15px 35px;

    border-radius:12px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


/* ========================= */
/* 결과 화면 */
/* ========================= */

.result{

    display:none;

}

.result h1{

    margin-bottom:20px;

}

.result-score{

    font-size:42px;

    font-weight:bold;

    margin-bottom:10px;

}

.result-info{

    color:#888;

    margin-bottom:30px;

}


/* ========================= */
/* 모바일 */
/* ========================= */

@media(max-width:600px){

    .top{

        top:14px;

        width:90%;

    }

    .song,
    .score{

        font-size:13px;

    }

    .playfield{

        width:96vw;

        height:78vh;

    }

    .note{

        width:40px;
        height:40px;

    }

    .judgement-line{

        bottom:85px;

    }

    .keys{

        bottom:18px;

        width:96vw;

    }

    .key{

        height:58px;

        margin:0 3px;

        border-radius:10px;

        font-size:18px;

    }

}


/* ========================= */
/* 작은 화면 */
/* ========================= */

@media(max-width:380px){

    .key{

        height:52px;

        font-size:16px;

    }

    .note{

        width:34px;
        height:34px;

    }

}

</style>

</head>


<body>


<div class="game">


    <!-- ========================= -->
    <!-- 상단 정보 -->
    <!-- ========================= -->

    <div class="top">

        <div
            class="song"
            id="songTitle"
        >
            Loading...
        </div>

        <div
            class="score"
            id="score"
        >
            000000
        </div>

    </div>


    <!-- ========================= -->
    <!-- 플레이 영역 -->
    <!-- ========================= -->

    <div
        class="playfield"
        id="playfield"
    >

        <div
            class="lane"
            data-lane="0"
        ></div>

        <div
            class="lane"
            data-lane="1"
        ></div>

        <div
            class="lane"
            data-lane="2"
        ></div>

        <div
            class="lane"
            data-lane="3"
        ></div>


        <div class="judgement-line"></div>


        <div
            class="judgement"
            id="judgement"
        ></div>

    </div>


    <!-- ========================= -->
    <!-- 입력 -->
    <!-- ========================= -->

    <div class="keys">

        <div
            class="key"
            data-key="a"
        >
            A
        </div>

        <div
            class="key"
            data-key="s"
        >
            S
        </div>

        <div
            class="key"
            data-key="d"
        >
            D
        </div>

        <div
            class="key"
            data-key="f"
        >
            F
        </div>

    </div>


    <!-- ========================= -->
    <!-- 시작 화면 -->
    <!-- ========================= -->

    <div
        class="overlay"
        id="startScreen"
    >

        <h1 id="startTitle">
            ASDF
        </h1>

        <p id="startInfo">
            곡을 준비하는 중...
        </p>

        <button
            class="start-button"
            id="startButton"
        >
            START
        </button>

    </div>


    <!-- ========================= -->
    <!-- 결과 화면 -->
    <!-- ========================= -->

    <div
        class="overlay result"
        id="resultScreen"
    >

        <h1>
            RESULT
        </h1>

        <div
            class="result-score"
            id="resultScore"
        >
            0
        </div>

        <div
            class="result-info"
            id="resultInfo"
        ></div>

        <button
            class="start-button"
            onclick="location.href='../'"
        >
            곡 선택으로
        </button>

    </div>


</div>


<script type="module">


/* ================================================= */
/* 곡 목록 */
/* ================================================= */

/*
    새 곡을 추가할 때:

    4: "new-song"

    처럼 한 줄 추가하면 된다.

    그러면:

    game/?song=4

    →
    ../tracks/new-song.js

    를 자동으로 불러온다.
*/

const SONGS = {

    1: "rhythm-walk"

    // 2: "laboratory",
    // 3: "gravity"

};


/* ================================================= */
/* URL에서 곡 번호 가져오기 */
/* ================================================= */

const params =
    new URLSearchParams(
        location.search
    );

const songNumber =
    params.get("song");


/* ================================================= */
/* 곡 번호가 없으면 곡 선택 화면으로 */
/* ================================================= */

if(!songNumber){

    location.href = "../";

    throw new Error(
        "Song not specified."
    );

}


/* ================================================= */
/* 곡 이름 찾기 */
/* ================================================= */

const trackName =
    SONGS[songNumber];


if(!trackName){

    document.getElementById(
        "startTitle"
    ).textContent =
        "곡을 찾을 수 없습니다.";

    document.getElementById(
        "startInfo"
    ).textContent =
        "존재하지 않는 곡입니다.";

    document.getElementById(
        "startButton"
    ).style.display =
        "none";

    throw new Error(
        "Unknown song."
    );

}


/* ================================================= */
/* 곡 데이터 불러오기 */
/* ================================================= */

let TRACK;


try{

    const module =
        await import(
            `../tracks/${trackName}.js`
        );

    TRACK =
        module.default;

}
catch(error){

    console.error(error);

    document.getElementById(
        "startTitle"
    ).textContent =
        "곡을 불러올 수 없습니다.";

    document.getElementById(
        "startInfo"
    ).textContent =
        `tracks/${trackName}.js 파일을 확인해주세요.`;

    document.getElementById(
        "startButton"
    ).style.display =
        "none";

    throw error;

}


if(!TRACK){

    throw new Error(
        "Track data is empty."
    );

}


/* ================================================= */
/* 곡 기본 정보 */
/* ================================================= */

const songTitle =
    document.getElementById(
        "songTitle"
    );

const startTitle =
    document.getElementById(
        "startTitle"
    );

const startInfo =
    document.getElementById(
        "startInfo"
    );


songTitle.textContent =
    TRACK.title ||
    "Unknown Track";


startTitle.textContent =
    TRACK.title ||
    "ASDF";


startInfo.innerHTML =

    `${TRACK.artist || "Unknown Artist"}<br>
     ${TRACK.notes?.length || 0} Notes`;


/* ================================================= */
/* 게임 요소 */
/* ================================================= */

const playfield =
    document.getElementById(
        "playfield"
    );


const lanes =
    [
        ...document.querySelectorAll(
            ".lane"
        )
    ];


const keys =
    [
        ...document.querySelectorAll(
            ".key"
        )
    ];


const scoreElement =
    document.getElementById(
        "score"
    );


const judgementElement =
    document.getElementById(
        "judgement"
    );


const startScreen =
    document.getElementById(
        "startScreen"
    );


const resultScreen =
    document.getElementById(
        "resultScreen"
    );


const resultScore =
    document.getElementById(
        "resultScore"
    );


const resultInfo =
    document.getElementById(
        "resultInfo"
    );


/* ================================================= */
/* 게임 변수 */
/* ================================================= */

let audio = null;

let started = false;

let finished = false;

let animationFrame = null;

let score = 0;

let combo = 0;

let maxCombo = 0;

let perfect = 0;

let good = 0;

let miss = 0;


/* ================================================= */
/* 판정 설정 */
/* ================================================= */

const APPROACH_TIME =
    TRACK.approachTime ||
    1200;


const PERFECT_WINDOW =
    70;


const GOOD_WINDOW =
    140;


const MISS_WINDOW =
    220;


/* ================================================= */
/* 음원 */
/* ================================================= */

if(!TRACK.audio){

    startInfo.innerHTML +=
        "<br>⚠ 음원 경로가 없습니다.";

}
else{

    audio =
        new Audio(
            TRACK.audio
        );

    audio.preload =
        "auto";

    audio.volume =
        TRACK.volume ?? 1;

}


/* ================================================= */
/* 노트 데이터 */
/* ================================================= */

const activeNotes = [];


/* ================================================= */
/* 시간 변환 */
/* ================================================= */

/*
    곡 데이터의 time이

    2000
    2500
    3000

    같은 밀리초 단위라면
    게임 내부에서는 초 단위로 변환한다.

    이미 0~60 정도의 초 단위라면
    그대로 사용한다.
*/

function getNoteTime(note){

    const time =
        Number(note.time);

    if(!Number.isFinite(time))
        return 0;

    if(time > 100)
        return time / 1000;

    return time;

}


/* ================================================= */
/* 노트 Y 위치 */
/* ================================================= */

function getNoteY(
    noteTime,
    currentTime
){

    const difference =
        noteTime -
        currentTime;


    const progress =
        1 -
        (
            difference /
            (APPROACH_TIME / 1000)
        );


    const startY =
        -70;


    const judgementY =
        playfield.clientHeight -
        103;


    return startY +
        (
            judgementY -
            startY
        ) *
        progress;

}


/* ================================================= */
/* 노트 생성 */
/* ================================================= */

function createNote(note){

    const lane =
        lanes[
            Number(note.lane)
        ];


    if(!lane)
        return;


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "note";


    element.dataset.hit =
        "false";


    lane.appendChild(
        element
    );


    activeNotes.push({

        data:note,

        element:element,

        hit:false,

        missed:false,

        time:getNoteTime(note)

    });

}


/* ================================================= */
/* 판정 */
/* ================================================= */

function judgeLane(
    laneIndex
){

    if(
        !started ||
        finished ||
        !audio
    )
        return;


    const currentTime =
        audio.currentTime;


    let candidate = null;

    let smallestDifference =
        Infinity;


    for(
        const note
        of activeNotes
    ){

        if(
            note.hit ||
            note.missed
        )
            continue;


        if(
            Number(note.data.lane) !==
            laneIndex
        )
            continue;


        const difference =
            Math.abs(
                note.time -
                currentTime
            );


        if(
            difference <
            smallestDifference
        ){

            smallestDifference =
                difference;

            candidate =
                note;

        }

    }


    if(!candidate)
        return;


    if(
        smallestDifference <=
        PERFECT_WINDOW / 1000
    ){

        hitNote(
            candidate,
            "PERFECT",
            1000
        );

    }

    else if(
        smallestDifference <=
        GOOD_WINDOW / 1000
    ){

        hitNote(
            candidate,
            "GOOD",
            500
        );

    }

    else if(
        candidate.time <
        currentTime
    ){

        missNote(
            candidate
        );

    }

}


/* ================================================= */
/* 노트 적중 */
/* ================================================= */

function hitNote(
    note,
    judgement,
    points
){

    if(
        note.hit ||
        note.missed
    )
        return;


    note.hit =
        true;


    note.element.remove();


    combo++;


    maxCombo =
        Math.max(
            maxCombo,
            combo
        );


    if(
        judgement ===
        "PERFECT"
    )
        perfect++;

    else
        good++;


    score +=
        points +
        combo * 10;


    updateScore();


    showJudgement(
        judgement
    );

}


/* ================================================= */
/* MISS */
/* ================================================= */

function missNote(
    note
){

    if(
        note.hit ||
        note.missed
    )
        return;


    note.missed =
        true;


    note.element.remove();


    combo = 0;

    miss++;


    showJudgement(
        "MISS"
    );


    updateScore();

}


/* ================================================= */
/* 점수 업데이트 */
/* ================================================= */

function updateScore(){

    scoreElement.textContent =
        String(score)
            .padStart(
                6,
                "0"
            );

}


/* ================================================= */
/* 판정 표시 */
/* ================================================= */

function showJudgement(
    text
){

    judgementElement.textContent =
        text;


    judgementElement.classList.remove(
        "show"
    );


    void judgementElement.offsetWidth;


    judgementElement.classList.add(
        "show"
    );

}


/* ================================================= */
/* 게임 루프 */
/* ================================================= */

let nextNoteIndex = 0;


function gameLoop(){

    if(
        !started ||
        finished ||
        !audio
    )
        return;


    const currentTime =
        audio.currentTime;


    /* ========================= */
    /* 노트 생성 */
    /* ========================= */

    while(
        nextNoteIndex <
        TRACK.notes.length
    ){

        const note =
            TRACK.notes[
                nextNoteIndex
            ];


        const noteTime =
            getNoteTime(
                note
            );


        if(
            noteTime -
            currentTime <=
            APPROACH_TIME / 1000
        ){

            createNote(
                note
            );

            nextNoteIndex++;

        }

        else{

            break;

        }

    }


    /* ========================= */
    /* 노트 이동 */
    /* ========================= */

    for(
        const note
        of activeNotes
    ){

        if(
            note.hit ||
            note.missed
        )
            continue;


        const y =
            getNoteY(
                note.time,
                currentTime
            );


        note.element.style.top =
            `${y}px`;


        /* ========================= */
        /* MISS */
        /* ========================= */

        if(
            currentTime -
            note.time >
            MISS_WINDOW / 1000
        ){

            missNote(
                note
            );

        }

    }


    /* ========================= */
    /* 곡 종료 */
    /* ========================= */

    if(
        audio.ended
    ){

        finishGame();

        return;

    }


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* ================================================= */
/* 게임 시작 */
/* ================================================= */

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        startGame
    );


async function startGame(){

    if(started)
        return;


    if(!audio){

        alert(
            "음원을 불러올 수 없습니다."
        );

        return;

    }


    started =
        true;


    startScreen.style.display =
        "none";


    try{

        audio.currentTime =
            0;


        await audio.play();


    }
    catch(error){

        console.error(
            error
        );


        started =
            false;


        startScreen.style.display =
            "flex";


        alert(
            "음원을 재생할 수 없습니다."
        );


        return;

    }


    gameLoop();

}


/* ================================================= */
/* 게임 종료 */
/* ================================================= */

function finishGame(){

    if(finished)
        return;


    finished =
        true;


    cancelAnimationFrame(
        animationFrame
    );


    for(
        const note
        of activeNotes
    ){

        if(note.element)
            note.element.remove();

    }


    resultScore.textContent =
        score.toLocaleString();


    resultInfo.innerHTML =

        `PERFECT ${perfect}
         · GOOD ${good}
         · MISS ${miss}
         <br>
         MAX COMBO ${maxCombo}`;


    resultScreen.style.display =
        "flex";

}


/* ================================================= */
/* 키보드 입력 */
/* ================================================= */

const keyMap = {

    a:0,

    s:1,

    d:2,

    f:3

};


document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        /* ========================= */
        /* ESC */
        /* ========================= */

        if(
            key ===
            "escape"
        ){

            if(audio)
                audio.pause();


            location.href =
                "../";


            return;

        }


        if(
            keyMap[key] ===
            undefined
        )
            return;


        event.preventDefault();


        pressKey(
            keyMap[key]
        );

    }
);


/* ================================================= */
/* 키 입력 처리 */
/* ================================================= */

function pressKey(
    laneIndex
){

    const key =
        keys[
            laneIndex
        ];


    if(key){

        key.classList.add(
            "active"
        );


        setTimeout(
            () => {

                key.classList.remove(
                    "active"
                );

            },
            80
        );

    }


    judgeLane(
        laneIndex
    );

}


/* ================================================= */
/* 모바일 터치 */
/* ================================================= */

keys.forEach(
    (
        key,
        index
    ) => {

        key.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();


                pressKey(
                    index
                );

            }
        );

    }
);


/* ================================================= */
/* 레인 전체 터치 */
/* ================================================= */

lanes.forEach(
    (
        lane,
        index
    ) => {

        lane.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();


                pressKey(
                    index
                );

            }
        );

    }
);


/* ================================================= */
/* 페이지를 떠날 때 */
/* ================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(audio){

            audio.pause();

        }

    }
);


</script>

</body>

</html>
