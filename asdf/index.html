<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>ASDF</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

}

body{

    background:#080808;
    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action:none;

}


/* ========================= */
/* 전체 화면 */
/* ========================= */

#app{

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;
    align-items:center;

}


/* ========================= */
/* 공통 화면 */
/* ========================= */

.screen{

    width:100%;
    height:100%;

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    padding:25px;

}

.screen.active{

    display:flex;

}


/* ========================= */
/* 홈 버튼 */
/* ========================= */

.home{

    position:fixed;

    top:20px;
    left:20px;

    padding:10px 16px;

    background:#151515;

    border:1px solid #333;

    border-radius:10px;

    color:white;

    font-size:13px;

    cursor:pointer;

    transition:.2s;

    z-index:100;

}

.home:hover{

    background:#222;

    border-color:#555;

}


/* ========================= */
/* 시작 화면 */
/* ========================= */

.logo{

    font-size:72px;

    font-weight:900;

    letter-spacing:12px;

    margin-bottom:15px;

}

.logo-sub{

    color:#666;

    font-size:12px;

    letter-spacing:4px;

    margin-bottom:65px;

}


.question{

    color:#aaa;

    font-size:17px;

    margin-bottom:25px;

}


.menu-buttons{

    display:flex;

    gap:12px;

}


button{

    font-family:inherit;

}


.menu-button{

    min-width:160px;

    padding:15px 25px;

    border-radius:12px;

    border:1px solid #333;

    background:#151515;

    color:white;

    font-size:15px;

    cursor:pointer;

    transition:.2s;

}

.menu-button:hover{

    background:#222;

    border-color:#555;

    transform:translateY(-2px);

}

.menu-button.primary{

    background:white;

    color:black;

    border-color:white;

}


/* ========================= */
/* 튜토리얼 */
/* ========================= */

.tutorial{

    max-width:700px;

    text-align:center;

}


.tutorial-title{

    font-size:30px;

    font-weight:800;

    margin-bottom:12px;

}


.tutorial-description{

    color:#888;

    font-size:14px;

    line-height:1.6;

    margin-bottom:40px;

}


.lanes{

    width:100%;

    max-width:560px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;

    margin-bottom:30px;

}


.lane{

    height:180px;

    background:#111;

    border:1px solid #333;

    border-radius:14px;

    display:flex;

    justify-content:center;

    align-items:flex-end;

    padding-bottom:20px;

    position:relative;

    overflow:hidden;

}


.key{

    width:58px;
    height:58px;

    border-radius:12px;

    background:#222;

    border:1px solid #444;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:20px;

    font-weight:800;

}


.tutorial-note{

    position:absolute;

    width:38px;
    height:38px;

    border-radius:50%;

    background:white;

    top:25px;

    left:50%;

    transform:translateX(-50%);

    animation:noteMove 1.8s infinite linear;

}


@keyframes noteMove{

    from{

        top:20px;

    }

    to{

        top:110px;

    }

}


.tutorial-message{

    color:#aaa;

    font-size:14px;

    min-height:22px;

    margin-bottom:25px;

}


.tutorial-buttons{

    display:flex;

    gap:10px;

}


/* ========================= */
/* 곡 선택 */
/* ========================= */

.select{

    width:100%;

    max-width:650px;

}


.select-title{

    text-align:center;

    font-size:32px;

    font-weight:800;

    margin-bottom:35px;

}


.song-list{

    display:flex;

    flex-direction:column;

    gap:10px;

}


.song{

    width:100%;

    padding:18px 20px;

    background:#111;

    border:1px solid #292929;

    border-radius:13px;

    color:white;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:space-between;

    text-align:left;

    transition:.2s;

}


.song:hover{

    background:#191919;

    border-color:#444;

    transform:translateX(3px);

}


.song-number{

    color:#555;

    font-size:12px;

    width:35px;

}


.song-name{

    flex:1;

    font-size:15px;

    font-weight:600;

}


.song-info{

    color:#666;

    font-size:11px;

}


.locked-song{

    opacity:.4;

    cursor:not-allowed;

}


.locked-song:hover{

    transform:none;

    background:#111;

    border-color:#292929;

}


.back{

    margin-top:25px;

    background:transparent;

    border:none;

    color:#666;

    cursor:pointer;

    font-size:13px;

}


.back:hover{

    color:white;

}


/* ========================= */
/* 모바일 터치 영역 */
/* ========================= */

.touch-controls{

    display:none;

}


/* ========================= */
/* 모바일 */
/* ========================= */

@media(max-width:768px){

    .home{

        top:15px;
        left:15px;

        padding:9px 13px;

        font-size:12px;

    }

    .logo{

        font-size:48px;

        letter-spacing:8px;

    }

    .logo-sub{

        font-size:10px;

        margin-bottom:45px;

    }

    .question{

        font-size:15px;

    }

    .menu-buttons{

        width:100%;

        max-width:320px;

        flex-direction:column;

    }

    .menu-button{

        width:100%;

    }

    .tutorial{

        width:100%;

    }

    .tutorial-title{

        font-size:25px;

    }

    .tutorial-description{

        font-size:13px;

        margin-bottom:25px;

    }

    .lanes{

        max-width:420px;

        gap:6px;

    }

    .lane{

        height:210px;

        border-radius:10px;

    }

    .key{

        width:52px;

        height:52px;

    }

    .select{

        max-width:420px;

    }

    .select-title{

        font-size:27px;

        margin-bottom:25px;

    }

}


/* ========================= */
/* 작은 스마트폰 */
/* ========================= */

@media(max-width:480px){

    .screen{

        padding:18px;

    }

    .logo{

        font-size:38px;

        letter-spacing:6px;

    }

    .question{

        font-size:14px;

    }

    .tutorial-title{

        font-size:22px;

    }

    .tutorial-description{

        font-size:12px;

    }

    .lane{

        height:180px;

    }

    .key{

        width:45px;
        height:45px;

        font-size:16px;

    }

    .song{

        padding:16px;

    }

    .song-name{

        font-size:14px;

    }

}


/* ========================= */
/* 터치 피드백 */
/* ========================= */

.key.active{

    background:white;

    color:black;

    transform:scale(.92);

}

</style>

</head>


<body>


<!-- ========================= -->
<!-- 메인 화면으로 -->
<!-- ========================= -->

<button
    class="home"
    onclick="location.href='../'"
>
    🏠 메인 화면
</button>


<div id="app">


<!-- ========================= -->
<!-- 시작 화면 -->
<!-- ========================= -->

<section
    id="startScreen"
    class="screen active"
>

    <div class="logo">
        ASDF
    </div>

    <div class="logo-sub">
        RHYTHM SYSTEM
    </div>

    <div class="question">
        처음 플레이하시나요?
    </div>

    <div class="menu-buttons">

        <button
            class="menu-button primary"
            onclick="location.href='tutorial/'"
        >
            튜토리얼
        </button>

        <button
            class="menu-button"
            onclick="location.href='game/'"
        >
            이미 해봤어요
        </button>

    </div>

</section>


<!-- ========================= -->
<!-- 튜토리얼 -->
<!-- ========================= -->

<section
    id="tutorialScreen"
    class="screen"
>

    <div class="tutorial">

        <div class="tutorial-title">
            ASDF TUTORIAL
        </div>

        <div class="tutorial-description">

            음악에 맞춰 떨어지는 노트를<br>
            A · S · D · F에 맞춰 눌러보세요.

        </div>


        <div class="lanes">

            <div class="lane">

                <div
                    class="tutorial-note"
                    id="noteA"
                ></div>

                <button
                    class="key"
                    data-key="a"
                >
                    A
                </button>

            </div>


            <div class="lane">

                <div
                    class="tutorial-note"
                    id="noteS"
                ></div>

                <button
                    class="key"
                    data-key="s"
                >
                    S
                </button>

            </div>


            <div class="lane">

                <div
                    class="tutorial-note"
                    id="noteD"
                ></div>

                <button
                    class="key"
                    data-key="d"
                >
                    D
                </button>

            </div>


            <div class="lane">

                <div
                    class="tutorial-note"
                    id="noteF"
                ></div>

                <button
                    class="key"
                    data-key="f"
                >
                    F
                </button>

            </div>

        </div>


        <div
            class="tutorial-message"
            id="tutorialMessage"
        >
            A / S / D / F 또는 화면의 버튼을 눌러보세요.
        </div>


        <div class="tutorial-buttons">

            <button
                class="menu-button"
                onclick="showStart()"
            >
                처음으로
            </button>

            <button
                class="menu-button primary"
                onclick="location.href='game/'"
            >
                곡 선택
            </button>

        </div>

    </div>

</section>


<!-- ========================= -->
<!-- 곡 선택 -->
<!-- ========================= -->

<section
    id="songScreen"
    class="screen"
>

    <div class="select">

        <div class="select-title">
            SELECT MUSIC
        </div>


        <div class="song-list">


            <button
                class="song"
                onclick="location.href='game/?song=1'"
            >

                <span class="song-number">
                    01
                </span>

                <span class="song-name">
                    First Contact
                </span>

                <span class="song-info">
                    EASY
                </span>

            </button>


            <button
                class="song"
                onclick="location.href='game/?song=2'"
            >

                <span class="song-number">
                    02
                </span>

                <span class="song-name">
                    Laboratory
                </span>

                <span class="song-info">
                    NORMAL
                </span>

            </button>


            <button
                class="song"
                onclick="location.href='game/?song=3'"
            >

                <span class="song-number">
                    03
                </span>

                <span class="song-name">
                    Gravity
                </span>

                <span class="song-info">
                    NORMAL
                </span>

            </button>


            <button
                class="song locked-song"
                disabled
            >

                <span class="song-number">
                    04
                </span>

                <span class="song-name">
                    ????
                </span>

                <span class="song-info">
                    LOCKED
                </span>

            </button>


            <button
                class="song locked-song"
                disabled
            >

                <span class="song-number">
                    05
                </span>

                <span class="song-name">
                    ????
                </span>

                <span class="song-info">
                    LOCKED
                </span>

            </button>


        </div>


        <button
            class="back"
            onclick="showStart()"
        >
            ← 처음 화면
        </button>

    </div>

</section>


</div>


<script>


/* ========================= */
/* 화면 전환 */
/* ========================= */

function hideAll(){

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });

}


function showStart(){

    hideAll();

    document
        .getElementById("startScreen")
        .classList.add("active");

}


function showTutorial(){

    hideAll();

    document
        .getElementById("tutorialScreen")
        .classList.add("active");

}


function showSongs(){

    hideAll();

    document
        .getElementById("songScreen")
        .classList.add("active");

}


/* ========================= */
/* 튜토리얼 입력 */
/* ========================= */

const keys =
    document.querySelectorAll(".key");


keys.forEach(key => {

    key.addEventListener(
        "pointerdown",
        () => {

            pressKey(
                key.dataset.key
            );

        }
    );

});


function pressKey(key){

    const button =
        document.querySelector(
            `.key[data-key="${key}"]`
        );

    if(!button) return;


    button.classList.add("active");


    setTimeout(() => {

        button.classList.remove("active");

    },120);


    document
        .getElementById("tutorialMessage")
        .textContent =
        `${key.toUpperCase()} 입력 확인!`;

}


/* ========================= */
/* 키보드 입력 */
/* ========================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        if(
            ["a","s","d","f"]
            .includes(key)
        ){

            pressKey(key);

        }

    }
);


/* ========================= */
/* 기존 함수 호환 */
/* ========================= */

function startSong(song){

    location.href =
        `game/?song=${song}`;

}


</script>


</body>

</html>
