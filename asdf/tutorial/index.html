<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ASDF Tutorial</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

}

body{

    background:#080808;
    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action:none;

}


/* ========================= */
/* 홈 */
/* ========================= */

.home{

    position:fixed;

    top:20px;
    left:20px;

    z-index:100;

    padding:10px 16px;

    border:1px solid #333;

    border-radius:10px;

    background:#151515;

    color:white;

    cursor:pointer;

}

.home:hover{

    background:#222;

}


/* ========================= */
/* 상단 정보 */
/* ========================= */

.info{

    position:fixed;

    top:25px;

    left:50%;

    transform:translateX(-50%);

    text-align:center;

    z-index:20;

    pointer-events:none;

}

.info h1{

    font-size:25px;

    letter-spacing:2px;

    margin-bottom:8px;

}

.info p{

    color:#777;

    font-size:13px;

}


/* ========================= */
/* 게임 영역 */
/* ========================= */

.game{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-47%);

    width:min(500px,92vw);

    height:min(680px,76vh);

    background:#0d0d0d;

    border:2px solid #333;

    border-radius:18px;

    overflow:hidden;

}


/* ========================= */
/* 레인 */
/* ========================= */

.lanes{

    position:absolute;

    inset:0;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

}

.lane{

    position:relative;

    border-left:1px solid #1c1c1c;

}

.lane:last-child{

    border-right:1px solid #1c1c1c;

}


/* ========================= */
/* 판정 영역 */
/* ========================= */

.judgement-line{

    position:absolute;

    left:0;

    bottom:100px;

    width:100%;

    height:2px;

    background:#666;

    box-shadow:
        0 0 12px
        rgba(255,255,255,.25);

    z-index:10;

}

.judgement-zone{

    position:absolute;

    left:0;

    bottom:100px;

    width:100%;

    height:70px;

    border-top:1px solid #222;

    border-bottom:1px solid #222;

    pointer-events:none;

    z-index:5;

}


/* ========================= */
/* 원형 노트 */
/* ========================= */

.note{

    position:absolute;

    width:24px;

    height:24px;

    border-radius:50%;

    background:#fff;

    color:#111;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:11px;

    font-weight:bold;

    z-index:8;

    box-shadow:
        0 0 12px
        rgba(255,255,255,.45);

    transform:
        translate(-50%,-50%);

}


/* ========================= */
/* 레인 키 */
/* ========================= */

.key-area{

    position:absolute;

    bottom:15px;

    left:0;

    width:100%;

    padding:0 10px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:7px;

    z-index:30;

}

.key{

    height:62px;

    border:1px solid #333;

    border-radius:12px;

    background:#151515;

    color:#aaa;

    font-size:19px;

    font-weight:bold;

    cursor:pointer;

    user-select:none;

    -webkit-tap-highlight-color:
        transparent;

}

.key.active{

    background:#fff;

    color:#000;

    transform:scale(.94);

}


/* ========================= */
/* 판정 텍스트 */
/* ========================= */

.judgement{

    position:absolute;

    left:50%;

    bottom:185px;

    transform:
        translateX(-50%);

    z-index:40;

    font-size:21px;

    font-weight:bold;

    opacity:0;

    pointer-events:none;

}

.judgement.show{

    animation:
        judgement .45s ease-out;

}

@keyframes judgement{

    0%{

        opacity:0;

        transform:
            translateX(-50%)
            translateY(8px)
            scale(.8);

    }

    25%{

        opacity:1;

    }

    100%{

        opacity:0;

        transform:
            translateX(-50%)
            translateY(-8px)
            scale(1);

    }

}


/* ========================= */
/* 진행 표시 */
/* ========================= */

.counter{

    position:absolute;

    top:15px;

    right:18px;

    color:#555;

    font-size:11px;

    z-index:30;

}


/* ========================= */
/* 완료 화면 */
/* ========================= */

.complete{

    position:fixed;

    inset:0;

    z-index:200;

    display:none;

    justify-content:center;

    align-items:center;

    background:
        rgba(0,0,0,.92);

    padding:20px;

}

.complete-box{

    width:min(450px,90vw);

    padding:35px 28px;

    text-align:center;

    background:#151515;

    border:1px solid #3a3a3a;

    border-radius:18px;

}

.complete-box h2{

    font-size:27px;

    margin-bottom:20px;

}

.complete-box p{

    color:#999;

    line-height:1.8;

    font-size:14px;

    margin-bottom:28px;

}

.confirm{

    border:0;

    border-radius:11px;

    background:white;

    color:#111;

    padding:14px 28px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}


/* ========================= */
/* 모바일 */
/* ========================= */

@media(max-width:600px){

    .info{

        top:18px;

    }

    .info h1{

        font-size:20px;

    }

    .info p{

        font-size:11px;

    }

    .home{

        top:15px;
        left:15px;

        padding:8px 12px;

        font-size:12px;

    }

    .game{

        width:94vw;

        height:70vh;

        transform:
            translate(-50%,-45%);

        border-radius:14px;

    }

    .note{

        width:22px;
        height:22px;

        font-size:10px;

    }

    .key{

        height:58px;

        font-size:17px;

    }

}


/* ========================= */
/* 아주 작은 화면 */
/* ========================= */

@media(max-height:650px){

    .game{

        height:67vh;

    }

    .info{

        top:10px;

    }

    .info h1{

        font-size:17px;

    }

}

</style>

</head>


<body>


<!-- 홈 -->

<button
    class="home"
    onclick="location.href='../'">

    🏠 홈

</button>


<!-- 설명 -->

<div class="info">

    <h1>ASDF TUTORIAL</h1>

    <p>
        노트가 판정선에 도착하는 순간 눌러보세요
    </p>

</div>


<!-- 게임 -->

<div class="game">

    <div class="lanes">

        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>

    </div>


    <div
        class="judgement-zone">
    </div>


    <div
        class="judgement-line">
    </div>


    <div
        class="judgement"
        id="judgement">
    </div>


    <div
        class="counter"
        id="counter">
    </div>


    <div
        class="key-area">

        <button
            class="key"
            data-key="a">
            A
        </button>

        <button
            class="key"
            data-key="s">
            S
        </button>

        <button
            class="key"
            data-key="d">
            D
        </button>

        <button
            class="key"
            data-key="f">
            F
        </button>

    </div>

</div>


<!-- 완료 -->

<div
    class="complete"
    id="complete">

    <div class="complete-box">

        <h2>
            튜토리얼 완료
        </h2>

        <p>

            기본적인 플레이 방법을 익혔습니다.<br><br>

            실제 곡을 플레이하는 동안에는<br>

            <strong>ESC</strong>를 눌러
            게임에서 나갈 수 있습니다.

        </p>

        <button
            class="confirm"
            onclick="location.href='../game/'">

            확인했어요

        </button>

    </div>

</div>


<script>

/* ========================= */
/* 설정 */
/* ========================= */

const KEYS =
    ["a","s","d","f"];

const TOTAL_NOTES =
    12;


/*
    판정선까지 도착하는 데 걸리는 시간.

    숫자가 작을수록
    노트가 빠르게 내려옵니다.
*/

const NOTE_TRAVEL_TIME =
    900;


/*
    판정 허용 오차.

    ±80ms 안이면
    PERFECT로 처리합니다.
*/

const PERFECT_WINDOW =
    80;


/*
    ±170ms 안이면
    GOOD으로 처리합니다.
*/

const GOOD_WINDOW =
    170;


/* ========================= */
/* 상태 */
/* ========================= */

let noteIndex = 0;

let currentNote = null;

let noteStartTime = 0;

let animationFrame = null;

let finished = false;


/* ========================= */
/* DOM */
/* ========================= */

const game =
    document.querySelector(".game");

const judgement =
    document.getElementById("judgement");

const counter =
    document.getElementById("counter");

const complete =
    document.getElementById("complete");


/* ========================= */
/* 레이아웃 계산 */
/* ========================= */

function getJudgeY(){

    return game.clientHeight - 100;

}


/* ========================= */
/* 노트 생성 */
/* ========================= */

function createNote(){

    if(noteIndex >= TOTAL_NOTES){

        finishTutorial();

        return;

    }


    const key =
        KEYS[
            Math.floor(
                Math.random()*KEYS.length
            )
        ];


    const lane =
        KEYS.indexOf(key);


    const note =
        document.createElement("div");

    note.className =
        "note";

    note.textContent =
        key.toUpperCase();


    /*
        레인 중앙에 배치
    */

    const laneWidth =
        game.clientWidth / 4;


    const x =
        laneWidth * lane
        + laneWidth / 2;


    note.style.left =
        x + "px";


    game.appendChild(note);


    currentNote = {

        element:note,

        key:key,

        lane:lane,

        spawnTime:
            performance.now(),

        targetTime:
            performance.now()
            + NOTE_TRAVEL_TIME

    };


    noteStartTime =
        currentNote.spawnTime;


    noteIndex++;


    updateCounter();


    animationFrame =
        requestAnimationFrame(
            updateNote
        );

}


/* ========================= */
/* 노트 움직임 */
/* ========================= */

function updateNote(time){

    if(!currentNote)
        return;


    const note =
        currentNote;


    const elapsed =
        time - note.spawnTime;


    const progress =
        elapsed /
        NOTE_TRAVEL_TIME;


    /*
        판정선 위쪽에서 시작해서
        판정선까지 내려옵니다.
    */

    const startY =
        -30;


    const targetY =
        getJudgeY();


    const y =
        startY
        + (targetY-startY)
        * progress;


    note.element.style.top =
        y + "px";


    /*
        판정 시간을 넘기면 MISS
    */

    if(progress >= 1){

        judge(
            note.key,
            "MISS"
        );

        return;

    }


    animationFrame =
        requestAnimationFrame(
            updateNote
        );

}


/* ========================= */
/* 입력 */
/* ========================= */

function pressKey(key){

    if(finished)
        return;


    animateKey(key);


    if(!currentNote)
        return;


    if(
        key !== currentNote.key
    ){

        return;

    }


    const now =
        performance.now();


    const difference =
        now -
        currentNote.targetTime;


    const absolute =
        Math.abs(difference);


    if(
        absolute <=
        PERFECT_WINDOW
    ){

        judge(
            key,
            "PERFECT"
        );

    }

    else if(
        absolute <=
        GOOD_WINDOW
    ){

        judge(
            key,
            difference < 0
                ? "EARLY"
                : "LATE"
        );

    }

}


/* ========================= */
/* 판정 */
/* ========================= */

function judge(
    key,
    result
){

    if(!currentNote)
        return;


    if(animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

    }


    currentNote.element.remove();

    currentNote = null;


    showJudgement(
        result
    );


    /*
        다음 노트.

        뒤로 갈수록
        조금씩 빨라집니다.
    */

    const delay =
        Math.max(
            180,
            500 - noteIndex*20
        );


    setTimeout(
        createNote,
        delay
    );

}


/* ========================= */
/* 판정 표시 */
/* ========================= */

function showJudgement(
    text
){

    judgement.textContent =
        text;


    judgement.classList.remove(
        "show"
    );


    void judgement.offsetWidth;


    judgement.classList.add(
        "show"
    );

}


/* ========================= */
/* 키 애니메이션 */
/* ========================= */

function animateKey(key){

    const button =
        document.querySelector(
            `.key[data-key="${key}"]`
        );


    if(!button)
        return;


    button.classList.add(
        "active"
    );


    setTimeout(
        ()=>{
            button.classList.remove(
                "active"
            );
        },
        100
    );

}


/* ========================= */
/* 진행 표시 */
/* ========================= */

function updateCounter(){

    counter.textContent =
        `${noteIndex} / ${TOTAL_NOTES}`;

}


/* ========================= */
/* 키보드 */
/* ========================= */

document.addEventListener(
    "keydown",
    function(event){

        const key =
            event.key.toLowerCase();


        if(
            KEYS.includes(key)
        ){

            event.preventDefault();

            pressKey(key);

        }

    }
);


/* ========================= */
/* 모바일 터치 */
/* ========================= */

document
    .querySelectorAll(".key")
    .forEach(
        button => {

            button.addEventListener(
                "pointerdown",
                function(event){

                    event.preventDefault();

                    pressKey(
                        button.dataset.key
                    );

                }
            );

        }
    );


/* ========================= */
/* 튜토리얼 완료 */
/* ========================= */

function finishTutorial(){

    finished = true;

    complete.style.display =
        "flex";

}


/* ========================= */
/* 시작 */
/* ========================= */

setTimeout(
    createNote,
    500
);

</script>

</body>

</html>
