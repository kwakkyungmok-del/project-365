<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Day Report — Project 365</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* ========================= */
/* 기본 */
/* ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
        radial-gradient(
            circle at top,
            #181818 0%,
            #0b0b0b 45%
        );

    color:#fff;

    font-family:
        'Inter',
        Arial,
        Helvetica,
        sans-serif;

    min-height:100vh;

    padding:40px 25px 60px;

}


/* ========================= */
/* 상단 */
/* ========================= */

.header{

    max-width:900px;

    margin:0 auto 35px;

    text-align:center;

}

.header-label{

    color:#777;

    font-size:11px;

    font-weight:700;

    letter-spacing:4px;

    margin-bottom:12px;

}

h1{

    font-size:38px;

    font-weight:800;

    letter-spacing:-1.5px;

    margin-bottom:12px;

}

.description{

    color:#777;

    font-size:14px;

}


/* ========================= */
/* 메인 버튼 */
/* ========================= */

.home{

    position:fixed;

    top:22px;
    left:22px;

    z-index:10;

    background:#151515;

    color:#ddd;

    border:1px solid #2d2d2d;

    padding:10px 15px;

    border-radius:12px;

    cursor:pointer;

    font-size:13px;

    font-weight:600;

    transition:.2s;

}

.home:hover{

    background:#222;

    border-color:#444;

    transform:translateY(-2px);

}


/* ========================= */
/* 진행 정보 */
/* ========================= */

.status{

    max-width:900px;

    margin:0 auto 25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    color:#777;

    font-size:12px;

}

.status strong{

    color:#ddd;

}


/* ========================= */
/* Day Grid */
/* ========================= */

.grid{

    display:grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    gap:12px;

    max-width:900px;

    margin:0 auto;

}


/* ========================= */
/* Day 버튼 */
/* ========================= */

.day{

    position:relative;

    height:62px;

    background:#181818;

    border:1px solid #303030;

    color:#ddd;

    border-radius:14px;

    cursor:pointer;

    font-family:inherit;

    font-size:12px;

    font-weight:700;

    letter-spacing:.5px;

    transition:

        transform .2s,

        background .2s,

        border-color .2s,

        box-shadow .2s;

}


/* 기록이 있는 날 */

.day.completed{

    background:
        linear-gradient(
            145deg,
            #20252b,
            #15181c
        );

    border-color:#48515b;

    color:#f2f2f2;

}


/* 마우스를 올렸을 때 */

.day.completed:hover{

    transform:translateY(-4px);

    background:#252b32;

    border-color:#697582;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);

}


/* 미기록 */

.day.locked{

    background:#111;

    border-color:#1d1d1d;

    color:#4b4b4b;

}

.day.locked:hover{

    background:#151515;

    color:#666;

}


/* 최근 기록 */

.day.latest{

    border-color:#8b8b8b;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 0 22px rgba(255,255,255,.07);

}


/* 최근 기록 표시 점 */

.day.latest::after{

    content:"";

    position:absolute;

    top:8px;
    right:9px;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#fff;

}


/* ========================= */
/* 모달 */
/* ========================= */

.modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.78);

    backdrop-filter:blur(7px);

    display:none;

    justify-content:center;

    align-items:center;

    padding:20px;

    z-index:100;

}

.box{

    width:520px;

    max-width:100%;

    background:#151515;

    border:1px solid #303030;

    border-radius:22px;

    padding:30px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.6);

    animation:appear .2s ease;

}

@keyframes appear{

    from{

        opacity:0;

        transform:translateY(10px) scale(.98);

    }

    to{

        opacity:1;

        transform:translateY(0) scale(1);

    }

}


.modal-day{

    color:#777;

    font-size:11px;

    font-weight:700;

    letter-spacing:3px;

    margin-bottom:10px;

}

.box h2{

    font-size:25px;

    margin-bottom:18px;

}

#content{

    color:#cfcfcf;

    font-size:14px;

    line-height:1.8;

    white-space:pre-line;

}

.close{

    margin-top:25px;

    padding:11px 20px;

    border:1px solid #333;

    background:#202020;

    color:white;

    border-radius:10px;

    cursor:pointer;

    font-family:inherit;

    transition:.2s;

}

.close:hover{

    background:#2b2b2b;

}


/* ========================= */
/* 모바일 */
/* ========================= */

@media(max-width:768px){

    body{

        padding:

            75px
            14px
            35px;

    }

    .home{

        top:15px;

        left:15px;

        padding:9px 12px;

        font-size:12px;

    }

    h1{

        font-size:30px;

    }

    .description{

        font-size:12px;

    }

    .status{

        margin-bottom:18px;

        padding:0 3px;

    }

    .grid{

        gap:8px;

    }

    .day{

        height:54px;

        border-radius:11px;

        font-size:10px;

    }

    .box{

        padding:24px;

        border-radius:19px;

    }

}


/* ========================= */
/* 작은 스마트폰 */
/* ========================= */

@media(max-width:420px){

    h1{

        font-size:26px;

    }

    .grid{

        gap:6px;

    }

    .day{

        height:48px;

        border-radius:10px;

        font-size:9px;

    }

    .status{

        font-size:10px;

    }

    .box h2{

        font-size:21px;

    }

    #content{

        font-size:13px;

    }

}


/* ========================= */
/* 아주 작은 화면 */
/* ========================= */

@media(max-width:340px){

    .grid{

        gap:4px;

    }

    .day{

        height:43px;

        font-size:8px;

    }

}

</style>

</head>


<body>


<!-- ========================= -->
<!-- 메인으로 -->
<!-- ========================= -->

<button
    class="home"
    onclick="location.href='../'"
>
    🏠 메인 화면
</button>


<!-- ========================= -->
<!-- 제목 -->
<!-- ========================= -->

<div class="header">

    <div class="header-label">
        PROJECT 365
    </div>

    <h1>
        Day Report
    </h1>

    <div class="description">
        365일 동안의 프로젝트 기록
    </div>

</div>


<!-- ========================= -->
<!-- 진행 정보 -->
<!-- ========================= -->

<div class="status">

    <div>
        기록된 날:
        <strong id="completedCount">0</strong>
        / 365
    </div>

    <div>
        최근:
        <strong id="latestDay">-</strong>
    </div>

</div>


<!-- ========================= -->
<!-- Day Grid -->
<!-- ========================= -->

<div
    class="grid"
    id="grid"
></div>


<!-- ========================= -->
<!-- 모달 -->
<!-- ========================= -->

<div
    class="modal"
    id="modal"
>

    <div class="box">

        <div
            class="modal-day"
            id="modalDay"
        ></div>

        <h2 id="title"></h2>

        <p id="content"></p>

        <button
            class="close"
            onclick="closeModal()"
        >
            닫기
        </button>

    </div>

</div>


<!-- ========================= -->
<!-- report.js -->
<!-- ========================= -->

<script src="../report.js"></script>


<script>

/* ========================= */
/* 기본 설정 */
/* ========================= */

const TOTAL_DAYS = 365;

const grid =
    document.getElementById("grid");


/* ========================= */
/* 가장 최근 기록 찾기 */
/* ========================= */

const latestReport =
    reports.length > 0

        ? reports.reduce(
            (latest, current) =>
                current.day > latest.day
                    ? current
                    : latest
        )

        : null;


/* ========================= */
/* 기록된 날짜 수 */
/* ========================= */

document.getElementById(
    "completedCount"
).textContent = reports.length;


document.getElementById(
    "latestDay"
).textContent =

latestReport

    ? `DAY ${String(latestReport.day).padStart(3,"0")}`

    : "-";


/* ========================= */
/* 365개 버튼 생성 */
/* ========================= */

for(
    let i = 1;
    i <= TOTAL_DAYS;
    i++
){

    const btn =
        document.createElement("button");


    btn.className = "day";


    btn.textContent =
        "DAY " +
        String(i).padStart(3,"0");


    /* 해당 날짜의 기록 찾기 */

    const data =
        reports.find(
            report => report.day === i
        );


    /* ========================= */
    /* 기록 있음 */
    /* ========================= */

    if(data){

        btn.classList.add(
            "completed"
        );


        /* 가장 최근 기록 */

        if(
            latestReport &&
            data.day === latestReport.day
        ){

            btn.classList.add(
                "latest"
            );

        }

    }


    /* ========================= */
    /* 기록 없음 */
    /* ========================= */

    else{

        btn.classList.add(
            "locked"
        );

    }


    /* ========================= */
    /* 클릭 */
    /* ========================= */

    btn.onclick =
        () => openReport(i);


    grid.appendChild(btn);

}


/* ========================= */
/* 기록 열기 */
/* ========================= */

function openReport(day){

    const data =
        reports.find(
            report => report.day === day
        );


    document.getElementById(
        "modal"
    ).style.display = "flex";


    if(data){

        document.getElementById(
            "modalDay"
        ).textContent =

            "DAY " +
            String(day).padStart(3,"0");


        document.getElementById(
            "title"
        ).innerText =
            data.title;


        document.getElementById(
            "content"
        ).innerText =
            data.content.trim();

    }

    else{

        document.getElementById(
            "modalDay"
        ).textContent =

            "DAY " +
            String(day).padStart(3,"0");


        document.getElementById(
            "title"
        ).innerText =
            "기록 없음";


        document.getElementById(
            "content"
        ).innerText =
            "아직 이 날의 활동 기록이 없습니다.";

    }

}


/* ========================= */
/* 모달 닫기 */
/* ========================= */

function closeModal(){

    document.getElementById(
        "modal"
    ).style.display = "none";

}


/* ========================= */
/* 배경 클릭으로 닫기 */
/* ========================= */

document.getElementById(
    "modal"
).addEventListener(
    "click",
    function(event){

        if(event.target === this){

            closeModal();

        }

    }
);


/* ========================= */
/* ESC로 닫기 */
/* ========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeModal();

        }

    }
);

</script>


</body>

</html>
