<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Day Report</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#0b0b0b;
    color:white;

    font-family:Arial, Helvetica, sans-serif;

    padding:40px;

}

h1{

    text-align:center;

    margin-bottom:35px;

}

.home{

    position:fixed;

    top:25px;
    left:25px;

    background:#181818;

    color:white;

    border:1px solid #333;

    padding:10px 16px;

    border-radius:8px;

    cursor:pointer;

    transition:.2s;

}

.home:hover{

    background:#2b2b2b;

}

.grid{

    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:12px;

    max-width:700px;

    margin:auto;

}

.day{

    height:55px;

    background:#181818;

    border:1px solid #333;

    color:white;

    cursor:pointer;

    border-radius:8px;

    transition:.2s;

}

.day:hover{

    background:#2b2b2b;

}

.modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    display:none;

    justify-content:center;

    align-items:center;

}

.box{

    width:500px;

    max-width:90%;

    background:#161616;

    border-radius:15px;

    padding:30px;

}

.box h2{

    margin-bottom:15px;

}

#content{

    white-space:pre-line;

    line-height:1.6;

    color:#ddd;

}

.close{

    margin-top:25px;

    padding:10px 20px;

    cursor:pointer;

}


/* ========================= */
/* 모바일 최적화 */
/* ========================= */

@media(max-width:768px){

    body{

        padding:80px 20px 30px;

    }

    h1{

        font-size:26px;

        margin-bottom:25px;

    }

    .home{

        top:18px;
        left:18px;

        padding:9px 13px;

        font-size:13px;

    }

    .grid{

        grid-template-columns:repeat(5,1fr);

        gap:7px;

        width:100%;

    }

    .day{

        height:48px;

        font-size:11px;

        border-radius:6px;

    }

    .box{

        padding:24px;

    }

}

@media(max-width:480px){

    .grid{

        gap:5px;

    }

    .day{

        height:44px;

        font-size:9px;

    }

    h1{

        font-size:22px;

    }

}

</style>

</head>

<body>


<!-- 메인 화면으로 -->

<button
    class="home"
    onclick="location.href='../'"
>
    🏠 메인 화면
</button>


<h1>365 Day Report</h1>


<!-- 365개 버튼 -->

<div
    class="grid"
    id="grid"
></div>


<!-- 기록 표시창 -->

<div
    class="modal"
    id="modal"
>

    <div class="box">

        <h2 id="title"></h2>

        <p id="content"></p>

        <button
            class="close"
            onclick="closeModal()"
        >
            닫기
        </button>

    </div>

</div>


<!-- ========================= -->
<!-- 기록 데이터 불러오기 -->
<!-- ========================= -->

<script src="../report.js"></script>


<script>

/* ========================= */
/* 365개 Day 버튼 생성 */
/* ========================= */

const grid =
    document.getElementById("grid");


for(let i = 1; i <= 365; i++){

    const btn =
        document.createElement("button");

    btn.className = "day";

    btn.textContent =
        "DAY " + String(i).padStart(3,"0");

    btn.onclick =
        () => openReport(i);

    grid.appendChild(btn);

}


/* ========================= */
/* 기록 열기 */
/* ========================= */

function openReport(day){

    const data =
        reports.find(
            report => report.day === day
        );


    document.getElementById("modal")
        .style.display = "flex";


    if(data){

        document.getElementById("title")
            .innerText = data.title;

        document.getElementById("content")
            .innerText = data.content.trim();

    }

    else{

        document.getElementById("title")
            .innerText = "Day " + day;

        document.getElementById("content")
            .innerText = "??";

    }

}


/* ========================= */
/* 닫기 */
/* ========================= */

function closeModal(){

    document.getElementById("modal")
        .style.display = "none";

}

</script>


</body>

</html>
