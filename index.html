<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1년 프로젝트</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0b0b;
    color:white;
    height:100vh;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

h1{
    font-family:'Press Start 2P', cursive;
    font-size:52px;
    line-height:1.6;
    margin-bottom:30px;
}

.subtitle{
    color:#8f8f8f;
    font-size:18px;
    margin-bottom:55px;
}

.start{
    background:white;
    color:black;
    border:none;
    border-radius:12px;
    padding:18px 42px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

.start:hover{
    transform:translateY(-4px);
    box-shadow:0 0 25px rgba(255,255,255,.35);
}

.log{
    position:absolute;
    top:25px;
    left:25px;
    border:1px solid #444;
    background:#141414;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

.log:hover{
    background:#222;
}

.day{
    position:absolute;
    right:25px;
    bottom:25px;
    color:#888;
    width:300px;
}

.version{
    margin-top:6px;
    font-size:12px;
    color:#666;
}

.progress-container{
    margin-top:16px;
}

.progress-text{
    font-size:13px;
    color:#999;
    margin-bottom:6px;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#222;
    border-radius:999px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:white;
    transition:.5s;
}

.remaining{
    margin-top:8px;
    font-size:12px;
    color:#666;
}

</style>

</head>

<body>

<!-- ===== 설정 ===== -->
<script>
const CURRENT_DAY = 2;
const TOTAL_DAY = 365;
</script>

<!-- 일별 활동내역 -->
<button class="log" onclick="location.href='dayreport/'">
📜 일별 활동내역
</button>

<!-- 중앙 -->
<div class="center">

    <h1>1년 프로젝트</h1>

    <div class="subtitle">
        매일 조금씩, 365일 동안 성장하는 웹사이트
    </div>

    <button class="start" onclick="location.href='project/'">
        프로젝트 시작
    </button>

</div>

<!-- 진행 상황 -->
<div class="day">

    <div id="dayText"></div>

    <div class="version" id="versionText"></div>

    <div class="progress-container">

        <div class="progress-text" id="percentText"></div>

        <div class="progress-bar">
            <div class="progress" id="progressBar"></div>
        </div>

        <div class="remaining" id="remainingText"></div>

    </div>

</div>

<script>

const percent = (CURRENT_DAY / TOTAL_DAY) * 100;
const remaining = TOTAL_DAY - CURRENT_DAY;

document.getElementById("dayText").textContent =
`DAY ${String(CURRENT_DAY).padStart(3,"0")} / ${TOTAL_DAY}`;

document.getElementById("versionText").textContent =
`v0.0.${CURRENT_DAY}`;

document.getElementById("percentText").textContent =
`${percent.toFixed(2)}% Completed`;

document.getElementById("remainingText").textContent =
`${remaining} Days Remaining`;

document.getElementById("progressBar").style.width =
percent + "%";

</script>

</body>
</html>
