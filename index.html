<script>
/*
    DAY 계산을 하드코딩(예: const CURRENT_DAY = 12)하지 않고,
    START_DATE를 기준으로 오늘 날짜와의 차이를 매번 계산합니다.
    -> 자정이 지나면 자동으로 DAY가 하루씩 올라갑니다.

    START_DATE = 1일째가 되는 날짜.
    예: 2026-08-17이 13일째이므로, 1일째는 2026-08-05 입니다.
*/
const START_DATE = new Date(2026, 7, 5); // 월(month)은 0부터 시작 -> 7 = 8월
const TOTAL_DAY = 365;

function getCurrentDay(){
    const today = new Date();

    // 시간(시,분,초)을 제거하고 '날짜'만 비교하기 위해 자정 기준으로 새로 생성
    const startMidnight = new Date(
        START_DATE.getFullYear(),
        START_DATE.getMonth(),
        START_DATE.getDate()
    );

    const todayMidnight = new Date(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
    );

    const diffDays = Math.round(
        (todayMidnight - startMidnight) / (1000 * 60 * 60 * 24)
    ) + 1; // 시작일 자체가 DAY 1

    // 1 미만이나 TOTAL_DAY 초과로 튀지 않도록 범위 고정
    return Math.min(Math.max(diffDays, 1), TOTAL_DAY);
}

const CURRENT_DAY = getCurrentDay();
</script>

        class="version"
        id="versionText"
    ></div>

        <div
            class="progress-text"
            id="percentText"
        ></div>

                class="progress"
                id="progressBar"
            ></div>

            class="remaining"
            id="remainingText"
        ></div>
    </div>
</div>

<script>
/* ========================= */
/* 진행률 계산 */
/* ========================= */
const percent = (CURRENT_DAY / TOTAL_DAY) * 100;
const remaining = TOTAL_DAY - CURRENT_DAY;

document.getElementById("dayText").textContent =
    `DAY ${String(CURRENT_DAY).padStart(3,"0")} / ${TOTAL_DAY}`;

document.getElementById("versionText").textContent =
    `v0.0.${CURRENT_DAY}`;

document.getElementById("percentText").textContent =
    `${percent.toFixed(2)}% Completed`;

document.getElementById("remainingText").textContent =
    `${remaining} Days Remaining`;

document.getElementById("progressBar").style.width = percent + "%";

/* ========================= */
/* 최근 활동 표시 */
/* ========================= */
const recentContainer = document.getElementById("recentActivities");

const recentReport = reports
    .slice()
    .sort((a,b) => b.day - a.day)[0];

if(recentReport){
    const activity = document.createElement("div");
    activity.className = "activity";

    const day = document.createElement("div");
    day.className = "activity-day";
    day.textContent = `DAY ${String(recentReport.day).padStart(3,"0")}`;

    const content = document.createElement("div");
    content.className = "activity-content";

    const firstLine = recentReport.content
        .trim()
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 0)[0];

    content.textContent = firstLine || recentReport.title;

    activity.appendChild(day);
    activity.appendChild(content);
    recentContainer.appendChild(activity);
}

/* ========================= */

    document.getElementById("funfactText").textContent = getRandomFunFact();
    document.getElementById("funfactOverlay").classList.add("active");
}

function closeFunFact(){
    document.getElementById("funfactOverlay").classList.remove("active");
}
</script>
<!-- ========================= -->
<!-- 배경음악 -->
<!-- ========================= -->
<audio id="bgm" src="project-365.mp3" loop preload="auto"></audio>

<script>
(function(){
    const bgm = document.getElementById("bgm");
    bgm.volume = 0.75; // 75% 크기

    function tryPlay(){
        const playPromise = bgm.play();
        if(playPromise !== undefined){
            playPromise.catch(() => {
                // 자동재생이 막힌 경우, 사용자가 처음 클릭/터치할 때 재생
                const startOnInteraction = () => {
                    bgm.play();
                    document.removeEventListener("click", startOnInteraction);
                    document.removeEventListener("touchstart", startOnInteraction);
                };
                document.addEventListener("click", startOnInteraction);
                document.addEventListener("touchstart", startOnInteraction);
            });
        }
    }

    tryPlay();
})();
</script>
