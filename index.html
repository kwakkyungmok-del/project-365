<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1년 프로젝트</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
    --blue:#6ea8ff;
    --purple:#a78bfa;
    --yellow:#f5c84b;
    --green:#4ade80;
    --red:#ff2020;
    --accent:#8b9dff;
    --panel:rgba(18,18,26,.62);
    --line:rgba(255,255,255,.09);
}

body{
    height:100vh;
    overflow:hidden;
    color:#fff;
    font-family:'Inter',Arial,Helvetica,sans-serif;
    background:
        radial-gradient(ellipse 80% 55% at 50% -10%,rgba(60,90,190,.20),transparent 70%),
        radial-gradient(ellipse 80% 55% at 50% 110%,rgba(110,70,190,.20),transparent 70%),
        #09090d;
    background-attachment:fixed;
}

/* ========================= */
/* 배경: 365 / glow / 입자 */
/* ========================= */
.bg-365{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    font-size:clamp(150px,44vw,720px);
    font-weight:900;
    letter-spacing:-.06em;
    line-height:1;
    white-space:nowrap;
    color:#fff;
    opacity:.035;
    pointer-events:none;
    user-select:none;
    z-index:0;
}

.bg-glow{
    position:fixed;
    top:50%;left:50%;
    width:min(720px,110vw);
    height:min(520px,70vh);
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center,rgba(120,130,255,.14),transparent 68%);
    filter:blur(30px);
    pointer-events:none;
    z-index:0;
    animation:breathe 9s ease-in-out infinite;
}

@keyframes breathe{
    0%,100%{opacity:.7}
    50%{opacity:1}
}

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.particle{
    position:absolute;
    bottom:-10px;
    border-radius:50%;
    background:rgba(190,200,255,.7);
    opacity:0;
    animation:floatUp linear infinite;
}

@keyframes floatUp{
    0%{transform:translateY(0);opacity:0}
    15%{opacity:.45}
    85%{opacity:.25}
    100%{transform:translateY(-110vh);opacity:0}
}

/* ========================= */
/* 중앙 */
/* ========================= */
.center{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    width:90%;
    max-width:700px;
    z-index:2;
}

.project-label{
    font-size:12px;
    font-weight:600;
    letter-spacing:6px;
    color:#7c80a0;
    margin-bottom:20px;
}

.project-label b{
    font-weight:800;
    background:linear-gradient(90deg,var(--blue),var(--purple));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

h1{
    font-size:68px;
    font-weight:800;
    letter-spacing:-3px;
    line-height:1.1;
    margin-bottom:26px;
    background:linear-gradient(180deg,#fff 30%,#b9bdd8);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 28px rgba(130,140,255,.28));
}

.title-line{
    width:60px;height:2px;
    margin:0 auto 26px auto;
    border-radius:2px;
    background:linear-gradient(90deg,var(--blue),var(--purple));
    box-shadow:0 0 14px rgba(140,150,255,.5);
}

.subtitle{
    color:#9598b0;
    font-size:17px;
    line-height:1.6;
    margin-bottom:42px;
}

.start{
    background:#fff;
    color:#0b0b10;
    border:none;
    border-radius:12px;
    padding:15px 36px;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    box-shadow:0 0 0 rgba(255,255,255,0);
    transition:.25s;
}

.start:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 30px rgba(150,160,255,.35),0 0 22px rgba(255,255,255,.25);
}

/* ========================= */
/* 공통 버튼 스타일 */
/* ========================= */
.log,
.japanvoca,
.cardgame,
.winner,
.lucky,
.funfact,
.thebutton-link{
    --c:var(--accent);
    z-index:3;
    font-family:inherit;
    border:1px solid var(--line);
    background:rgba(20,20,28,.7);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    color:#8a8ea8;
    cursor:pointer;
    transition:.25s;
}

.japanvoca,
.cardgame,
.winner,
.lucky,
.funfact,
.thebutton-link{
    position:absolute;
    right:25px;
    padding:10px 15px;
    border-radius:10px;
    font-size:12px;
    font-weight:600;
    letter-spacing:2px;
}

.japanvoca:hover,
.cardgame:hover,
.winner:hover,
.lucky:hover,
.funfact:hover,
.thebutton-link:hover{
    color:#fff;
    background:rgba(30,30,42,.85);
    border-color:var(--c);
    transform:translateY(-3px);
    box-shadow:0 0 18px color-mix(in srgb,var(--c) 30%,transparent);
}

.japanvoca{--c:var(--blue);top:75px}
.cardgame{--c:var(--purple);top:125px}
.winner{--c:var(--yellow);top:175px}
.lucky{--c:var(--green);top:25px}

/* 작은 포인트 점 */
.japanvoca::before,
.cardgame::before,
.winner::before,
.lucky::before,
.funfact::before{
    content:"";
    display:inline-block;
    width:5px;height:5px;
    margin-right:8px;
    vertical-align:middle;
    border-radius:50%;
    background:var(--c);
    box-shadow:0 0 8px var(--c);
    opacity:.8;
}

/* ========================= */
/* 일별 활동 / 문장 공유 */
/* ========================= */
.log{
    position:absolute;
    top:25px;left:25px;
    padding:12px 18px;
    border-radius:10px;
    color:#e8e9f5;
    font-size:14px;
}

.log:hover{
    background:rgba(34,34,48,.85);
    border-color:rgba(160,170,255,.5);
    transform:translateY(-2px);
    box-shadow:0 0 16px rgba(140,150,255,.18);
}

.sentence{top:75px;left:25px}

.top-actions{
    position:absolute;
    top:25px;left:25px;
    display:flex;
    gap:8px;
    z-index:3;
}

.top-actions .log{position:static}

.top-actions .mute{
    padding:12px 13px;
    font-size:14px;
    line-height:1.2;
}

.mute.off{opacity:.55}
.mute.off:hover{opacity:1}

/* ========================= */
/* FUN FACT 버튼 */
/* ========================= */
.funfact{
    --c:var(--blue);
    top:50%;
    transform:translateY(-50%);
    padding:12px 16px;
}

.funfact::before{display:none}

.funfact:hover{transform:translateY(-50%) translateY(-3px)}

/* ========================= */
/* 버튼 누르러 가기 */
/* ========================= */
.thebutton-link{
    --c:var(--red);
    top:calc(50% + 48px);
    width:150px;height:42px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    letter-spacing:1px;
}

.thebutton-link:hover{box-shadow:0 0 20px rgba(255,32,32,.32)}

.thebutton-circle{
    width:20px;height:20px;
    flex-shrink:0;
    filter:drop-shadow(0 0 5px rgba(255,32,32,.7));
    animation:pulse 2.6s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.14)}
}

/* ========================= */
/* FUN FACT 모달 */
/* ========================= */
.funfact-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(4,4,10,.72);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    z-index:100;
    align-items:center;
    justify-content:center;
}

.funfact-overlay.active{display:flex}

.funfact-box{
    background:rgba(20,20,30,.92);
    border:1px solid rgba(110,168,255,.28);
    border-radius:16px;
    padding:40px;
    max-width:480px;
    width:90%;
    text-align:center;
    box-shadow:0 0 50px rgba(90,130,255,.15);
    animation:funfactPop .25s ease;
}

@keyframes funfactPop{
    from{opacity:0;transform:scale(.95)}
    to{opacity:1;transform:scale(1)}
}

.funfact-label{
    font-size:12px;
    letter-spacing:3px;
    color:var(--blue);
    margin-bottom:18px;
    font-weight:700;
}

.funfact-text{
    font-size:18px;
    line-height:1.6;
    color:#eee;
    margin-bottom:28px;
}

.funfact-buttons{display:flex;gap:10px;justify-content:center}

.funfact-again,
.funfact-close{
    border:none;
    border-radius:10px;
    padding:12px 24px;
    font-size:14px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    transition:.2s;
}

.funfact-again{background:#fff;color:#000}
.funfact-again:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(255,255,255,.3)}
.funfact-close{background:#242432;color:#aaa}
.funfact-close:hover{background:#2e2e40;color:#fff}

/* ========================= */
/* 최근 활동 */
/* ========================= */
.recent{
    position:absolute;
    left:25px;bottom:25px;
    width:310px;
    background:var(--panel);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 44px 18px 18px;
    cursor:pointer;
    transition:.25s;
    z-index:3;
}

.recent::after{
    content:"→";
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    color:#6d7192;
    font-size:18px;
    transition:.25s;
}

.recent:hover{
    background:rgba(26,26,38,.75);
    border-color:rgba(160,170,255,.38);
    transform:translateY(-3px);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.recent:hover::after{color:#fff;right:14px}

.recent-title{
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    color:#7c80a0;
    padding-bottom:12px;
    margin-bottom:6px;
    border-bottom:1px solid var(--line);
}

.activity{padding:9px 0 2px}

.activity-day{
    font-size:11px;
    font-weight:600;
    color:var(--accent);
    margin-bottom:5px;
}

.activity-content{
    font-size:13px;
    color:#e2e3ee;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ========================= */
/* 진행 상황 */
/* ========================= */
.day{
    position:absolute;
    right:25px;bottom:25px;
    width:330px;
    color:#9598b0;
    background:var(--panel);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    display:grid;
    grid-template-columns:96px 1fr;
    gap:0 18px;
    align-items:center;
    z-index:3;
}

.ring{
    position:relative;
    width:96px;height:96px;
    grid-row:1 / span 2;
}

.ring svg{width:100%;height:100%;transform:rotate(-90deg)}

.ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:7}

.ring-fg{
    fill:none;
    stroke:url(#ringGrad);
    stroke-width:7;
    stroke-linecap:round;
    filter:drop-shadow(0 0 5px rgba(140,150,255,.55));
    transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);
}

.ring-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.ring-percent{font-size:18px;font-weight:800;color:#fff;letter-spacing:-.5px}
.ring-day{font-size:9px;font-weight:600;letter-spacing:1.5px;color:#7c80a0;margin-top:2px}

#dayText{
    font-size:15px;
    font-weight:700;
    color:#f0f1fa;
    letter-spacing:.5px;
    align-self:end;
}

.version{margin-top:4px;font-size:12px;color:#6d7192}

.progress-container{grid-column:1 / -1;margin-top:16px}

.progress-text{font-size:13px;color:#a4a7c0;margin-bottom:6px}

.progress-bar{
    width:100%;height:6px;
    background:rgba(255,255,255,.08);
    border-radius:999px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--blue),var(--purple));
    box-shadow:0 0 10px rgba(140,150,255,.6);
    transition:.5s;
}

.remaining{margin-top:8px;font-size:12px;color:#6d7192}

/* ========================= */
/* 모바일 */
/* ========================= */
@media(max-width:768px){

    body{overflow:auto;min-height:100vh}

    .center{top:42%;width:90%}

    .project-label{font-size:10px;letter-spacing:4px;margin-bottom:14px}
    h1{font-size:42px;letter-spacing:-2px}
    .subtitle{font-size:14px;margin-bottom:32px}
    .start{width:100%;max-width:260px;padding:15px;font-size:16px}

    .log{top:18px;left:18px;padding:11px 14px;font-size:13px}
    .sentence{top:65px;left:18px}
    .top-actions{top:18px;left:18px}
    .top-actions .mute{padding:11px 12px}

    .japanvoca,.cardgame,.winner,.lucky{right:18px;padding:10px 13px;font-size:11px}
    .lucky{top:18px}
    .japanvoca{top:65px}
    .cardgame{top:112px}
    .winner{top:159px}

    .funfact{right:18px;padding:11px 14px;font-size:11px}
    .thebutton-link{top:calc(50% + 46px);right:18px;width:140px;height:42px;font-size:11px}

    .funfact-box{padding:30px 24px}
    .funfact-text{font-size:16px}

    .recent{
        left:50%;
        transform:translateX(-50%);
        bottom:185px;
        width:90%;
        max-width:340px;
    }

    .recent:hover{transform:translateX(-50%) translateY(-3px)}

    .day{
        left:50%;
        right:auto;
        bottom:20px;
        transform:translateX(-50%);
        width:90%;
        max-width:340px;
        padding:14px 16px;
        grid-template-columns:76px 1fr;
        gap:0 14px;
    }

    .ring{width:76px;height:76px}
    .ring-percent{font-size:14px}
    .ring-day{font-size:8px}
    .progress-container{margin-top:12px}
}

/* ========================= */
/* 작은 스마트폰 */
/* ========================= */
@media(max-width:480px){
    h1{font-size:34px}
    .subtitle{font-size:13px}
    .activity-content{font-size:12px}
    .center{top:40%}
}

@media(prefers-reduced-motion:reduce){
    .particle,.bg-glow,.thebutton-circle{animation:none}
}
</style>
</head>

<body>

<!-- ========================= -->
<!-- 배경 장식 -->
<!-- ========================= -->
<div class="bg-glow"></div>
<div class="bg-365" aria-hidden="true">365</div>
<div class="particles" id="particles" aria-hidden="true"></div>

<!-- ========================= -->
<!-- 설정 -->
<!-- ========================= -->
<script>

/*
    DAY 계산을 하드코딩하지 않고
    START_DATE를 기준으로 오늘 날짜와의 차이를 계산합니다.
*/

const START_DATE = new Date(2026, 7, 5);
const TOTAL_DAY = 365;

function getCurrentDay(){

    const today = new Date();

    const startMidnight = new Date(
        START_DATE.getFullYear(),
        START_DATE.getMonth(),
        START_DATE.getDate()
    );

    const todayMidnight = new Date(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
    );

    const diffDays = Math.round(
        (todayMidnight - startMidnight) /
        (1000 * 60 * 60 * 24)
    ) + 1;

    return Math.min(
        Math.max(diffDays,1),
        TOTAL_DAY
    );
}

const CURRENT_DAY = getCurrentDay();

</script>

<!-- ========================= -->
<!-- 기록 데이터 불러오기 -->
<!-- ========================= -->
<script src="report.js"></script>
<script src="funfact.js"></script>

<!-- ========================= -->
<!-- 일별 활동내역 -->
<!-- ========================= -->
<div class="top-actions">

    <button
        class="log"
        onclick="location.href='dayreport/'"
    >
        📜 일별 활동내역
    </button>

    <button
        class="log mute"
        id="muteBtn"
        onclick="toggleMute()"
        aria-label="배경음악 켜기/끄기"
        title="배경음악 켜기/끄기"
    >
        🔊
    </button>

</div>

<!-- ========================= -->
<!-- 문장 공유 -->
<!-- ========================= -->
<button
    class="log sentence"
    onclick="location.href='sentence/'"
>
    문장 공유
</button>

<!-- ========================= -->
<!-- 우측 버튼 -->
<!-- ========================= -->

<button
    class="japanvoca"
    onclick="location.href='japanvoca/'"
>
    일본어 단어장
</button>

<button
    class="cardgame"
    onclick="location.href='cardgame/'"
>
    카드게임
</button>

<button
    class="winner"
    onclick="location.href='winner/'"
>
    당첨자 뽑기
</button>

<button
    class="lucky"
    onclick="location.href='lucky/'"
>
    운빨
</button>

<!-- ========================= -->
<!-- FUN FACT -->
<!-- ========================= -->

<button
    class="funfact"
    onclick="showFunFact()"
>
    💡 FUN FACT
</button>

<!-- ========================= -->
<!-- 버튼 누르러 가기 -->
<!-- ========================= -->

<button
    class="thebutton-link"
    onclick="location.href='thebutton/'"
>

    <svg
        class="thebutton-circle"
        viewBox="0 0 20 20"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
    >
        <circle
            cx="10"
            cy="10"
            r="8"
            fill="#ff2020"
        />
    </svg>

    버튼 누르러 가기

</button>

<!-- ========================= -->
<!-- FUN FACT 모달 -->
<!-- ========================= -->

<div
    class="funfact-overlay"
    id="funfactOverlay"
    onclick="if(event.target===this) closeFunFact()"
>

    <div class="funfact-box">

        <div class="funfact-label">
            FUN FACT
        </div>

        <div
            class="funfact-text"
            id="funfactText"
        ></div>

        <div class="funfact-buttons">

            <button
                class="funfact-again"
                onclick="showFunFact()"
            >
                다른 사실 보기
            </button>

            <button
                class="funfact-close"
                onclick="closeFunFact()"
            >
                닫기
            </button>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- 중앙 -->
<!-- ========================= -->

<div class="center">

    <div class="project-label">
        PROJECT <b>365</b>
    </div>

    <h1>
        1년 프로젝트
    </h1>

    <div class="title-line"></div>

    <div class="subtitle">
        매일 조금씩, 365일 동안 성장하는 웹사이트
    </div>

    <button
        class="start"
        onclick="location.href='project/'"
    >
        프로젝트 시작
    </button>

</div>

<!-- ========================= -->
<!-- 최근 활동 -->
<!-- ========================= -->

<div
    class="recent"
    onclick="location.href='dayreport/'"
>

    <div class="recent-title">
        RECENT ACTIVITY
    </div>

    <div id="recentActivities"></div>

</div>

<!-- ========================= -->
<!-- 진행 상황 -->
<!-- ========================= -->

<div class="day">

    <div class="ring">

        <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
                <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#6ea8ff"/>
                    <stop offset="100%" stop-color="#a78bfa"/>
                </linearGradient>
            </defs>
            <circle class="ring-bg" cx="50" cy="50" r="42"/>
            <circle class="ring-fg" id="ringFg" cx="50" cy="50" r="42"/>
        </svg>

        <div class="ring-center">
            <div class="ring-percent" id="ringPercent"></div>
            <div class="ring-day" id="ringDay"></div>
        </div>

    </div>

    <div>
        <div id="dayText"></div>

        <div
            class="version"
            id="versionText"
        ></div>
    </div>

    <div class="progress-container">

        <div
            class="progress-text"
            id="percentText"
        ></div>

        <div class="progress-bar">

            <div
                class="progress"
                id="progressBar"
            ></div>

        </div>

        <div
            class="remaining"
            id="remainingText"
        ></div>

    </div>

</div>

<script>

/* ========================= */
/* 진행률 계산 */
/* ========================= */

const percent =
    (CURRENT_DAY / TOTAL_DAY) * 100;

const remaining =
    TOTAL_DAY - CURRENT_DAY;

document.getElementById("dayText").textContent =
    `DAY ${String(CURRENT_DAY).padStart(3,"0")} / ${TOTAL_DAY}`;

document.getElementById("versionText").textContent =
    `v0.0.${CURRENT_DAY}`;

document.getElementById("percentText").textContent =
    `${percent.toFixed(2)}% Completed`;

document.getElementById("remainingText").textContent =
    `${remaining} Days Remaining`;

document.getElementById("progressBar").style.width =
    percent + "%";


/* ========================= */
/* 원형 진행률 링 */
/* ========================= */

document.getElementById("ringPercent").textContent =
    `${percent.toFixed(1)}%`;

document.getElementById("ringDay").textContent =
    `DAY ${String(CURRENT_DAY).padStart(3,"0")}`;

(function(){

    const ring = document.getElementById("ringFg");
    const circumference = 2 * Math.PI * 42;

    ring.style.strokeDasharray = circumference;
    ring.style.strokeDashoffset = circumference;

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            ring.style.strokeDashoffset =
                circumference * (1 - percent / 100);
        });
    });

})();


/* ========================= */
/* 배경 입자 (느리고 은은하게) */
/* ========================= */

(function(){

    const box = document.getElementById("particles");

    for(let i = 0; i < 16; i++){

        const p = document.createElement("span");
        const size = 1 + Math.random() * 2;

        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.animationDuration = (28 + Math.random() * 30) + "s";
        p.style.animationDelay = (-Math.random() * 50) + "s";

        box.appendChild(p);
    }

})();


/* ========================= */
/* 최근 활동 표시 */
/* ========================= */

const recentContainer =
    document.getElementById("recentActivities");

const recentReport = reports
    .slice()
    .sort((a,b) => b.day - a.day)[0];

if(recentReport){

    const activity =
        document.createElement("div");

    activity.className =
        "activity";


    const day =
        document.createElement("div");

    day.className =
        "activity-day";

    day.textContent =
        `DAY ${String(recentReport.day).padStart(3,"0")}`;


    const content =
        document.createElement("div");

    content.className =
        "activity-content";


    const firstLine =
        recentReport.content
        .trim()
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 0)[0];


    content.textContent =
        firstLine || recentReport.title;


    activity.appendChild(day);
    activity.appendChild(content);

    recentContainer.appendChild(activity);
}

/* ========================= */
/* 배경 음악 (잔잔하게 / 무한 반복) */
/* ========================= */

const bgm = new Audio("the_mountain-subtle-513390.mp3");

bgm.loop = true;
bgm.volume = 0.35;
bgm.preload = "auto";

/* 음소거 상태 (새로고침해도 유지) */
const muteBtn = document.getElementById("muteBtn");

function renderMute(){

    const muted = bgm.muted;

    muteBtn.textContent = muted ? "🔈" : "🔊";
    muteBtn.classList.toggle("off", muted);
}

function toggleMute(){

    bgm.muted = !bgm.muted;

    try{
        localStorage.setItem("bgmMuted", bgm.muted ? "1" : "0");
    }catch(e){}

    renderMute();
}

try{
    bgm.muted = localStorage.getItem("bgmMuted") === "1";
}catch(e){}

renderMute();

function startBgm(){

    bgm.play().then(() => {

        ["click","touchstart","keydown"].forEach(evt => {
            document.removeEventListener(evt, startBgm);
        });

    }).catch(() => {
        /* 자동재생이 차단되면 첫 사용자 입력 때 다시 시도 */
    });
}

/* 브라우저 정책상 자동재생이 막힐 수 있으므로
   먼저 시도하고, 실패하면 첫 클릭/터치/키 입력 때 재생 */
startBgm();

["click","touchstart","keydown"].forEach(evt => {
    document.addEventListener(evt, startBgm);
});

</script>
