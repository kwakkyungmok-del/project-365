<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일본어 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #faf7ef;
    --bg-line: #efe9d8;
    --card: #dceec8;
    --card-dark: #c6e2ac;
    --ink: #26331f;
    --ink-soft: #5c6b52;
    --deep: #3f6b32;
    --deep-dark: #2c4d23;
    --plum: #b5527a;
    --plum-soft: #f3dde6;
    --brass: #c9a227;
    --paper: #fffdf6;
    --shadow: rgba(63, 107, 50, 0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, transparent, transparent 34px, var(--bg-line) 34px, var(--bg-line) 35px),
      var(--bg);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding-bottom:80px;
  }
  .jp{ font-family:'Zen Maru Gothic', 'Noto Sans KR', sans-serif; }

  /* ---------- HEADER ---------- */
  header{
    max-width:880px;
    margin:0 auto;
    padding:34px 24px 18px;
  }
  .ring-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .ring-row span{
    width:14px;height:14px;border-radius:50%;
    background: var(--paper);
    border:3px solid var(--brass);
    box-shadow: inset 0 0 0 3px var(--bg);
  }
  h1{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:clamp(28px,5vw,40px);
    font-weight:900;
    margin:0 0 6px;
    color:var(--deep-dark);
    letter-spacing:-0.01em;
  }
  h1 small{
    display:block;
    font-family:'Noto Sans KR', sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .stats-bar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
  }
  .stat-chip{
    background:var(--paper);
    border:1px solid var(--bg-line);
    border-radius:14px;
    padding:10px 16px;
    display:flex;
    flex-direction:column;
    min-width:88px;
    box-shadow:0 2px 0 var(--bg-line);
  }
  .stat-chip .n{ font-size:22px; font-weight:900; color:var(--deep); font-family:'Zen Maru Gothic',sans-serif;}
  .stat-chip .l{ font-size:11px; color:var(--ink-soft); margin-top:2px;}

  /* ---------- NAV TABS ---------- */
  nav{
    max-width:880px;
    margin:0 auto;
    padding:0 24px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    background:linear-gradient(var(--bg) 80%, transparent);
    padding-top:14px;
    padding-bottom:14px;
    z-index:20;
  }
  .tab{
    font-family:'Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:9px 16px;
    border-radius:999px;
    background:var(--paper);
    border:1.5px solid var(--bg-line);
    color:var(--ink-soft);
    cursor:pointer;
    transition:.15s;
    white-space:nowrap;
  }
  .tab:hover{ border-color:var(--deep); color:var(--deep);}
  .tab.active{ background:var(--deep); border-color:var(--deep); color:#fff; box-shadow:0 3px 0 var(--deep-dark);}

  main{ max-width:880px; margin:0 auto; padding:10px 24px 40px; }

  .day-select{
    display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px;
  }
  .day-pill{
    font-size:12px; font-weight:700; padding:6px 12px; border-radius:8px;
    background:var(--paper); border:1px solid var(--bg-line); color:var(--ink-soft); cursor:pointer;
  }
  .day-pill.active{ background:var(--brass); border-color:var(--brass); color:#fff;}

  /* ---------- FLASHCARD GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:16px;
  }
  .flip-card{
    perspective:1000px;
    height:150px;
    cursor:pointer;
  }
  .flip-inner{
    position:relative; width:100%; height:100%;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0;
    border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    backface-visibility:hidden;
    padding:10px;
    text-align:center;
    box-shadow:0 4px 0 var(--shadow);
  }
  .face.front{ background:var(--card); }
  .face.front.mastered{ background: #cdeaa8; box-shadow:0 4px 0 var(--brass); }
  .face.front.review{ background: var(--plum-soft); box-shadow:0 4px 0 var(--plum); }
  .face.front .kana{ font-family:'Zen Maru Gothic',sans-serif; font-size:30px; font-weight:700; color:var(--deep-dark); line-height:1.15;}
  .face.back{
    background:var(--deep);
    color:#fff;
    transform:rotateY(180deg);
    gap:4px;
  }
  .face.back .romaji{ font-size:12px; letter-spacing:.06em; opacity:.8; text-transform:uppercase; font-weight:500;}
  .face.back .meaning{ font-size:16px; font-weight:700; margin-top:2px;}
  .mark-row{
    position:absolute; bottom:8px; display:flex; gap:6px;
  }
  .mark-btn{
    font-size:10px; font-weight:700; padding:4px 8px; border-radius:8px; border:none; cursor:pointer;
  }
  .mark-btn.know{ background:var(--brass); color:#fff; }
  .mark-btn.dontknow{ background:var(--plum); color:#fff; }

  /* badge for mastered ring */
  .badge{
    position:absolute; top:8px; right:8px; font-size:14px;
  }

  /* ---------- PHRASE LIST ---------- */
  .phrase-set-title{
    font-size:13px; font-weight:700; color:var(--ink-soft); margin:22px 0 10px; padding-left:2px;
  }
  .phrase-card{
    background:var(--paper); border:1px solid var(--bg-line); border-radius:16px;
    padding:16px 18px; margin-bottom:10px; cursor:pointer;
    box-shadow:0 2px 0 var(--bg-line);
  }
  .phrase-jp{ font-family:'Zen Maru Gothic',sans-serif; font-size:18px; font-weight:700; color:var(--deep-dark);}
  .phrase-kr{ font-size:14px; color:var(--ink-soft); margin-top:6px; display:none;}
  .phrase-card.shown .phrase-kr{ display:block; }
  .phrase-card.shown{ background:#fff9ec; }

  /* ---------- QUIZ ---------- */
  .quiz-wrap{
    background:var(--paper);
    border-radius:24px;
    padding:36px 24px;
    text-align:center;
    border:1px solid var(--bg-line);
    box-shadow:0 4px 0 var(--bg-line);
  }
  .quiz-progress{ font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:18px;}
  .quiz-word{
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:44px; font-weight:900; color:var(--deep-dark);
    margin-bottom:8px;
  }
  .quiz-romaji{ font-size:13px; color:var(--ink-soft); letter-spacing:.06em; text-transform:uppercase; margin-bottom:28px;}
  .quiz-options{ display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:480px; margin:0 auto;}
  .opt-btn{
    font-family:'Noto Sans KR',sans-serif;
    font-size:15px; font-weight:700; padding:16px 10px;
    background:var(--card); border:none; border-radius:14px; cursor:pointer;
    color:var(--deep-dark);
    box-shadow:0 3px 0 var(--card-dark);
    transition:.1s;
  }
  .opt-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--card-dark);}
  .opt-btn.correct{ background:var(--deep); color:#fff; box-shadow:0 3px 0 var(--deep-dark);}
  .opt-btn.wrong{ background:var(--plum); color:#fff; box-shadow:0 3px 0 #8a3a5a;}
  .opt-btn:disabled{ cursor:default; }
  .quiz-score{
    margin-top:26px; font-size:13px; color:var(--ink-soft); font-weight:700;
  }
  .quiz-next{
    margin-top:20px; display:none;
    background:var(--deep); color:#fff; border:none; font-weight:700;
    padding:12px 28px; border-radius:999px; cursor:pointer; font-family:'Noto Sans KR',sans-serif;
    box-shadow:0 3px 0 var(--deep-dark);
  }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty-state .em{ font-size:40px; margin-bottom:12px;}

  /* ---------- KANA REVIEW ---------- */
  .kana-subtabs{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .kana-type-row{ margin-bottom:18px; }
  .kana-subtab{
    font-size:13px; font-weight:700; padding:8px 16px; border-radius:999px;
    background:var(--paper); border:1.5px solid var(--bg-line); color:var(--ink-soft); cursor:pointer;
  }
  .kana-subtab.active{ background:var(--plum); border-color:var(--plum); color:#fff; }
  .kana-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  .kana-card{ perspective:800px; height:170px; cursor:pointer; }
  .kana-inner{
    position:relative; width:100%; height:100%;
    transition:transform .4s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .kana-card.flipped .kana-inner{ transform:rotateY(180deg); }
  .kana-face{
    position:absolute; inset:0; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden;
    box-shadow:0 3px 0 var(--bg-line);
  }
  .kana-face.front{ background:var(--card); font-family:'Zen Maru Gothic',sans-serif; font-size:72px; font-weight:700; color:var(--deep-dark); }
  .kana-face.front.mastered{ background:#cdeaa8; box-shadow:0 3px 0 var(--brass); }
  .kana-face.front.review{ background:var(--plum-soft); box-shadow:0 3px 0 var(--plum); }
  .kana-face.back{ background:var(--plum); color:#fff; transform:rotateY(180deg); font-size:22px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; flex-direction:column; gap:8px; padding:10px; }
  .kana-mnemonic{ font-size:13px; font-weight:500; text-transform:none; letter-spacing:0; opacity:.92; text-align:center; line-height:1.3; }
  .kana-face.back .mini-marks{ display:flex; gap:10px; }

  /* mnemonic (image-association) card — character overlaid on the image, positioned per-character to trace the matching shape */
  .kana-card.mnemonic-card{ height:360px; }
  .kana-card.mnemonic-card .kana-face.front{ font-size:56px; }
  .kana-card.mnemonic-card .kana-face.back{ gap:8px; padding:14px 10px; font-size:16px; }
  .mnemonic-visual{
    position:relative;
    width:140px; height:140px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.14);
    border-radius:22px;
    overflow:hidden;
  }
  .mnemonic-emoji{ font-size:88px; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25)); }

  /* custom-drawn round table (no matching emoji exists) */
  .mini-table{ position:relative; width:104px; height:92px; }
  .mini-table .top{
    position:absolute; top:0; left:8px;
    width:88px; height:26px;
    background:rgba(255,255,255,0.92);
    border-radius:50%;
    box-shadow:0 3px 0 rgba(0,0,0,0.15);
  }
  .mini-table .leg{
    position:absolute; top:20px;
    width:7px; height:60px;
    background:rgba(255,255,255,0.85);
    border-radius:3px;
  }
  .mini-table .l1{ left:16px; }
  .mini-table .l2{ left:36px; }
  .mini-table .l3{ left:62px; }
  .mini-table .l4{ left:82px; }
  .mnemonic-char-overlay{
    position:absolute;
    top:50%; left:50%;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size:98px;
    color:transparent;
    -webkit-text-stroke:2px rgba(255,255,255,0.45);
    text-shadow: 0 0 4px rgba(0,0,0,0.25);
    pointer-events:none;
    line-height:1;
  }
  .kana-shape-hint{
    font-size:11.5px;
    font-weight:500;
    text-transform:none;
    letter-spacing:0;
    text-align:center;
    line-height:1.35;
    opacity:.95;
    background:rgba(255,255,255,0.12);
    border-radius:10px;
    padding:6px 9px;
  }
  .kana-mnemonic-label{ font-size:14px; font-weight:700; text-transform:none; letter-spacing:0; text-align:center; line-height:1.3; }
  .kana-mnemonic-romaji{ font-size:12px; opacity:.85; text-transform:uppercase; letter-spacing:.06em; }
  .kana-face.back .mini-marks button{ font-size:15px; border:none; border-radius:10px; padding:8px 16px; cursor:pointer; font-weight:700; }
  .kana-face.back .mini-marks .k{ background:var(--brass); color:#fff; }
  .kana-face.back .mini-marks .d{ background:#8a3a5a; color:#fff; }
  .kana-note{ font-size:12px; color:var(--ink-soft); margin-bottom:16px; }

  footer{
    max-width:880px; margin:0 auto; padding:20px 24px; text-align:center;
    font-size:11px; color:var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce){
    .flip-inner{ transition:none; }
  }
</style>
</head>

   저장소 래퍼 — Claude 미리보기(window.storage)와
   폰에 다운로드해 독립 실행할 때(localStorage) 둘 다 지원
   ========================================================= */
const Store = {
  async get(key){
    if(typeof window.storage !== 'undefined' && window.storage){
      try{
        const r = await window.storage.get(key);
        return r ? r.value : null;
      }catch(e){ return null; }
    }
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  },
  async set(key, value){
    if(typeof window.storage !== 'undefined' && window.storage){
      try{ await window.storage.set(key, value); return; }catch(e){ /* fall through */ }
    }
    try{ localStorage.setItem(key, value); }catch(e){}
  }
};

/* =========================================================
   진행 상황 저장 — 단어별 마스터 상태
   ========================================================= */
const progress = {}; // kana -> {correct, wrong, streak, mastered}
const kanaProgress = {}; // char -> {correct, wrong, streak, mastered}
let currentMode = "cards";
let currentKanaSet = "hiragana"; // hiragana | katakana
let currentKanaType = "basic"; // basic | dakuten | handakuten | combo
let kanaViewMode = "cards"; // cards | quiz | review
let kanaQuizState = { pool: [], idx: 0, correctCount:0, total:0 };
  const correctSound = new Audio("../dragon-studio-correct-472358.mp3");
  const wrongSound = new Audio("../freesound_community-wrong-47985.mp3");
function playCorrectSound(){
  correctSound.currentTime = 0;
  correctSound.play().catch(()=>{ /* 자동재생 정책으로 막힐 수 있음, 무시 */ });
}
function playWrongSound(){
  wrongSound.currentTime = 0;
  wrongSound.play().catch(()=>{ /* 자동재생 정책으로 막힐 수 있음, 무시 */ });
}
let quizState = { pool: [], idx: 0, correctCount:0, total:0, answered:false };

async function loadProgress(){
  for(const w of WORDS){
    try{
      const r = await Store.get('progress:'+w.kana);
      progress[w.kana] = r ? JSON.parse(r) : {correct:0,wrong:0,streak:0,mastered:false};
    }catch(e){
      progress[w.kana] = {correct:0,wrong:0,streak:0,mastered:false};
    }
  }
  for(const k of [...HIRAGANA, ...KATAKANA, ...HIRAGANA_DAKUTEN, ...HIRAGANA_HANDAKUTEN, ...HIRAGANA_COMBO, ...KATAKANA_DAKUTEN, ...KATAKANA_HANDAKUTEN, ...KATAKANA_COMBO]){
    try{
      const r = await Store.get('kanachar:'+k.char);
      kanaProgress[k.char] = r ? JSON.parse(r) : {correct:0,wrong:0,streak:0,mastered:false};
    }catch(e){
      kanaProgress[k.char] = {correct:0,wrong:0,streak:0,mastered:false};
    }
  }
}
async function saveKanaProgress(char){
  try{ await Store.set('kanachar:'+char, JSON.stringify(kanaProgress[char])); }catch(e){}
}
function markKanaKnow(char){
  const p = kanaProgress[char];
  p.correct++; p.streak++; if(p.streak>=2) p.mastered = true;
  saveKanaProgress(char); renderKana();
}
function markKanaDontKnow(char){
  const p = kanaProgress[char];
  p.wrong++; p.streak=0; p.mastered=false;
  saveKanaProgress(char); renderKana();
}
async function saveProgress(kana){
  try{ await Store.set('progress:'+kana, JSON.stringify(progress[kana])); }catch(e){}
}
function markKnow(kana){
  const p = progress[kana];
  p.correct++; p.streak++; if(p.streak>=2) p.mastered = true;
  saveProgress(kana); render();
}
function markDontKnow(kana){
  const p = progress[kana];
  p.wrong++; p.streak=0; p.mastered=false;
  saveProgress(kana); render();
}

/* =========================================================
   렌더링
   ========================================================= */
function renderStats(){
  const total = WORDS.length;
  const mastered = WORDS.filter(w=>progress[w.kana] && progress[w.kana].mastered).length;
  const review = WORDS.filter(w=>progress[w.kana] && progress[w.kana].wrong>0 && !progress[w.kana].mastered).length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-chip"><div class="n">${total}</div><div class="l">전체 단어</div></div>
    <div class="stat-chip"><div class="n">${mastered}</div><div class="l">외운 단어</div></div>
    <div class="stat-chip"><div class="n">${review}</div><div class="l">복습 필요</div></div>
  `;
}

function renderCards(){
  let html = '<div class="grid">';
  WORDS.forEach(w=>{
    const p = progress[w.kana] || {mastered:false, wrong:0};
    let cls = '';
    if(p.mastered) cls='mastered'; else if(p.wrong>0) cls='review';
    html += `
      <div class="flip-card" data-kana="${w.kana}">
        <div class="flip-inner">
          <div class="face front ${cls}">
            <div class="kana jp">${w.kana}</div>
            ${p.mastered?'<div class="badge">⭐</div>':''}
          </div>
          <div class="face back">
            <div class="romaji">${w.romaji}</div>
            <div class="meaning">${w.meaning}</div>
            <div class="mark-row">
              <button class="mark-btn dontknow" onclick="event.stopPropagation();markDontKnow('${w.kana}')">모르겠어요</button>
              <button class="mark-btn know" onclick="event.stopPropagation();markKnow('${w.kana}')">외웠어요</button>
            </div>
          </div>
        </div>
      </div>`;
  });
  html += '</div>';
  document.getElementById('main').innerHTML = html;
  document.querySelectorAll('.flip-card').forEach(card=>{
    card.addEventListener('click', ()=> card.classList.toggle('flipped'));
  });
}

function renderReview(){
  const filtered = WORDS.filter(w=>{
    const p = progress[w.kana];
    return p && p.wrong>0 && !p.mastered;
  });
  if(filtered.length===0){
    document.getElementById('main').innerHTML = `<div class="empty-state"><div class="em">🌱</div>복습할 단어가 없어요.<br>카드학습이나 자가테스트에서 '모르겠어요'를 누른 단어가 여기 모여요.</div>`;
    return;
  }
  let html = '<div class="grid">';
  filtered.forEach(w=>{
    html += `
      <div class="flip-card" data-kana="${w.kana}">
        <div class="flip-inner">
          <div class="face front review">
            <div class="kana jp">${w.kana}</div>
          </div>
          <div class="face back">
            <div class="romaji">${w.romaji}</div>
            <div class="meaning">${w.meaning}</div>
            <div class="mark-row">
              <button class="mark-btn dontknow" onclick="event.stopPropagation();markDontKnow('${w.kana}')">모르겠어요</button>
              <button class="mark-btn know" onclick="event.stopPropagation();markKnow('${w.kana}')">외웠어요</button>
            </div>
          </div>
        </div>
      </div>`;
  });
  html += '</div>';
  document.getElementById('main').innerHTML = html;
  document.querySelectorAll('.flip-card').forEach(card=>{
    card.addEventListener('click', ()=> card.classList.toggle('flipped'));
  });
}

function renderPhrase(){
  const sets = [...new Set(PHRASES.map(p=>p.set))];
  let html = '';
  sets.forEach(s=>{
    html += `<div class="phrase-set-title">${s}</div>`;
    PHRASES.filter(p=>p.set===s).forEach((p,i)=>{
      html += `<div class="phrase-card" data-idx="${PHRASES.indexOf(p)}">
        <div class="phrase-jp jp">${p.jp}</div>
        <div class="phrase-kr">${p.kr}</div>
      </div>`;
    });
  });
  document.getElementById('main').innerHTML = html;
  document.querySelectorAll('.phrase-card').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('shown'));
  });
}

function renderKana(){
  const typeTabsHtml = KANA_TYPES.map(t=>{
    const arr = KANA_MAP[currentKanaSet + '_' + t.key];
    const masteredCount = arr.filter(k=>kanaProgress[k.char] && kanaProgress[k.char].mastered).length;
    return `<div class="kana-subtab ${currentKanaType===t.key?'active':''}" data-type="${t.key}">${t.label} (${masteredCount}/${arr.length})</div>`;
  }).join('');

  const header = `
    <div class="kana-note">한 글자씩 카드로 외우고, 뒷면 연상 이미지로 기억하고, 자가테스트로 확인하고, 복습 탭에서 헷갈리는 글자만 다시 보세요.</div>
    <div class="kana-subtabs">
      <div class="kana-subtab ${kanaViewMode==='cards'?'active':''}" data-viewmode="cards">🗂 카드학습</div>
      <div class="kana-subtab ${kanaViewMode==='quiz'?'active':''}" data-viewmode="quiz">✏️ 자가테스트</div>
      <div class="kana-subtab ${kanaViewMode==='review'?'active':''}" data-viewmode="review">🔁 복습</div>
    </div>
    <div class="kana-subtabs">
      <div class="kana-subtab ${currentKanaSet==='hiragana'?'active':''}" data-set="hiragana">히라가나</div>
      <div class="kana-subtab ${currentKanaSet==='katakana'?'active':''}" data-set="katakana">가타카나</div>
    </div>
    <div class="kana-subtabs kana-type-row">${typeTabsHtml}</div>
    <div id="kanaBody"></div>`;

  document.getElementById('main').innerHTML = header;

  document.querySelectorAll('[data-viewmode]').forEach(el=>{
    el.addEventListener('click', ()=>{ kanaViewMode = el.dataset.viewmode; renderKana(); });
  });
  document.querySelectorAll('[data-set]').forEach(el=>{
    el.addEventListener('click', ()=>{ currentKanaSet = el.dataset.set; renderKana(); });
  });
  document.querySelectorAll('[data-type]').forEach(el=>{
    el.addEventListener('click', ()=>{ currentKanaType = el.dataset.type; renderKana(); });
  });

  if(kanaViewMode==='cards') renderKanaCardsBody();
  else if(kanaViewMode==='review') renderKanaReviewBody();
  else if(kanaViewMode==='quiz') startKanaQuiz();
}

function kanaCardHtml(k, frontClass){
  const mnemonic = KANA_MNEMONICS[k.char];
  const cardClass = mnemonic ? 'kana-card mnemonic-card' : 'kana-card';
  let backContent = `${k.romaji}`;
  if(mnemonic){
    const p = mnemonic.pos;
    const overlayStyle = `transform: translate(-50%, -50%) translate(${p.x}px, ${p.y}px) rotate(${p.rot}deg) scale(${p.scale});`;
    const visualHtml = mnemonic.custom === 'table'
      ? `<div class="mini-table">
           <div class="top"></div>
           <div class="leg l1"></div><div class="leg l2"></div><div class="leg l3"></div><div class="leg l4"></div>
         </div>`
      : `<div class="mnemonic-emoji">${mnemonic.emoji}</div>`;
    backContent = `
            <div class="mnemonic-visual">
              ${visualHtml}
              <div class="mnemonic-char-overlay" style="${overlayStyle}">${k.char}</div>
            </div>
            <div class="kana-shape-hint">💡 ${mnemonic.shape}</div>
            <div class="kana-mnemonic-label">${mnemonic.label}</div>
            <div class="kana-mnemonic-romaji">${k.romaji}</div>`;
  }
  return `
      <div class="${cardClass}" data-char="${k.char}">
        <div class="kana-inner">
          <div class="kana-face front ${frontClass||''}">${k.char}</div>
          <div class="kana-face back">
            ${backContent}
            <div class="mini-marks">
              <button class="d" onclick="event.stopPropagation();markKanaDontKnow('${k.char}')">✗</button>
              <button class="k" onclick="event.stopPropagation();markKanaKnow('${k.char}')">✓</button>
            </div>
          </div>
        </div>
      </div>`;
}

function renderKanaCardsBody(){
  const list = KANA_MAP[currentKanaSet + '_' + currentKanaType];
  let html = '<div class="kana-grid">';
  list.forEach(k=>{
    const p = kanaProgress[k.char] || {mastered:false};
    html += kanaCardHtml(k, p.mastered ? 'mastered' : '');
  });
  html += '</div>';
  document.getElementById('kanaBody').innerHTML = html;
  document.querySelectorAll('#kanaBody .kana-card').forEach(card=>{
    card.addEventListener('click', ()=> card.classList.toggle('flipped'));
  });
}

function renderKanaReviewBody(){
  const list = KANA_MAP[currentKanaSet + '_' + currentKanaType];
  const filtered = list.filter(k=>{
    const p = kanaProgress[k.char];
    return p && p.wrong>0 && !p.mastered;
  });
  const body = document.getElementById('kanaBody');
  if(filtered.length===0){
    body.innerHTML = `<div class="empty-state"><div class="em">🌱</div>이 카테고리엔 복습할 글자가 없어요.<br>카드학습이나 자가테스트에서 ✗를 누른 글자가 여기 모여요.</div>`;
    return;
  }
  let html = '<div class="kana-grid">';
  filtered.forEach(k=>{
    html += kanaCardHtml(k, 'review');
  });
  html += '</div>';
  body.innerHTML = html;
  document.querySelectorAll('#kanaBody .kana-card').forEach(card=>{
    card.addEventListener('click', ()=> card.classList.toggle('flipped'));
  });
}

function kanaQuizMark(char, correct){
  const p = kanaProgress[char];
  if(correct){ p.correct++; p.streak++; if(p.streak>=2) p.mastered = true; }
  else { p.wrong++; p.streak = 0; p.mastered = false; }
  saveKanaProgress(char);
}

function startKanaQuiz(){
  const list = KANA_MAP[currentKanaSet + '_' + currentKanaType];
  kanaQuizState.pool = [...list].sort(()=>Math.random()-0.5);
  kanaQuizState.idx = 0;
  kanaQuizState.correctCount = 0;
  kanaQuizState.total = 0;
  renderKanaQuizBody();
}

function renderKanaQuizBody(){
  const body = document.getElementById('kanaBody');
  if(!body) return;
  const list = KANA_MAP[currentKanaSet + '_' + currentKanaType];
  if(list.length < 4){
    body.innerHTML = `<div class="empty-state">이 카테고리는 문항이 너무 적어서 테스트를 만들 수 없어요 (${list.length}자).<br>다른 카테고리를 선택해보세요.</div>`;
    return;
  }
  if(kanaQuizState.idx >= kanaQuizState.pool.length){
    body.innerHTML = `
      <div class="quiz-wrap">
        <div style="font-size:40px;margin-bottom:14px;">🎉</div>
        <div style="font-size:20px;font-weight:900;color:var(--deep-dark);margin-bottom:8px;">테스트 완료!</div>
        <div class="quiz-score">${kanaQuizState.total}문제 중 ${kanaQuizState.correctCount}개 정답</div>
        <button class="quiz-next" style="display:inline-block;margin-top:20px;" onclick="startKanaQuiz()">다시 풀기</button>
      </div>`;
    return;
  }
  const k = kanaQuizState.pool[kanaQuizState.idx];
  const wrongPool = list.filter(x=>x.char!==k.char).sort(()=>Math.random()-0.5).slice(0,3);
  const options = [k, ...wrongPool].sort(()=>Math.random()-0.5);

  let optHtml = '';
  options.forEach(o=>{
    optHtml += `<button class="opt-btn" data-correct="${o.char===k.char}" data-char="${o.char}">${o.romaji}</button>`;
  });

  body.innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-progress">${kanaQuizState.idx+1} / ${kanaQuizState.pool.length}</div>
      <div class="quiz-word jp">${k.char}</div>
      <div class="quiz-options">${optHtml}</div>
      <div class="quiz-score">맞은 개수: ${kanaQuizState.correctCount} / ${kanaQuizState.total}</div>
      <button class="quiz-next" id="kanaQuizNext">다음 문제 →</button>
    </div>`;

  document.querySelectorAll('#kanaBody .opt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const allBtns = document.querySelectorAll('#kanaBody .opt-btn');
      if(allBtns[0].disabled) return;
      allBtns.forEach(b=>b.disabled=true);
      kanaQuizState.total++;
      const isCorrect = btn.dataset.correct === 'true';
      if(isCorrect){ kanaQuizState.correctCount++; btn.classList.add('correct'); }
      else{
        btn.classList.add('wrong');
        allBtns.forEach(b=>{ if(b.dataset.correct==='true') b.classList.add('correct'); });
      }
      kanaQuizMark(k.char, isCorrect);
      document.getElementById('kanaQuizNext').style.display='inline-block';
    });
  });
  document.getElementById('kanaQuizNext').addEventListener('click', ()=>{
    kanaQuizState.idx++;
    renderKanaQuizBody();
  });
}

/* ---------- QUIZ ---------- */
function startQuiz(){
  quizState.pool = [...WORDS].sort(()=>Math.random()-0.5);
  quizState.idx = 0;
  quizState.correctCount = 0;
  quizState.total = 0;
  renderQuizQuestion();
}
function renderQuizQuestion(){
  if(quizState.idx >= quizState.pool.length){
    document.getElementById('main').innerHTML = `
      <div class="quiz-wrap">
        <div class="em" style="font-size:40px;margin-bottom:14px;">🎉</div>
        <div style="font-size:20px;font-weight:900;color:var(--deep-dark);margin-bottom:8px;">테스트 완료!</div>
        <div class="quiz-score">${quizState.total}문제 중 ${quizState.correctCount}개 정답</div>
        <button class="quiz-next" style="display:inline-block;margin-top:20px;" onclick="startQuiz()">다시 풀기</button>
      </div>`;
    return;
  }
  const w = quizState.pool[quizState.idx];
  const wrongPool = WORDS.filter(x=>x.kana!==w.kana).sort(()=>Math.random()-0.5).slice(0,3);
  const options = [w, ...wrongPool].sort(()=>Math.random()-0.5);
  quizState.answered = false;

  let optHtml = '';
  options.forEach(o=>{
    optHtml += `<button class="opt-btn" data-correct="${o.kana===w.kana}" data-kana="${o.kana}">${o.meaning}</button>`;
  });

  document.getElementById('main').innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-progress">${quizState.idx+1} / ${quizState.pool.length}</div>
      <div class="quiz-word jp">${w.kana}</div>
      <div class="quiz-romaji">${w.romaji}</div>
      <div class="quiz-options">${optHtml}</div>
      <div class="quiz-score">맞은 개수: ${quizState.correctCount} / ${quizState.total}</div>
      <button class="quiz-next" id="quizNext">다음 문제 →</button>
    </div>`;

  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(quizState.answered) return;
      quizState.answered = true;
      quizState.total++;
      const isCorrect = btn.dataset.correct === 'true';
      if(isCorrect){
        quizState.correctCount++;
        btn.classList.add('correct');
        markKnowSilent(w.kana);
        playCorrectSound();
      }else{
        btn.classList.add('wrong');
        document.querySelectorAll('.opt-btn').forEach(b=>{ if(b.dataset.correct==='true') b.classList.add('correct'); });
        markDontKnowSilent(w.kana);
        playWrongSound();
      }
      document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      document.getElementById('quizNext').style.display='inline-block';
    });
  });
  document.getElementById('quizNext').addEventListener('click', ()=>{
    quizState.idx++;
    renderQuizQuestion();
  });
}
function markKnowSilent(kana){
  const p = progress[kana]; p.correct++; p.streak++; if(p.streak>=2) p.mastered=true; saveProgress(kana); renderStats();
}
function markDontKnowSilent(kana){
  const p = progress[kana]; p.wrong++; p.streak=0; p.mastered=false; saveProgress(kana); renderStats();
}

/* ---------- 모드 전환 ---------- */
function render(){
  renderStats();
  if(currentMode==='cards') renderCards();
  else if(currentMode==='phrase') renderPhrase();
  else if(currentMode==='review') renderReview();
  else if(currentMode==='quiz') startQuiz();
  else if(currentMode==='kana') renderKana();
}
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    render();
  });
});

(async function init(){
  try{
    await loadProgress();
    render();
  }catch(e){
    document.getElementById('main').innerHTML =
      '<div class="empty-state"><div class="em">⚠️</div>불러오는 중 문제가 생겼어요.<br>페이지를 새로고침해 주세요.</div>';
    console.error(e);
  }
})();
</script>
