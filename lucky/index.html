<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>운빨 — 세상은 운빨이고 이 사이트는 거짓이다</title>
<style>
  :root{
    --bg:#0b0b0e;
    --bg2:#141418;
    --card:#18181d;
    --card2:#1f1f26;
    --fg:#f5f3ee;
    --dim:#9a9aa2;
    --dim2:#6c6c74;
    --line:rgba(245,243,238,0.10);
    --accent:#ff4b3e;
    --gold:#ffd23f;
    --radius-lg:28px;
    --radius-md:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 100% at 50% 0%, #17171d 0%, var(--bg) 55%);
    color:var(--fg);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    overscroll-behavior-y:none;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    padding:0 20px 40px;
  }
  .screen{display:none;}
  .screen.active{display:flex; flex-direction:column;}

  /* ---------- HOME ---------- */
  #home{flex:1; justify-content:space-between; padding-top:48px;}
  .brand{text-align:center;}
  .brand .mark{
    font-size:15px; letter-spacing:2px; color:var(--dim); margin-bottom:10px; font-weight:600;
  }
  .brand h1{
    font-size:56px; margin:0; font-weight:800; letter-spacing:-1px; line-height:1;
  }
  .brand .sub{
    margin-top:18px; font-size:19px; color:var(--dim); line-height:1.55; font-weight:500;
  }
  .brand .sub b{color:var(--fg); font-weight:700;}

  .today-card{
    margin-top:44px;
    background:linear-gradient(155deg, var(--card2), var(--card));
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:26px 24px;
    text-align:center;
  }
  .today-card .day-label{
    font-size:14px; color:var(--accent); font-weight:700; margin-bottom:8px;
  }
  .today-card .content-name{
    font-size:26px; font-weight:800; letter-spacing:-0.5px;
  }
  .today-card .content-desc{
    margin-top:8px; font-size:14px; color:var(--dim);
  }

  .cta-wrap{margin-top:36px; text-align:center;}
  #startBtn{
    width:100%;
    padding:22px 0;
    border-radius:999px;
    border:none;
    background:var(--fg);
    color:#0b0b0e;
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.3px;
    cursor:pointer;
    transition:transform .12s ease;
  }
  #startBtn:active{transform:scale(0.97);}
  .next-preview{
    margin-top:16px; font-size:13px; color:var(--dim2);
  }

  .day-dots{
    margin-top:28px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
  }
  .day-dot{
    width:34px; height:34px; border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    color:var(--dim); font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .day-dot.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .peek-label{text-align:center; font-size:11px; color:var(--dim2); margin-top:10px;}

  .home-foot{text-align:center; font-size:12px; color:var(--dim2); margin-top:30px;}

  /* ---------- LOADING ---------- */
  #loading{flex:1; align-items:center; justify-content:center; text-align:center;}
  .spinner{
    width:64px; height:64px; border-radius:50%;
    border:3px solid var(--line);
    border-top-color:var(--accent);
    animation:spin .9s linear infinite;
    margin-bottom:26px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #loadingText{font-size:17px; font-weight:600; color:var(--dim); min-height:24px; transition:opacity .15s;}

  /* ---------- RESULT ---------- */
  #result{flex:1; padding-top:34px; animation:fadein .35s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .r-head{text-align:center; margin-bottom:22px;}
  .r-head .r-tag{font-size:13px; color:var(--accent); font-weight:700; letter-spacing:1px;}
  .r-head .r-title{font-size:24px; font-weight:800; margin-top:6px; letter-spacing:-0.5px;}
  .shared-badge{
    display:inline-block; margin-top:10px; font-size:11px; color:var(--bg);
    background:var(--gold); padding:4px 10px; border-radius:999px; font-weight:700;
  }

  .r-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:26px 22px;
    margin-bottom:14px;
    animation:pop .4s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{from{opacity:0; transform:scale(0.94);} to{opacity:1; transform:scale(1);}}

  .luck-big{
    text-align:center; padding:6px 0 18px;
  }
  .luck-big .pct{
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:64px; font-weight:800; letter-spacing:-2px; color:var(--fg);
  }
  .luck-big .grade{
    margin-top:6px; display:inline-block; font-size:14px; font-weight:800;
    color:var(--accent); background:rgba(255,75,62,0.12);
    padding:6px 16px; border-radius:999px;
  }

  .r-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 0; border-top:1px solid var(--line); gap:16px;
  }
  .r-row:first-child{border-top:none;}
  .r-row .k{font-size:13px; color:var(--dim); flex-shrink:0; padding-top:2px; width:78px;}
  .r-row .v{font-size:15px; font-weight:600; text-align:right; line-height:1.5;}

  .r-para{font-size:16px; line-height:1.75; color:var(--fg); font-weight:500;}
  .r-quote{
    margin-top:18px; padding:14px 16px; background:var(--bg2); border-radius:var(--radius-sm);
    font-size:14px; color:var(--dim); font-style:normal; border-left:3px solid var(--gold);
  }
  .r-analysis{
    margin-top:14px; font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:12px; color:var(--dim2);
  }

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
  .stat-box{
    background:var(--bg2); border-radius:var(--radius-sm); padding:12px 14px;
  }
  .stat-box .sk{font-size:11px; color:var(--dim2); font-weight:700;}
  .stat-box .sv{font-size:18px; font-weight:800; margin-top:3px; font-family:ui-monospace,"SF Mono",Consolas,monospace;}

  .skill-block{margin-top:12px;}
  .skill-block .sb-label{font-size:12px; color:var(--gold); font-weight:800; margin-bottom:4px;}
  .skill-block .sb-text{font-size:14.5px; line-height:1.6; color:var(--fg);}

  .week-day-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0; border-top:1px solid var(--line); gap:10px;
  }
  .week-day-row:first-child{border-top:none;}
  .week-day-row .wd-name{font-size:14px; font-weight:700; width:44px; flex-shrink:0;}
  .week-day-row .wd-pct{
    font-family:ui-monospace,"SF Mono",Consolas,monospace; font-size:15px; font-weight:800; width:48px; text-align:right; flex-shrink:0;
  }
  .week-day-row .wd-desc{font-size:12.5px; color:var(--dim); flex:1; text-align:right;}

  .disclaimer{
    text-align:center; font-size:12px; color:var(--dim2); margin:14px 0 20px; line-height:1.7;
  }

  .r-actions{display:flex; gap:10px; margin-top:6px;}
  .btn{
    flex:1; padding:16px 0; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--fg); font-size:15px; font-weight:700; cursor:pointer;
    transition:transform .12s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn.primary{background:var(--fg); color:#0b0b0e; border:none;}
  .home-link{
    text-align:center; font-size:13px; color:var(--dim2); margin-top:18px;
    text-decoration:underline; text-underline-offset:3px; cursor:pointer;
  }
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--fg); color:#0b0b0e; padding:12px 20px; border-radius:999px;
    font-size:13px; font-weight:700; z-index:50; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  @media (min-width:480px){
    body{padding:20px 0;}
    #app{min-height:calc(100vh - 40px); border-radius:32px; box-shadow:0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,0.5);}
  }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="brand">
      <div class="mark">FORTUNE IS FAKE</div>
      <h1>운빨</h1>
      <p class="sub"><b>세상은 운빨이고</b><br><b>이 사이트는 거짓이다</b></p>

</div>
<div class="toast" id="toast"></div>

/* ---------- 시드 랜덤 ---------- */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng){ return arr[Math.floor(rng() * arr.length)]; }
function pickWeighted(arr, rng){ // arr of [value, weight]
  const total = arr.reduce((s,x)=>s+x[1],0);
  let r = rng() * total;
  for(const [v,w] of arr){ if(r < w) return v; r -= w; }
  return arr[arr.length-1][0];
}
function randInt(min, max, rng){ return Math.floor(rng() * (max - min + 1)) + min; }

{min:11,max:25,label:"나쁨",
  desc:["오늘은 잔잔한 파도처럼 잔실수가 이어지는 날입니다.","큰 사고는 없지만 자잘하게 꼬이는 하루입니다.","계획은 세우되 기대는 낮춰두는 게 좋습니다.","오늘은 무난보다 조금 아래의 컨디션입니다.","타이밍이 자꾸 살짝씩 어긋나는 날입니다.","작은 짜증이 쌓이기 쉬운 하루입니다.","결정을 미룰수록 유리한 날입니다.","예상보다 일이 조금씩 늦어집니다.","오늘은 방어적으로 움직이는 게 낫습니다.","무리한 도전은 잠시 미뤄두세요.","사소한 것에서 스트레스를 받기 쉬운 날입니다.","평소보다 여유를 조금 더 챙겨야 하는 날입니다."],

  items:["얇은 우산","낡은 이어폰","느린 와이파이","구겨진 영수증","미지근한 커피","늦게 오는 버스","먼지 쌓인 키보드","반쯤 죽은 배터리","삐걱대는 의자","얼음 없는 아이스아메리카노","잠긴 파일함","낡은 슬리퍼"],
  quotes:["오늘은 그냥 무난하게 넘기는 게 최선입니다.","작은 일에 너무 마음 쓰지 마세요.","내일은 오늘보다 나을 확률이 높습니다.","오늘은 속도보다 안정이 중요합니다.","잔잔한 하루도 나쁘지 않습니다.","오늘의 미션: 큰 실수 없이 지나가기.","가볍게, 무리하지 않게 보내세요.","오늘은 소소하게 넘어가는 하루입니다.","완벽하지 않아도 괜찮은 날입니다.","천천히 가도 늦지 않습니다.","오늘은 그냥 흘러가는 대로 두세요.","작은 불편함은 곧 잊힙니다."]},
{min:26,max:45,label:"약간 나쁨",
  desc:["나쁘지도 좋지도 않은, 살짝 기울어진 하루입니다.","노력한 만큼 절반 정도만 보상받는 날입니다.","새로운 시도보다는 익숙한 루틴이 유리합니다.","긴장을 놓으면 작은 실수가 생기는 날입니다.","감정 기복이 살짝 있을 수 있는 하루입니다.","예상과 결과가 미묘하게 어긋나는 날입니다.","오늘은 계획의 80%만 실행되는 날입니다.","타인의 말에 살짝 예민해질 수 있습니다.","체력 관리가 특히 필요한 하루입니다.","오늘은 완벽보다 무난함을 목표로 하세요.","결정을 내리기 애매한 순간이 자주 옵니다.","약간의 인내가 필요한 하루입니다."],

  items:["미묘하게 안 맞는 신발","절반만 충전된 배터리","살짝 눅눅한 과자","헷갈리게 하는 시계","애매한 온도의 커피","느슨해진 신발끈","반쯤 지워진 메모","구름 낀 하늘","미묘하게 짧은 우산","예민해진 알람 소리","약간 늦는 지하철","살짝 흐릿한 거울"],

{min:46,max:55,label:"평범",
  desc:["특별할 것 없는, 그야말로 평균적인 하루입니다.","좋을 것도 나쁠 것도 없는 균형 잡힌 날입니다.","오늘은 있는 그대로가 최선인 하루입니다.","루틴대로만 움직여도 무난한 하루입니다.","평온함이 곧 행운인 날입니다.","특이사항 없음, 그것이 오늘의 특징입니다.","무난함이 최고의 미덕인 하루입니다.","오늘은 그저 흘러가는 대로 두면 됩니다.","잔잔한 일상이 이어지는 평범한 날입니다.","특별한 이벤트 없이 안정적으로 흘러갑니다.","오늘은 평상심을 유지하기 좋은 날입니다.","무색무취, 그것이 오늘의 운입니다."],

  items:["무난한 흰 티셔츠","평범한 검정 우산","늘 쓰던 볼펜","익숙한 텀블러","정시에 도착하는 버스","적당히 충전된 배터리","무난한 날씨","평범한 하루의 일기","익숙한 알람 소리","적당한 온도의 방","늘 앉던 자리","평범한 신호등"],

{min:56,max:70,label:"약간 좋음",
  desc:["은근히 되는 일이 많은 살짝 기분 좋은 날입니다.","노력한 만큼, 아니 조금 더 보상받는 하루입니다.","작은 행운이 여기저기 숨어있는 날입니다.","타이밍이 은근히 잘 맞아떨어지는 하루입니다.","기분 좋은 우연이 몇 번 찾아옵니다.","오늘은 시도해볼 만한 가치가 있는 날입니다.","무언가 하나쯤은 잘 풀리는 하루입니다.","평소보다 컨디션이 살짝 좋은 날입니다.","사소한 것에서 기분 좋은 순간이 생깁니다.","오늘은 조금 용기를 내도 좋은 날입니다.","일이 예상보다 수월하게 풀립니다.","은근한 행운이 계속 따라오는 하루입니다."],

function generateLuck(rng){
  const roll = randInt(1,100,rng);
  if(roll === 100){
    const egg = pick(GOD_EASTER_EGGS, rng);
    return {
      type:"luck", pct:100, label:"신의 개입", isGod:true,
      desc: egg.desc, event: egg.event, item: egg.item, quote: egg.quote,
      time: pick(TIMES, rng), number: randInt(1,100,rng)
    };
  }
  const tier = LUCK_TIERS.find(t => roll >= t.min && roll <= t.max);
  const odd = rng() < 0.15 ? pick(ODD_EVENTS, rng) : null;
  return {
    type:"luck", pct: roll, label: tier.label, isGod:false,
    desc: pick(tier.desc, rng),
    event: pick(tier.events, rng),
    item: pick(tier.items, rng),
    quote: pick(tier.quotes, rng),
    time: pick(TIMES, rng),
    number: randInt(1,99,rng),
    odd
  };
}

  return `
  <div class="r-card">
    <div class="luck-big">
      <div style="font-size:13px;color:var(--dim);font-weight:700;">생존 가능성</div>
      <div class="pct">${r.survival}%</div>
      <div class="grade">역할: ${r.role}</div>
    </div>
  </div>
  <div class="r-card">
    <div class="r-row"><div class="k">장점</div><div class="v">${r.pro}</div></div>
    <div class="r-row"><div class="k">단점</div><div class="v">${r.con}</div></div>
    <div class="r-row"><div class="k">첫 행동</div><div class="v">${r.first}</div></div>
    <div class="r-row"><div class="k">가장 잘함</div><div class="v">${r.best}</div></div>
    <div class="r-row"><div class="k">가장 못함</div><div class="v">${r.worst}</div></div>
    <div class="r-row"><div class="k">동료 효과</div><div class="v">${r.team}</div></div>
    <div class="r-row"><div class="k">생존 전략</div><div class="v">${r.strategy}</div></div>
    <div class="r-row"><div class="k">예상 결말</div><div class="v">${r.ending}</div></div>
  </div>`;
}

/* =========================================================
   7. 일요일 — 당신의 일주일
   ========================================================= */
const WD_NAMES = ["월","화","수","목","금","토","일"];
function generateWeek(rng){
  const days = [];
  for(let i=0;i<7;i++){
    const roll = randInt(1,99,rng);
    const tier = LUCK_TIERS.find(t => roll >= t.min && roll <= t.max);
    days.push({name: WD_NAMES[i], pct: roll, label: tier.label, desc: pick(tier.desc, rng), event: pick(tier.events, rng)});
  }
  const best = days.reduce((a,b)=> b.pct>a.pct?b:a);
  const worst = days.reduce((a,b)=> b.pct<a.pct?b:a);
  const luckyNumber = randInt(1,99,rng);
  const totalAvg = Math.round(days.reduce((s,d)=>s+d.pct,0)/7);
  const summaries = [
    "전체적으로 무난하지만 방심은 금물인 한 주입니다.",
    "굴곡이 있지만 결국 평균으로 수렴하는 한 주입니다.",
    "초반은 힘들어도 후반에 빛을 보는 한 주입니다.",
    "예측 불가능한 반전이 숨어있는 한 주입니다.",
    "전체적으로 안정적인 흐름을 타는 한 주입니다.",
    "일희일비하지 말고 꾸준히 나아가야 하는 한 주입니다.",
    "생각보다 나쁘지 않게 흘러가는 한 주입니다."
  ];
  return {type:"week", days, best, worst, luckyNumber, totalAvg, summary: pick(summaries, rng)};
}
function renderWeek(r){
  let rows = r.days.map(d => `
    <div class="week-day-row">
      <div class="wd-name">${d.name}</div>
      <div class="wd-pct">${d.pct}%</div>
      <div class="wd-desc">${d.desc}</div>
    </div>`).join("");
  return `
  <div class="r-card">${rows}</div>
  <div class="r-card">
    <div class="r-row"><div class="k">최고의 날</div><div class="v">${r.best.name}요일 (${r.best.pct}%)</div></div>
    <div class="r-row"><div class="k">최악의 날</div><div class="v">${r.worst.name}요일 (${r.worst.pct}%)</div></div>
    <div class="r-row"><div class="k">행운의 숫자</div><div class="v">${r.luckyNumber}</div></div>
    <div class="r-row"><div class="k">주간 평균</div><div class="v">${r.totalAvg}%</div></div>
  </div>
  <div class="r-quote">${r.summary}</div>`;
}

/* =========================================================
   생성/렌더 라우터
   ========================================================= */
function generateResult(key, rng){
  switch(key){
    case "luck": return generateLuck(rng);
    case "past": return generatePast(rng);
    case "ability": return generateAbility(rng);
    case "difficulty": return generateDifficulty(rng);
    case "character": return generateCharacter(rng);
    case "zombie": return generateZombie(rng);
    case "week": return generateWeek(rng);
  }
}
function renderResultBody(key, r){
  switch(key){
    case "luck": return renderLuck(r);
    case "past": return renderPast(r);
    case "ability": return renderAbility(r);
    case "difficulty": return renderDifficulty(r);
    case "character": return renderCharacter(r);
    case "zombie": return renderZombie(r);
    case "week": return renderWeek(r);
  }
}

/* =========================================================
   앱 로직
   ========================================================= */
const homeEl = document.getElementById("home");
const loadingEl = document.getElementById("loading");
const resultEl = document.getElementById("result");
const loadingTextEl = document.getElementById("loadingText");
const dayLabelEl = document.getElementById("dayLabel");
const contentNameEl = document.getElementById("contentName");
const contentDescEl = document.getElementById("contentDesc");
const nextPreviewEl = document.getElementById("nextPreview");
const dayDotsEl = document.getElementById("dayDots");
const startBtn = document.getElementById("startBtn");
const toastEl = document.getElementById("toast");

let selectedDayIdx = new Date().getDay(); // 0=일 ... 6=토
let isSharedResult = false;

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function renderHome(){
  const info = WEEKDAY_INFO[selectedDayIdx];
  const todayIdx = new Date().getDay();
  const isToday = selectedDayIdx === todayIdx;
  dayLabelEl.textContent = isToday ? `오늘은 ${info.name}` : `${info.name} 콘텐츠 미리보기`;
  contentNameEl.textContent = info.title;
  contentDescEl.textContent = info.desc;
  const nextIdx = (selectedDayIdx + 1) % 7;
  nextPreviewEl.textContent = isToday
    ? `내일은 ${WEEKDAY_INFO[nextIdx].title}이(가) 공개됩니다.`
    : `${WEEKDAY_INFO[selectedDayIdx].name}에는 이 콘텐츠를 즐길 수 있어요.`;
  startBtn.textContent = "운명 확인하기";

  dayDotsEl.innerHTML = "";
  WEEKDAY_INFO.forEach((info2, idx) => {
    const dot = document.createElement("div");
    dot.className = "day-dot" + (idx === selectedDayIdx ? " active" : "");
    dot.textContent = info2.name[0];
    dot.addEventListener("click", () => { selectedDayIdx = idx; renderHome(); });
    dayDotsEl.appendChild(dot);
  });
}

function runFlow(key){
  showScreen("loading");
  let count = 0;
  const shuffled = [...LOADING_PHRASES].sort(() => Math.random() - 0.5);
  loadingTextEl.style.opacity = 1;
  loadingTextEl.textContent = shuffled[0];
  const totalSteps = 4;
  const interval = setInterval(() => {
    count++;
    loadingTextEl.style.opacity = 0;
    setTimeout(() => {
      loadingTextEl.textContent = shuffled[count % shuffled.length];
      loadingTextEl.style.opacity = 1;
    }, 120);
    if(count >= totalSteps){
      clearInterval(interval);
      setTimeout(() => {
        const seed = Math.floor(Math.random() * 4294967295);
        showResult(key, seed, false);
      }, 380);
    }
  }, 420);
}

function showResult(key, seed, shared){
  isSharedResult = shared;
  const rng = mulberry32(seed);
  const r = generateResult(key, rng);
  const info = WEEKDAY_INFO.find(w => w.key === key);
  const body = renderResultBody(key, r);
  resultEl.innerHTML = `
    <div class="r-head">
      <div class="r-tag">${info.title.toUpperCase()}</div>
      <div class="r-title">${info.title}</div>
      ${shared ? `<div class="shared-badge">친구가 공유한 결과입니다</div>` : ``}
    </div>
    ${body}
    <div class="disclaimer">※ ${pick(DISCLAIMERS, mulberry32(seed ^ 0x9E3779B9))}<br>※ ${pick(DISCLAIMERS, mulberry32((seed ^ 0x85EBCA6B) >>> 0))}</div>
    <div class="r-actions">
      <button class="btn" id="retryBtn" type="button">다시 하기</button>
      <button class="btn primary" id="shareBtn" type="button">친구에게 결과 보내기</button>
    </div>
    <div class="home-link" id="homeLink">처음 화면으로</div>
  `;
  showScreen("result");

  const retryBtn = document.getElementById("retryBtn");
  const shareBtn = document.getElementById("shareBtn");
  const homeLink = document.getElementById("homeLink");

  if(retryBtn){
    retryBtn.addEventListener("click", () => {
      try{
        if(location.hash) history.replaceState(null, "", location.pathname + location.search);
        // 같은 콘텐츠로 즉시 다시 뽑기 (로딩 연출 재생)
        runFlow(key);
      }catch(err){
        console.error("retry error:", err);
        showToast("다시 시도해주세요");
      }
    });
  }

  if(shareBtn){
    shareBtn.addEventListener("click", () => {
      try{ shareResult(key, seed, info.title); }
      catch(err){
        console.error("share error:", err);
        showToast("공유에 실패했습니다. 링크를 직접 복사해주세요.");
      }
    });
  }

  if(homeLink){
    homeLink.addEventListener("click", () => {
      if(location.hash) history.replaceState(null, "", location.pathname + location.search);
      renderHome();
      showScreen("home");
    });
  }
}

async function shareResult(key, seed, title){
  const payload = btoa(encodeURIComponent(JSON.stringify({c:key, s:seed})));
  // location.origin can be the literal string "null" when opened from a local
  // file (file://), which breaks the URL. Build from location.href instead.
  const base = location.href.split("#")[0];
  const url = `${base}#r=${payload}`;
  const shareText = `《운빨》 — ${title} 결과가 나왔어요. 세상은 운빨이고 이 사이트는 거짓입니다.`;

  // 1) Web Share API (모바일 브라우저 등, HTTPS 환경에서만 동작)
  if(navigator.share){
    try{
      await navigator.share({ title: "운빨", text: shareText, url });
      return;
    }catch(err){
      if(err && err.name === "AbortError") return; // 사용자가 공유를 취소함
      // 그 외 오류는 아래 복사 방식으로 폴백
    }
  }

  // 2) Clipboard API
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{
      await navigator.clipboard.writeText(url);
      showToast("링크가 복사되었습니다");
      return;
    }catch(err){ /* 폴백으로 진행 */ }
  }

  // 3) execCommand 복사 폴백 (HTTPS가 아니어도 대부분 동작)
  try{
    const ta = document.createElement("textarea");
    ta.value = url;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, url.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if(ok){ showToast("링크가 복사되었습니다"); return; }
  }catch(err){ /* 폴백으로 진행 */ }

  // 4) 최후의 수단 — 링크를 직접 보여준다
  window.prompt("아래 링크를 복사해서 친구에게 보내주세요", url);
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

startBtn.addEventListener("click", () => runFlow(WEEKDAY_INFO[selectedDayIdx].key));

/* ---------- 공유 링크 진입 처리 ---------- */
function tryLoadSharedResult(){
  const hash = location.hash;
  if(hash && hash.startsWith("#r=")){
    try{
      const payload = JSON.parse(decodeURIComponent(atob(hash.slice(3))));
      if(payload && payload.c && typeof payload.s === "number"){
        showResult(payload.c, payload.s, true);
        return true;
      }
    }catch(e){ /* 잘못된 링크 -> 홈으로 */ }
  }
  return false;
}

/* ---------- 초기화 ---------- */
(function init(){
  renderHome();
  if(!tryLoadSharedResult()){
    showScreen("home");
  }
})();
</script>
