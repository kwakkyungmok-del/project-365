<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Graph Lab v1.0 — Project 365</title>
<style>
  /* ============================================================
     폰트: Space Grotesk(디스플레이) + IBM Plex Mono(수치/데이터)
     — 다른 연구소 프로그램들과 같은 폰트 조합으로 제품군 톤 유지
     ============================================================ */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg-deep:#050609;
    --bg-panel:rgba(14,15,22,0.68);
    --bg-input:rgba(255,255,255,0.04);
    --border-soft:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.18);
    --accent:#ff5ec4;       /* Graph Lab 고유 색 (핑크/마젠타) — 버튼/타이틀 */
    --accent-strong:#ffa3e0;
    --trace:#4de8ff;        /* 그래프 궤적 색 (시안) — 오실로스코프 느낌 */
    --trace-glow: rgba(77,232,255,0.65);
    --grid-line: rgba(130,170,255,0.08);
    --axis-line: rgba(160,190,255,0.22);
    --success:#38e1c6;
    --warn:#ffb454;
    --danger:#ff5d7a;
    --text:#c7cede;
    --text-dim:#636b7d;
    --text-bright:#eef1fa;
    --font-display:'Space Grotesk', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --radius-lg:16px; --radius-md:10px; --radius-sm:6px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg-deep); color:var(--text); font-family:var(--font-mono);
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }
  button, input{ font-family:inherit; }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.14); border-radius:3px; }

  .app{ display:grid; grid-template-rows:auto auto 1fr auto; width:100%; height:100%; }

  /* ------------------------------------------------------------
     상단 툴바
     ------------------------------------------------------------ */
  .toolbar{
    display:flex; align-items:center; gap:10px; padding:0 16px; height:54px;
    background:linear-gradient(180deg, rgba(20,16,24,0.92), rgba(9,7,12,0.92));
    border-bottom:1px solid var(--border-soft); box-shadow:0 4px 24px rgba(0,0,0,0.35);
    flex-shrink:0; z-index:30;
  }
  .exit-btn{
    display:flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--border-soft);
    color:var(--text); padding:8px 12px; border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px;
    transition:background .18s ease, border-color .18s ease, color .18s ease, transform .12s ease;
  }
  .exit-btn:hover{ background:rgba(255,255,255,0.06); border-color:var(--border-strong); color:var(--text-bright); }
  .exit-btn:active{ transform:scale(0.96); }

  .toolbar-title{ display:flex; flex-direction:column; line-height:1.1; padding-left:14px; border-left:1px solid var(--border-soft); min-width:0; }
  .toolbar-title .name{ font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--text-bright); letter-spacing:0.02em; white-space:nowrap; }
  .toolbar-title .sub{ font-size:10.5px; color:var(--accent-strong); letter-spacing:0.05em; white-space:nowrap; }

  /* ------------------------------------------------------------
     컨트롤 패널
     ------------------------------------------------------------ */
  .controls{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:12px 16px; background:var(--bg-panel); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border-soft); z-index:25;
  }
  .fn-row{ display:flex; align-items:center; gap:8px; flex:1 1 320px; min-width:240px; }
  .fn-label{ font-size:11px; color:var(--text-dim); letter-spacing:0.08em; text-transform:uppercase; flex-shrink:0; }
  .fn-prefix{ color:var(--accent-strong); font-size:13px; flex-shrink:0; }
  .fn-input{
    flex:1; background:var(--bg-input); border:1px solid var(--border-soft); color:var(--text-bright);
    padding:9px 12px; border-radius:var(--radius-sm); font-size:13.5px; min-width:0;
  }
  .fn-input:focus{ outline:none; border-color:var(--accent); }
  .fn-input.error{ border-color:var(--danger); box-shadow:0 0 10px rgba(255,93,122,0.25); }

  .btn-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .ctrl-btn{
    display:flex; align-items:center; gap:5px;
    background:rgba(255,255,255,0.03); border:1px solid var(--border-soft); color:var(--text);
    padding:8px 13px; border-radius:var(--radius-sm); cursor:pointer; font-size:12px;
    transition:background .16s ease, border-color .16s ease, color .16s ease, transform .1s ease;
  }
  .ctrl-btn:hover{ background:rgba(255,255,255,0.08); border-color:var(--border-strong); }
  .ctrl-btn:active{ transform:scale(0.95); }
  .ctrl-btn.primary{ color:var(--accent-strong); border-color:rgba(255,94,196,0.35); }
  .ctrl-btn.primary.is-active{ background:rgba(255,94,196,0.14); box-shadow:0 0 14px rgba(255,94,196,0.2) inset; }
  .ctrl-btn.random{
    color:#111; background:linear-gradient(160deg, var(--accent-strong), var(--accent));
    border:none; font-weight:700; box-shadow:0 0 16px rgba(255,94,196,0.25);
  }
  .ctrl-btn.random:hover{ box-shadow:0 0 22px rgba(255,94,196,0.4); }
  .ctrl-btn.random.alt{ background:linear-gradient(160deg, #9be8ff, var(--trace)); box-shadow:0 0 16px rgba(77,232,255,0.25); }
  .ctrl-btn.random.alt:hover{ box-shadow:0 0 22px rgba(77,232,255,0.4); }

  .speed-row{ display:flex; align-items:center; gap:8px; }
  .speed-label{ font-size:11px; color:var(--text-dim); white-space:nowrap; }
  .speed-value{ font-size:11px; color:var(--accent-strong); width:34px; text-align:right; }
  input[type="range"]{
    -webkit-appearance:none; appearance:none; width:110px; height:4px; border-radius:3px;
    background:rgba(255,255,255,0.12); outline:none; cursor:pointer;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent-strong); box-shadow:0 0 8px rgba(255,94,196,0.7);
    border:2px solid #0a0a0f; cursor:pointer; transition:transform .1s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover{ transform:scale(1.15); }
  input[type="range"]::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%; background:var(--accent-strong); border:2px solid #0a0a0f; cursor:pointer;
  }

  .error-text{ font-size:11px; color:var(--danger); flex-basis:100%; min-height:14px; }
  .generated-text{ font-size:11px; color:var(--trace); flex-basis:100%; min-height:14px; }

  /* ------------------------------------------------------------
     캔버스 영역
     ------------------------------------------------------------ */
  .canvas-wrap{ position:relative; min-height:0; overflow:hidden; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  .canvas-wrap.is-panning canvas{ cursor:grabbing; }

  .canvas-hint{
    position:absolute; left:14px; bottom:12px; font-size:10px; color:var(--text-dim);
    background:rgba(6,7,11,0.5); padding:5px 10px; border-radius:20px; border:1px solid var(--border-soft);
    pointer-events:none;
  }
  .readout{
    position:absolute; top:12px; right:14px; text-align:right;
    background:rgba(6,7,11,0.55); border:1px solid var(--border-soft); border-radius:var(--radius-md);
    padding:8px 12px; font-size:10.5px; color:var(--text-dim); pointer-events:none;
  }
  .readout .r1{ color:var(--trace); font-size:12px; margin-bottom:2px; }

  /* ------------------------------------------------------------
     하단 상태바
     ------------------------------------------------------------ */
  .statusbar{
    display:flex; flex-wrap:wrap; align-items:center; height:32px;
    background:linear-gradient(0deg, rgba(20,16,24,0.92), rgba(9,7,12,0.92));
    border-top:1px solid var(--border-soft); padding:0 14px; font-size:11px;
    flex-shrink:0; z-index:30; overflow-x:auto; white-space:nowrap;
  }
  .stat-item{ display:flex; align-items:center; gap:6px; padding:0 14px; border-right:1px solid var(--border-soft); color:var(--text-dim); }
  .stat-item:last-child{ border-right:none; }
  .stat-item span.val{ color:var(--accent-strong); font-weight:600; }
  .stat-item span.val.ok{ color:var(--success); }
  .stat-item span.val.bad{ color:var(--danger); }

  @media (max-width: 720px){
    .controls{ padding:10px 12px; }
    .fn-row{ flex-basis:100%; }
    .readout{ font-size:9.5px; padding:6px 9px; }
    .canvas-hint{ display:none; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============================================================
       상단 툴바
       ============================================================ -->
  <header class="toolbar">
    <button class="exit-btn" id="exitBtn">← Exit Research Computer</button>
    <div class="toolbar-title">
      <span class="name">GRAPH LAB</span>
      <span class="sub">Visualize. Animate. Experiment.</span>
    </div>
  </header>

  <!-- ============================================================
       컨트롤 패널
       ============================================================ -->
  <div class="controls">
    <div class="fn-row">
      <span class="fn-label">Function</span>
      <span class="fn-prefix">y =</span>
      <input type="text" class="fn-input" id="fnInput" value="sin(x + t)" spellcheck="false" autocomplete="off">
    </div>

    <div class="btn-row">
      <button class="ctrl-btn primary is-active" id="playBtn">▶ PLAY</button>
      <button class="ctrl-btn primary" id="pauseBtn">⏸ PAUSE</button>
      <button class="ctrl-btn" id="resetBtn">↻ RESET</button>
    </div>

    <div class="speed-row">
      <span class="speed-label">SPEED</span>
      <input type="range" id="speedSlider" min="0" max="100" value="50">
      <span class="speed-value" id="speedValue">1.0×</span>
    </div>

    <div class="btn-row">
      <button class="ctrl-btn random" id="randomGraphBtn">🎲 RANDOM GRAPH</button>
      <button class="ctrl-btn random alt" id="randomAnimBtn">🎲 RANDOM ANIMATION</button>
    </div>

    <div class="error-text" id="errorText"></div>
    <div class="generated-text" id="generatedText"></div>
  </div>

  <!-- ============================================================
       캔버스
       ============================================================ -->
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="graphCanvas"></canvas>
    <div class="readout" id="readout">
      <div class="r1" id="readoutFn">y = sin(x + t)</div>
      <div>t = <span id="readoutT">0.00</span></div>
      <div>zoom = <span id="readoutZoom">60px/unit</span></div>
    </div>
    <div class="canvas-hint">Scroll to zoom · Drag to pan · Double-click to recenter</div>
  </div>

  <!-- ============================================================
       하단 상태바
       ============================================================ -->
  <footer class="statusbar">
    <div class="stat-item">Function <span class="val ok" id="statStatus">OK</span></div>
    <div class="stat-item">FPS <span class="val" id="statFps">60</span></div>
    <div class="stat-item">t <span class="val" id="statT">0.00</span></div>
    <div class="stat-item">Speed <span class="val" id="statSpeed">1.0×</span></div>
    <div class="stat-item">Zoom <span class="val" id="statZoom">60px/u</span></div>
    <div class="stat-item">Samples <span class="val" id="statSamples">0</span></div>
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ==============================================================
     1. 수식 파서 / 컴파일러
     문자열 -> AST -> (x,t) => number|null 로 변환하는 순수 함수형 엔진.
     외부 라이브러리나 eval() 없이 직접 구현했다.
     ============================================================== */
  const FUNC_NAMES = ["asin","acos","atan","sin","cos","tan","sqrt","abs","exp","ln","log","floor","ceil","round","min","max","pow"]
    .sort((a,b)=>b.length-a.length); // 긴 이름부터 매칭 (asin이 sin보다 먼저)
  const TOKEN_RE = new RegExp("\\s+|(\\d+\\.?\\d*)|(" + FUNC_NAMES.join("|") + ")|(pi|e|x|t)|([+\\-*/^(),])", "g");

  function preprocessFormula(input){
    let s = String(input).trim();
    s = s.replace(/^y\s*=\s*/i, "");
    s = s.replace(/[×]/g, "*").replace(/[÷]/g, "/").replace(/[−–—]/g, "-");
    const SUP = {"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9"};
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, ch => "^" + SUP[ch]);
    return s.toLowerCase();
  }

  function tokenize(raw){
    const s = preprocessFormula(raw);
    const tokens = [];
    let idx = 0;
    TOKEN_RE.lastIndex = 0;
    let m;
    while ((m = TOKEN_RE.exec(s)) !== null){
      if (m.index !== idx) throw new Error("Unexpected character near '" + s.slice(idx, m.index) + "'");
      idx = TOKEN_RE.lastIndex;
      const whole = m[0];
      if (/^\s+$/.test(whole)) continue;
      if (m[1] !== undefined) tokens.push({ type:"NUM", value: parseFloat(m[1]) });
      else if (m[2] !== undefined) tokens.push({ type:"FUNC", name: m[2] });
      else if (m[3] !== undefined) tokens.push({ type:"IDENT", name: m[3] });
      else tokens.push({ type:"SYM", value: m[4] });
    }
    if (idx !== s.length) throw new Error("Unexpected character near '" + s.slice(idx) + "'");
    return tokens;
  }

  function parseFormula(tokens){
    let pos = 0;
    const peek = () => tokens[pos];
    const next = () => tokens[pos++];
    const atomStarter = tok => !!tok && (tok.type === "NUM" || tok.type === "FUNC" || tok.type === "IDENT" || (tok.type === "SYM" && tok.value === "("));

    function parseExpr(){
      let node = parseTerm();
      while (peek() && peek().type === "SYM" && (peek().value === "+" || peek().value === "-")){
        const op = next().value;
        node = { type:"bin", op, left:node, right:parseTerm() };
      }
      return node;
    }
    function parseTerm(){
      let node = parseUnary();
      while (true){
        const tok = peek();
        if (tok && tok.type === "SYM" && (tok.value === "*" || tok.value === "/")){
          const op = next().value;
          node = { type:"bin", op, left:node, right:parseUnary() };
        } else if (atomStarter(tok)){
          node = { type:"bin", op:"*", left:node, right:parseUnary() }; // 암시적 곱셈 (2x, cos(x)sin(x))
        } else break;
      }
      return node;
    }
    function parseUnary(){
      const tok = peek();
      if (tok && tok.type === "SYM" && tok.value === "-"){ next(); return { type:"neg", arg: parseUnary() }; }
      if (tok && tok.type === "SYM" && tok.value === "+"){ next(); return parseUnary(); }
      return parsePower();
    }
    function parsePower(){
      let node = parseAtom();
      const tok = peek();
      if (tok && tok.type === "SYM" && tok.value === "^"){ next(); node = { type:"bin", op:"^", left:node, right:parseUnary() }; }
      return node;
    }
    function parseAtom(){
      const tok = next();
      if (!tok) throw new Error("Unexpected end of expression");
      if (tok.type === "NUM") return { type:"num", value: tok.value };
      if (tok.type === "IDENT") return { type:"var", name: tok.name };
      if (tok.type === "FUNC"){
        const open = next();
        if (!open || open.type !== "SYM" || open.value !== "(") throw new Error("Expected '(' after " + tok.name);
        const args = [parseExpr()];
        while (peek() && peek().type === "SYM" && peek().value === ","){ next(); args.push(parseExpr()); }
        const close = next();
        if (!close || close.type !== "SYM" || close.value !== ")") throw new Error("Missing closing parenthesis");
        return { type:"call", name: tok.name, args };
      }
      if (tok.type === "SYM" && tok.value === "("){
        const inner = parseExpr();
        const close = next();
        if (!close || close.type !== "SYM" || close.value !== ")") throw new Error("Missing closing parenthesis");
        return inner;
      }
      throw new Error("Unexpected token");
    }

    if (!tokens.length) throw new Error("Empty expression");
    const result = parseExpr();
    if (pos !== tokens.length) throw new Error("Unexpected trailing input");
    return result;
  }

  const FUNCS = {
    sin: Math.sin, cos: Math.cos, tan: Math.tan,
    asin: Math.asin, acos: Math.acos, atan: Math.atan,
    sqrt: Math.sqrt, abs: Math.abs, exp: Math.exp,
    ln: Math.log, log: Math.log10,
    floor: Math.floor, ceil: Math.ceil, round: Math.round,
    min: (...a) => Math.min(...a), max: (...a) => Math.max(...a),
    pow: (a,b) => Math.pow(a,b)
  };

  function evalNode(node, x, t){
    switch(node.type){
      case "num": return node.value;
      case "var":
        if (node.name === "x") return x;
        if (node.name === "t") return t;
        if (node.name === "pi") return Math.PI;
        if (node.name === "e") return Math.E;
        return NaN;
      case "neg": return -evalNode(node.arg, x, t);
      case "bin": {
        const a = evalNode(node.left, x, t), b = evalNode(node.right, x, t);
        if (node.op === "+") return a+b;
        if (node.op === "-") return a-b;
        if (node.op === "*") return a*b;
        if (node.op === "/") return a/b;
        if (node.op === "^") return Math.pow(a,b);
        throw new Error("Unknown operator");
      }
      case "call": {
        const fn = FUNCS[node.name];
        if (!fn) throw new Error("Unknown function " + node.name);
        return fn(...node.args.map(a => evalNode(a, x, t)));
      }
    }
    throw new Error("Unknown node");
  }

  // 문자열 -> { evalAt(x,t): number|null } 로 컴파일. 파싱 오류는 여기서 던져진다.
  function compileFormula(raw){
    const ast = parseFormula(tokenize(raw));
    return function evalAt(x, t){
      try{
        const v = evalNode(ast, x, t);
        return isFinite(v) ? v : null;
      }catch(e){
        return null;
      }
    };
  }

  /* ==============================================================
     2. 랜덤 그래프 생성기
     ============================================================== */
  const rnd = (a,b) => a + Math.random()*(b-a);
  const rndInt = (a,b) => Math.floor(rnd(a,b+1));
  const rndCoef = () => Math.round(rnd(0.3, 2.6) * 10) / 10;

  function termToString(coef, body){
    if (Math.random() < 0.35 && Math.abs(coef-1) < 1e-9) return body; // 계수 1은 가끔 생략
    return coef + body;
  }

  const STATIC_TEMPLATES = [
    () => termToString(rndCoef(), "sin(" + rndInt(1,6) + "x)"),
    () => termToString(rndCoef(), "cos(" + rndInt(1,6) + "x)"),
    () => termToString(rndCoef(), "sin(x^2/" + rndInt(2,6) + ")"),
    () => termToString(Math.round(rnd(0.2,0.7)*10)/10, "x"),
    () => "cos(x)*sin(" + rndInt(2,6) + "x)",
    () => termToString(Math.round(rnd(0.2,0.5)*10)/10, "tan(x/" + rndInt(3,6) + ")"),
    () => termToString(rndCoef(), "sin(" + rndInt(1,5) + "x)*cos(" + rndInt(1,5) + "x)")
  ];

  const ANIM_TEMPLATES = [
    () => termToString(rndCoef(), "sin(" + rndInt(1,6) + "x + t)"),
    () => "cos(x)*sin(" + rndInt(1,5) + "t)",
    () => "sin(x + t)*cos(t)",
    () => "sin(x*cos(t))",
    () => termToString(rndCoef(), "sin(" + rndInt(1,5) + "x + " + rndInt(1,4) + "t)"),
    () => termToString(rndCoef(), "cos(" + rndInt(1,5) + "x - t)"),
    () => termToString(rndCoef(), "sin(x + " + rndInt(1,4) + "t)")
  ];

  function generateFormula(animated){
    const pool = animated ? ANIM_TEMPLATES : STATIC_TEMPLATES;
    const count = animated ? rndInt(1,2) : rndInt(1,3);
    let formula = pool[rndInt(0,pool.length-1)]();
    for (let i=1;i<count;i++){
      const sign = Math.random() < 0.7 ? " + " : " - ";
      formula += sign + pool[rndInt(0,pool.length-1)]();
    }
    return formula;
  }

  /* ==============================================================
     3. 애플리케이션 (카메라 / 렌더링 / 입력 / 상태)
     ============================================================== */
  const canvas = document.getElementById("graphCanvas");
  const ctx = canvas.getContext("2d");
  const canvasWrap = document.getElementById("canvasWrap");
  let DPR = window.devicePixelRatio || 1;
  let CSS_W = 0, CSS_H = 0;

  const camera = { x:0, y:0, scale:60 }; // scale = 화면 픽셀 / 수학적 1단위
  const MIN_SCALE = 4, MAX_SCALE = 2000;

  const state = {
    formulaText: "sin(x + t)",
    evalAt: null,
    compileError: null,
    t: 0,
    playing: true,
    speed: 1.0
  };

  function screenToWorld(sx, sy){
    return { x: camera.x + (sx - CSS_W/2)/camera.scale, y: camera.y - (sy - CSS_H/2)/camera.scale };
  }
  function worldToScreen(wx, wy){
    return { x: (wx - camera.x)*camera.scale + CSS_W/2, y: CSS_H/2 - (wy - camera.y)*camera.scale };
  }

  function resizeCanvas(){
    const rect = canvasWrap.getBoundingClientRect();
    CSS_W = rect.width; CSS_H = rect.height;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(CSS_W*DPR));
    canvas.height = Math.max(1, Math.round(CSS_H*DPR));
  }
  window.addEventListener("resize", resizeCanvas);

  /* -------------------- 함수 컴파일 -------------------- */
  const fnInput = document.getElementById("fnInput");
  const errorText = document.getElementById("errorText");
  const generatedText = document.getElementById("generatedText");
  const statStatus = document.getElementById("statStatus");
  const readoutFn = document.getElementById("readoutFn");

  function applyFormula(text, opts){
    opts = opts || {};
    state.formulaText = text;
    try{
      state.evalAt = compileFormula(text);
      state.compileError = null;
      fnInput.classList.remove("error");
      errorText.textContent = "";
      statStatus.textContent = "OK";
      statStatus.className = "val ok";
    }catch(e){
      state.compileError = e.message;
      fnInput.classList.add("error");
      errorText.textContent = "Invalid Function";
      statStatus.textContent = "ERROR";
      statStatus.className = "val bad";
      // 잘못된 입력이어도 이전에 유효했던 그래프는 그대로 유지한다 (프로그램이 죽지 않음)
    }
    readoutFn.textContent = "y = " + text;
    if (!opts.silent) fnInput.value = text;
  }

  fnInput.addEventListener("input", () => applyFormula(fnInput.value, { silent:true }));
  fnInput.addEventListener("keydown", e => { if (e.key === "Enter") fnInput.blur(); });

  /* -------------------- 재생 컨트롤 -------------------- */
  const playBtn = document.getElementById("playBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const resetBtn = document.getElementById("resetBtn");

  function syncPlayButtons(){
    playBtn.classList.toggle("is-active", state.playing);
    pauseBtn.classList.toggle("is-active", !state.playing);
  }
  playBtn.addEventListener("click", () => { state.playing = true; syncPlayButtons(); });
  pauseBtn.addEventListener("click", () => { state.playing = false; syncPlayButtons(); });
  resetBtn.addEventListener("click", () => { state.t = 0; });

  const speedSlider = document.getElementById("speedSlider");
  const speedValue = document.getElementById("speedValue");
  function sliderToSpeed(v){ return Math.round((0.1 + (v/100)*4.9) * 10) / 10; } // 0.1x ~ 5.0x
  speedSlider.addEventListener("input", () => {
    state.speed = sliderToSpeed(Number(speedSlider.value));
    speedValue.textContent = state.speed.toFixed(1) + "×";
  });
  speedValue.textContent = state.speed.toFixed(1) + "×";

  /* -------------------- RANDOM GRAPH / ANIMATION -------------------- */
  document.getElementById("randomGraphBtn").addEventListener("click", () => {
    const f = generateFormula(false);
    applyFormula(f);
    generatedText.textContent = "Generated: y = " + f;
  });
  document.getElementById("randomAnimBtn").addEventListener("click", () => {
    const f = generateFormula(true);
    applyFormula(f);
    state.playing = true; syncPlayButtons();
    generatedText.textContent = "Generated: y = " + f;
  });

  /* -------------------- 카메라 : 줌 (커서 기준) / 팬 -------------------- */
  function zoomTo(newScale, screenPoint){
    newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
    const before = screenToWorld(screenPoint.x, screenPoint.y);
    camera.scale = newScale;
    const after = screenToWorld(screenPoint.x, screenPoint.y);
    camera.x += (before.x - after.x);
    camera.y += (before.y - after.y);
  }

  const pointers = new Map();
  let dragMode = null; // 'pan' | 'pinch' | null
  let panStart = null, panStartCamera = null;
  let pinchStartDist = 0, pinchStartScale = 1;

  function getPos(e){ const r = canvas.getBoundingClientRect(); return { x: e.clientX-r.left, y: e.clientY-r.top }; }
  function dist(p,q){ return Math.hypot(p.x-q.x, p.y-q.y); }
  function mid(p,q){ return { x:(p.x+q.x)/2, y:(p.y+q.y)/2 }; }

  canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId);
    const pos = getPos(e);
    pointers.set(e.pointerId, pos);
    if (pointers.size === 2){
      dragMode = "pinch";
      const pts = [...pointers.values()];
      pinchStartDist = dist(pts[0],pts[1]) || 1;
      pinchStartScale = camera.scale;
      return;
    }
    dragMode = "pan";
    panStart = pos;
    panStartCamera = { x:camera.x, y:camera.y };
    canvasWrap.classList.add("is-panning");
  });

  canvas.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    const pos = getPos(e);
    pointers.set(e.pointerId, pos);

    if (dragMode === "pinch" && pointers.size >= 2){
      const pts = [...pointers.values()];
      const d = dist(pts[0],pts[1]) || 1;
      zoomTo(pinchStartScale * (d/pinchStartDist), mid(pts[0],pts[1]));
      return;
    }
    if (dragMode === "pan" && panStart){
      camera.x = panStartCamera.x - (pos.x-panStart.x)/camera.scale;
      camera.y = panStartCamera.y + (pos.y-panStart.y)/camera.scale;
    }
  });

  function endPointer(e){
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 0){ dragMode = null; canvasWrap.classList.remove("is-panning"); }
    else if (dragMode === "pinch" && pointers.size === 1){
      dragMode = "pan";
      panStart = [...pointers.values()][0];
      panStartCamera = { x:camera.x, y:camera.y };
    }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0012);
    zoomTo(camera.scale*factor, getPos(e));
  }, { passive:false });

  canvas.addEventListener("dblclick", () => { camera.x = 0; camera.y = 0; });

  /* ==============================================================
     4. 렌더링
     ============================================================== */
  function niceStep(rawStep){
    const pow10 = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const frac = rawStep / pow10;
    let niceFrac;
    if (frac < 1.5) niceFrac = 1; else if (frac < 3.5) niceFrac = 2; else if (frac < 7.5) niceFrac = 5; else niceFrac = 10;
    return niceFrac * pow10;
  }

  function drawGrid(){
    ctx.fillStyle = "#050609";
    ctx.fillRect(0,0,CSS_W,CSS_H);

    const step = niceStep(80/camera.scale); // 화면상 약 80px 간격이 되도록
    const left = screenToWorld(0,0).x, right = screenToWorld(CSS_W,0).x;
    const top = screenToWorld(0,0).y, bottom = screenToWorld(0,CSS_H).y;

    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--grid-line").trim() || "rgba(130,170,255,0.08)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let gx = Math.ceil(left/step)*step; gx < right; gx += step){
      const sx = worldToScreen(gx,0).x;
      ctx.moveTo(sx, 0); ctx.lineTo(sx, CSS_H);
    }
    for (let gy = Math.ceil(bottom/step)*step; gy < top; gy += step){
      const sy = worldToScreen(0,gy).y;
      ctx.moveTo(0, sy); ctx.lineTo(CSS_W, sy);
    }
    ctx.stroke();

    // 좌표축 (x=0, y=0) 은 더 밝게, 화면 밖으로 나가면 가장자리에 붙여 그린다
    const origin = worldToScreen(0,0);
    const axisX = Math.min(Math.max(origin.x, 0), CSS_W);
    const axisY = Math.min(Math.max(origin.y, 0), CSS_H);
    ctx.strokeStyle = "rgba(160,190,255,0.28)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(axisX,0); ctx.lineTo(axisX,CSS_H);
    ctx.moveTo(0,axisY); ctx.lineTo(CSS_W,axisY);
    ctx.stroke();

    // 축 눈금 숫자
    ctx.fillStyle = "rgba(180,200,255,0.45)";
    ctx.font = "10px IBM Plex Mono, monospace";
    for (let gx = Math.ceil(left/step)*step; gx < right; gx += step){
      if (Math.abs(gx) < step*0.001) continue;
      const sx = worldToScreen(gx,0).x;
      ctx.fillText(formatTick(gx), sx+3, clamp(axisY-4, 10, CSS_H-4));
    }
    for (let gy = Math.ceil(bottom/step)*step; gy < top; gy += step){
      if (Math.abs(gy) < step*0.001) continue;
      const sy = worldToScreen(0,gy).y;
      ctx.fillText(formatTick(gy), clamp(axisX+4, 2, CSS_W-30), sy-3);
    }
  }

  function clamp(v,a,b){ return Math.min(b, Math.max(a,v)); }
  function formatTick(v){
    const r = Math.round(v*1000)/1000;
    return Math.abs(r) >= 1000 ? r.toExponential(1) : String(r);
  }

  let lastSampleCount = 0;

  function drawCurve(){
    if (!state.evalAt) return;
    const step = Math.max(1, Math.floor(1)); // 화면 1px 마다 샘플링
    ctx.save();
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--trace").trim() || "#4de8ff";
    ctx.shadowColor = "rgba(77,232,255,0.65)";
    ctx.shadowBlur = 8;
    ctx.beginPath();

    let drawing = false;
    let prevSy = null;
    let samples = 0;

    for (let sx = 0; sx <= CSS_W; sx += step){
      const wx = screenToWorld(sx, 0).x;
      const wy = state.evalAt(wx, state.t);
      samples++;
      if (wy === null || !isFinite(wy)){
        drawing = false; prevSy = null;
        continue;
      }
      const sy = worldToScreen(0, wy).y;

      // 점근선 등으로 인한 화면 밖 급격한 점프는 이어그리지 않고 끊는다
      if (prevSy !== null && Math.abs(sy - prevSy) > CSS_H * 2.2){
        drawing = false;
      }

      if (!drawing){ ctx.moveTo(sx, sy); drawing = true; }
      else ctx.lineTo(sx, sy);
      prevSy = sy;
    }
    ctx.stroke();
    ctx.restore();
    lastSampleCount = samples;
  }

  function render(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawGrid();
    drawCurve();
  }

  /* -------------------- 상태바 / 리드아웃 갱신 -------------------- */
  const readoutT = document.getElementById("readoutT");
  const readoutZoom = document.getElementById("readoutZoom");
  const statFps = document.getElementById("statFps");
  const statT = document.getElementById("statT");
  const statSpeed = document.getElementById("statSpeed");
  const statZoom = document.getElementById("statZoom");
  const statSamples = document.getElementById("statSamples");

  function updateReadouts(){
    readoutT.textContent = state.t.toFixed(2);
    readoutZoom.textContent = Math.round(camera.scale) + "px/unit";
    statT.textContent = state.t.toFixed(2);
    statSpeed.textContent = state.speed.toFixed(1) + "×";
    statZoom.textContent = Math.round(camera.scale) + "px/u";
    statSamples.textContent = lastSampleCount;
  }

  /* ==============================================================
     5. 메인 루프
     ============================================================== */
  let lastTime = performance.now();
  let fpsSmoothed = 60;

  function loop(now){
    const dt = Math.min(0.05, (now-lastTime)/1000);
    lastTime = now;
    const instFps = dt>0 ? 1/dt : 60;
    fpsSmoothed += (instFps-fpsSmoothed)*0.1;
    statFps.textContent = Math.round(fpsSmoothed);

    if (state.playing) state.t += dt * state.speed;

    render();
    updateReadouts();
    requestAnimationFrame(loop);
  }

  /* ==============================================================
     6. 초기화
     ============================================================== */
  document.getElementById("exitBtn").addEventListener("click", () => { location.href = "../"; });

  function init(){
    resizeCanvas();
    applyFormula(state.formulaText, { silent:true });
    syncPlayButtons();
    requestAnimationFrame(loop);
  }
  init();
})();
</script>
</body>
</html>
