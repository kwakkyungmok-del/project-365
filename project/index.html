<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#0b0b0b;
    color:white;

    font-family:Arial;

    height:100vh;

}

.home{

    position:fixed;

    top:25px;
    left:25px;

    background:#181818;
    color:white;

    border:1px solid #333;

    padding:12px 18px;

    border-radius:10px;

    cursor:pointer;

}

.home:hover{

    background:#2b2b2b;

}


.container{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    text-align:center;

}


h1{

    font-size:45px;

    margin-bottom:25px;

}


.info{

    color:#888;

    font-size:18px;

    margin-bottom:40px;

}


.card{

    background:#161616;

    border:1px solid #333;

    border-radius:15px;

    padding:30px;

    width:350px;

}


.progress{

    margin-top:20px;

    color:#aaa;

}


</style>

</head>


<body>


<button class="home" onclick="location.href='../'">
🏠 메인 화면
</button>


<div class="container">


<h1>
Project 365
</h1>


<div class="info">
매일 발전하는 프로젝트의 현재 모습
</div>


<div class="card">

<h2>
DAY 001
</h2>

<p>
현재 버전: v0.0.1
</p>


<div class="progress">
진행률 0.3%
</div>


</div>


</div>


</body>

</html>
