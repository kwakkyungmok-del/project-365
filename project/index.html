<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project 365</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0b0b;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
}

.home{
    position:absolute;
    top:20px;
    left:20px;
    padding:10px 16px;
    background:#181818;
    border:1px solid #333;
    border-radius:8px;
    cursor:pointer;
    color:white;
    transition:.2s;
}

.home:hover{
    background:#252525;
}

.room{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:80px 20px 40px;
}

.title{
    font-size:36px;
    margin-bottom:60px;
    text-align:center;
}

.objects{
    display:flex;
    gap:80px;
    align-items:flex-end;
    justify-content:center;
    flex-wrap:wrap;
}

.object{
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.object:hover{
    transform:translateY(-6px);
}

.icon{
    font-size:90px;
    margin-bottom:10px;
}

.locked{
    opacity:.25;
    cursor:not-allowed;
}

.locked:hover{
    transform:none;
}

.tip{
    margin-top:50px;
    color:#777;
    font-size:14px;
    text-align:center;
}

/* ===================== */
/* 모바일 */
/* ===================== */

@media (max-width:768px){

    .home{
        top:15px;
        left:15px;
        font-size:14px;
        padding:10px 14px;
    }

    .title{
        font-size:28px;
        margin-bottom:40px;
    }

    .objects{
        flex-direction:column;
        gap:35px;
        align-items:center;
    }

    .icon{
        font-size:80px;
    }

    .object{
        width:220px;
        padding:15px;
        border:1px solid #222;
        border-radius:12px;
        background:#111;
    }

    .tip{
        margin-top:35px;
        width:90%;
        line-height:1.6;
    }

}

/* 작은 휴대폰 */

@media (max-width:480px){

    .title{
        font-size:22px;
    }

    .icon{
        font-size:70px;
    }

    .object{
        width:180px;
        font-size:15px;
    }

    .home{
        font-size:13px;
    }

}

</style>

</head>

<body>

<button class="home" onclick="location.href='../'">
🏠 메인
</button>

<div class="room">

    <div class="title">
        Project 365 연구소
    </div>

    <div class="objects">

        <div class="object" onclick="location.href='computer/'">
            <div class="icon">🖥️</div>
            메인 컴퓨터
        </div>

       <div class="object" onclick="location.href='../dayreport/'">
            <div class="icon">📚</div>
            책장
        </div>

        <div class="object" onclick="location.href='lab/'">
            <div class="icon">🧪</div>
            실험대
        </div>

        <div class="object locked" onclick="alert('Day 60에 해금됩니다.')">
            <div class="icon">🤖</div>
            AI 로봇
        </div>

    </div>

    <div class="tip">
        새로운 오브젝트는 프로젝트가 진행될수록 해금됩니다.
    </div>

</div>

</body>
</html>
