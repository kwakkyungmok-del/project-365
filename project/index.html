<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project 365</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#0b0b0b;
color:white;
font-family:Arial;

height:100vh;

overflow:hidden;

}

.home{

position:absolute;

top:20px;
left:20px;

padding:10px 16px;

background:#181818;

border:1px solid #333;

border-radius:8px;

cursor:pointer;

color:white;

}

.home:hover{

background:#252525;

}

.room{

width:100%;
height:100%;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

}

.title{

font-size:36px;

margin-bottom:60px;

}

.objects{

display:flex;

gap:80px;

align-items:flex-end;

}

.object{

text-align:center;

cursor:pointer;

transition:.2s;

}

.object:hover{

transform:translateY(-6px);

}

.icon{

font-size:90px;

margin-bottom:10px;

}

.locked{

opacity:.25;

cursor:not-allowed;

}

.locked:hover{

transform:none;

}

.tip{

margin-top:50px;

color:#777;

font-size:14px;

}

</style>

</head>

<body>

<button class="home" onclick="location.href='../'">
🏠 메인
</button>

<div class="room">

<div class="title">
Project 365 연구소
</div>

<div class="objects">

<div class="object"
onclick="location.href='computer/'">

<div class="icon">
🖥️
</div>

메인 컴퓨터

</div>

<div class="object locked"
onclick="alert('Day 15에 해금됩니다.')">

<div class="icon">
📚
</div>

책장

</div>

<div class="object locked"
onclick="alert('Day 30에 해금됩니다.')">

<div class="icon">
🧪
</div>

실험대

</div>

<div class="object locked"
onclick="alert('Day 60에 해금됩니다.')">

<div class="icon">
🤖
</div>

AI 로봇

</div>

</div>

<div class="tip">

새로운 오브젝트는 시간이 지나며 해금됩니다.

</div>

</div>

</body>
</html>
