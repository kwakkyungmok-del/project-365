<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수상한 초시계</title>
<style>
:root{
  --bg:#0f1020; --bg2:#1a1c35; --fg:#f3f2ff; --accent:#8b7bff; --accent2:#ff7bb0;
  --card:rgba(255,255,255,0.06); --hue:0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f4f2ff; --bg2:#e9e6ff; --fg:#1c1930; --card:rgba(0,0,0,0.05); }
}
:root[data-theme="dark"]{ --bg:#0f1020; --bg2:#1a1c35; --fg:#f3f2ff; --card:rgba(255,255,255,0.06); }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;position:relative;transition:filter .6s ease;
}
body.shake{animation:shake .5s ease;}
body.shake-hard{animation:shakeHard .35s ease;}
@keyframes shake{0%,100%{transform:translate(0,0);}20%{transform:translate(-8px,4px);}40%{transform:translate(7px,-5px);}60%{transform:translate(-6px,-3px);}80%{transform:translate(5px,6px);}}
@keyframes shakeHard{0%,100%{transform:translate(0,0) rotate(0);}25%{transform:translate(-14px,8px) rotate(-1deg);}50%{transform:translate(12px,-10px) rotate(1deg);}75%{transform:translate(-10px,-6px) rotate(-1deg);}}
body.invert{animation:invertFlash 1.2s ease;}
@keyframes invertFlash{0%,100%{filter:invert(0) hue-rotate(calc(var(--hue) * 1deg));}50%{filter:invert(1) hue-rotate(calc(var(--hue) * 1deg));}}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% 40%, rgba(139,123,255,.25), transparent 60%);filter:hue-rotate(calc(var(--hue) * 1deg));transition:filter 1s linear;}
.home-btn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;z-index:60;background:var(--card);color:var(--fg);text-decoration:none;padding:8px 14px;border-radius:999px;font-size:14px;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(6px);}
.home-btn:active{transform:scale(.95);}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px;text-align:center;}
.timer{font-variant-numeric:tabular-nums;font-size:clamp(48px,14vw,110px);font-weight:700;letter-spacing:2px;text-shadow:0 0 30px rgba(139,123,255,.5);transition:transform .25s ease;position:relative;}
.timer.pulse{animation:pulse .6s ease;}
@keyframes pulse{0%{transform:scale(1);}30%{transform:scale(1.18);color:var(--accent2);}100%{transform:scale(1);}}
.timer.glitch{animation:glitchAnim .6s steps(2,end);}
@keyframes glitchAnim{
  0%{transform:translate(0,0) skewX(0);filter:hue-rotate(0deg);}
  10%{transform:translate(-4px,2px) skewX(6deg);filter:hue-rotate(90deg);text-shadow:3px 0 red,-3px 0 cyan;}
  20%{transform:translate(4px,-2px) skewX(-6deg);text-shadow:-3px 0 red,3px 0 cyan;}
  30%{transform:translate(-3px,0) skewX(3deg);}
  40%{transform:translate(3px,1px) skewX(-3deg);filter:hue-rotate(180deg);}
  50%{transform:translate(-2px,-1px);text-shadow:2px 0 red,-2px 0 cyan;}
  60%{transform:translate(2px,2px) skewX(4deg);}
  70%{transform:translate(-3px,0);}
  100%{transform:translate(0,0) skewX(0);filter:hue-rotate(0deg);text-shadow:none;}
}
.sub{opacity:.6;font-size:14px;}
.controls{display:flex;gap:12px;}
.controls button{background:var(--card);color:var(--fg);border:1px solid rgba(255,255,255,.15);padding:10px 20px;border-radius:999px;font-size:15px;cursor:pointer;}
.controls button:active{transform:scale(.95);}
.toast{position:fixed;left:50%;bottom:calc(48px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--card);border:1px solid rgba(255,255,255,.15);padding:14px 22px;border-radius:16px;max-width:min(90vw,420px);font-size:15px;line-height:1.4;backdrop-filter:blur(8px);opacity:0;transition:opacity .5s ease, transform .5s ease;z-index:15;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.emoji{position:fixed;top:-40px;font-size:28px;z-index:5;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); opacity:.2; } }
#fx{position:fixed;inset:0;z-index:9;pointer-events:none;width:100%;height:100%;}
.flash-overlay{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;transition:opacity .12s ease;}
.flash-overlay.show{opacity:.85;transition:opacity .04s ease;}
.siren{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%, transparent 40%, rgba(255,30,60,.5) 100%);transition:opacity .5s ease;}
.siren.active{opacity:1;animation:sirenPulse 2s ease-in-out infinite;}
@keyframes sirenPulse{0%,100%{opacity:.35;}50%{opacity:.75;}}
.countdown-num{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:min(38vw,240px);font-weight:800;color:#ff3355;text-shadow:0 0 40px rgba(255,40,70,.9);z-index:46;pointer-events:none;opacity:0;}
.countdown-num.pop{animation:cdPop .9s ease forwards;}
@keyframes cdPop{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2);}20%{opacity:1;transform:translate(-50%,-50%) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50%) scale(.8);}}
.confetti{position:fixed;width:8px;height:14px;top:40%;z-index:6;pointer-events:none;border-radius:2px;}
.bored-btn{
  position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,30px);
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;
  border:none;padding:12px 22px;border-radius:999px;font-size:15px;cursor:pointer;
  box-shadow:0 8px 24px rgba(139,123,255,.4);
  opacity:0;pointer-events:none;transition:opacity .5s ease, transform .5s ease;z-index:18;
  animation:boredWiggle 2.2s ease-in-out infinite;
}
.bored-btn.show{opacity:1;pointer-events:auto;transform:translate(-50%,0);}
@keyframes boredWiggle{0%,100%{transform:translate(-50%,0) rotate(0);}50%{transform:translate(-50%,0) rotate(-2deg) scale(1.04);}}
.event-panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:55;padding:0;}
.event-panel-overlay.show{display:flex;}
.event-panel{
  background:var(--bg2);color:var(--fg);width:100%;max-width:480px;
  border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));
  border:1px solid rgba(255,255,255,.12);border-bottom:none;
  animation:panelUp .35s ease;max-height:70vh;overflow-y:auto;
}
@keyframes panelUp{0%{transform:translateY(40px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
.event-panel h3{margin:0 0 4px;font-size:18px;}
.event-panel .hint{margin:0 0 16px;font-size:13px;opacity:.6;}
.event-list{display:flex;flex-wrap:wrap;gap:8px;}
.event-list button{
  background:var(--card);color:var(--fg);border:1px solid rgba(255,255,255,.15);
  padding:9px 14px;border-radius:999px;font-size:14px;cursor:pointer;
}
.event-list button:active{transform:scale(.95);}
.event-list button.alarm-chip{background:linear-gradient(135deg,#ff5566,#ff8b3d);color:#fff;border:none;font-weight:700;}
.event-panel .close-row{margin-top:16px;text-align:center;}
.event-panel .close-row button{background:transparent;color:var(--fg);opacity:.7;border:none;font-size:14px;cursor:pointer;padding:8px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);color:var(--fg);border-radius:20px;padding:32px 26px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 80px rgba(255,40,80,.35);border:1px solid rgba(255,60,90,.4);animation:modalIn .5s cubic-bezier(.2,1.4,.4,1);}
@keyframes modalIn{0%{transform:scale(.6) rotate(-3deg);opacity:0;}60%{transform:scale(1.06) rotate(1deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
.modal h2{margin:0 0 12px;font-size:22px;}
.modal p{margin:0 0 22px;line-height:1.5;font-size:15px;opacity:.9;}
.modal .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.modal button{border:none;border-radius:999px;padding:12px 20px;font-size:15px;cursor:pointer;}
.modal .share{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;}
.modal .reset{background:var(--card);color:var(--fg);border:1px solid rgba(255,255,255,.15);}
</style>
</head>
<body>
<div class="glow"></div>
<div class="siren" id="siren"></div>
<canvas id="fx"></canvas>
<div class="flash-overlay" id="flash"></div>
<a class="home-btn" href="../">← 메인으로</a>

<div class="wrap">
  <div class="timer" id="timer">00:00.0</div>
  <div class="sub" id="sub">그냥 평범한 초시계입니다... 아마도.</div>
  <div class="controls">
    <button id="toggleBtn">일시정지</button>
    <button id="resetBtn">초기화</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="countdown-num" id="cdNum"></div>

<button class="bored-btn" id="boredBtn">지루하세요? 🙄</button>
<div class="event-panel-overlay" id="eventPanelOverlay">
  <div class="event-panel">
    <h3>이벤트 타임라인</h3>
    <p class="hint">원하는 시간대를 눌러서 바로 이동해보세요</p>
    <div class="event-list" id="eventList"></div>
    <div class="close-row"><button id="closePanelBtn">닫기</button></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>🚨 1시간 경과</h2>
    <p>이 사이트에서 한 시간을 허비하셨네요.<br>설마 켜놓고 딴짓한 거 아니죠?</p>
    <div class="btnrow">
      <button class="share" id="shareBtn">공유하기</button>
      <button class="reset" id="modalResetBtn">다시 시작</button>
    </div>
  </div>
</div>

<script>
const timerEl = document.getElementById('timer');
const subEl = document.getElementById('sub');
const toastEl = document.getElementById('toast');
const toggleBtn = document.getElementById('toggleBtn');
const resetBtn = document.getElementById('resetBtn');
const modalOverlay = document.getElementById('modalOverlay');
const shareBtn = document.getElementById('shareBtn');
const modalResetBtn = document.getElementById('modalResetBtn');
const flashEl = document.getElementById('flash');
const sirenEl = document.getElementById('siren');
const cdNumEl = document.getElementById('cdNum');
const boredBtn = document.getElementById('boredBtn');
const eventPanelOverlay = document.getElementById('eventPanelOverlay');
const eventList = document.getElementById('eventList');
const closePanelBtn = document.getElementById('closePanelBtn');
const canvas = document.getElementById('fx');
const ctx2d = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resizeCanvas(); addEventListener('resize', resizeCanvas);

let startTime = Date.now();
let elapsed = 0;
let running = true;
let firedMilestones = new Set();
let firedSeconds = new Set();
let emojiTimer = null;
let alarmAudio = null;
let particles = [];
let fxRunning = false;

const milestones = [
  [5, "어? 시작했다.", null],
  [15, "15초... 아직 심심하지 않죠?", null],
  [30, "30초 지남. 뭔가 일어날 시간이 다가오고 있어요.", null],
  [45, "45초. 배경이 조금씩 물들기 시작했어요.", 'hue'],
  [60, "1분! 벌써 60번이나 숫자가 바뀌었네요.", 'pulse,flash-accent'],
  [90, "1분 30초. 여기 계속 보고 있는 거... 실화?", null],
  [120, "2분 경과. 화면이 살짝 흔들릴 수 있어요.", 'shake'],
  [150, "2분 30초... 이거 왜 계속 보고 있어요.", null],
  [180, "3분! 커피 한 잔 마실 시간이었는데.", 'rain-slow'],
  [240, "4분. 이쯤이면 할 일이 생각나야 정상인데.", 'glitch'],
  [300, "5분 경과 — 손이라도 좀 씻고 오세요.", 'confetti,flash-white'],
  [420, "7분. 이 사이트 만든 사람도 테스트하다 7분 씀.", null],
  [600, "10분! 인생 낭비 각이 슬슬 잡히는 중.", 'confetti-big,fireworks,shake-hard'],
  [900, "15분. 저기요... 아직 살아있는 거죠?", 'rain-fast,glitch'],
  [1200, "20분. 숫자 구경하는 취미, 나쁘지 않네요.", 'fireworks'],
  [1800, "30분 = 웬만한 유튜브 영상 한 편 시간.", 'invert,glitch,flash-white,shake-hard'],
  [2400, "40분... 진심으로 괜찮은 거 맞아요?", 'fireworks'],
  [3000, "50분! 10분 남았어요, 조금만 더 버텨봐요.", 'fireworks,shake-hard,flash-accent'],
  [3300, "55분. 5분 남았습니다. 경보를 가동합니다.", 'siren-on'],
  [3540, "59분. 1분 전, 마음의 준비를 하세요.", 'shake-hard,glitch,flash-white'],
];

function labelFor(t){
  if(t>=3600) return '1시간 (알람💥)';
  const m = Math.floor(t/60), s = t%60;
  if(m===0) return `${s}초`;
  if(s===0) return `${m}분`;
  return `${m}분 ${s}초`;
}
function buildEventList(){
  const times = [...milestones.map(m=>m[0]), 3600];
  eventList.innerHTML = '';
  times.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = labelFor(t);
    if(t>=3600) b.classList.add('alarm-chip');
    b.addEventListener('click', ()=> jumpTo(t));
    eventList.appendChild(b);
  });
}
function openEventPanel(){ eventPanelOverlay.classList.add('show'); }
function closeEventPanel(){ eventPanelOverlay.classList.remove('show'); }
function jumpTo(t){
  elapsed = t*1000;
  startTime = Date.now() - elapsed;
  running = true;
  toggleBtn.textContent = '일시정지';
  firedMilestones = new Set(milestones.filter(m=>m[0]<t).map(m=>m[0]));
  firedSeconds = new Set();
  sirenEl.classList.toggle('active', t>=3300);
  document.documentElement.style.setProperty('--hue', t>=45 ? Math.floor(t/2)%360 : 0);
  if(t>=180 && !emojiTimer) startRain(t>=900?350:900);
  closeEventPanel();
  if(t>=3600){ firedMilestones.add(3600); triggerAlarm(); }
}
boredBtn.addEventListener('click', ()=>{ buildEventList(); openEventPanel(); });
closePanelBtn.addEventListener('click', closeEventPanel);
eventPanelOverlay.addEventListener('click', (e)=>{ if(e.target===eventPanelOverlay) closeEventPanel(); });

function fmt(ms){
  const totalSec = ms/1000;
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = Math.floor(totalSec%60);
  const t = Math.floor((ms%1000)/100);
  const mm = String(m).padStart(2,'0');
  const ss = String(s).padStart(2,'0');
  if(h>0) return `${h}:${mm}:${ss}.${t}`;
  return `${mm}:${ss}.${t}`;
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 3800);
}
function pulseTimer(){ timerEl.classList.remove('pulse'); void timerEl.offsetWidth; timerEl.classList.add('pulse'); }
function glitchTimer(){ timerEl.classList.remove('glitch'); void timerEl.offsetWidth; timerEl.classList.add('glitch'); }
function shakeBody(hard){
  const cls = hard? 'shake-hard':'shake';
  document.body.classList.remove(cls); void document.body.offsetWidth;
  document.body.classList.add(cls);
}
function invertFlash(){ document.body.classList.remove('invert'); void document.body.offsetWidth; document.body.classList.add('invert'); }
function flashScreen(color){
  flashEl.style.background = color;
  flashEl.classList.remove('show'); void flashEl.offsetWidth;
  flashEl.classList.add('show');
  setTimeout(()=> flashEl.classList.remove('show'), 90);
}
function spawnEmoji(){
  const emojis = ['✨','🌀','⏳','👀','🎈','🔮','💫','🕰️'];
  const span = document.createElement('div');
  span.className='emoji';
  span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  span.style.left = Math.random()*94 + 'vw';
  span.style.animationDuration = (4+Math.random()*3)+'s';
  document.body.appendChild(span);
  setTimeout(()=>span.remove(), 8000);
}
function startRain(intervalMs){
  if(emojiTimer) clearInterval(emojiTimer);
  emojiTimer = setInterval(spawnEmoji, intervalMs);
}
function confettiBurst(count){
  const colors=['#8b7bff','#ff7bb0','#7bf0ff','#ffd36b','#a8ff7b'];
  for(let i=0;i<count;i++){
    const c = document.createElement('div');
    c.className='confetti';
    c.style.left = (45+Math.random()*10)+'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    const dx = (Math.random()-0.5)*400;
    const dy = 200 + Math.random()*300;
    const dur = 1200+Math.random()*800;
    c.animate([
      {transform:`translate(0,0) rotate(0deg)`, opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${360+Math.random()*360}deg)`, opacity:0}
    ], {duration:dur, easing:'ease-out'});
    setTimeout(()=>c.remove(), dur+50);
  }
}

// ---- Canvas fireworks ----
function launchFirework(x,y){
  const colors=['#8b7bff','#ff7bb0','#7bf0ff','#ffd36b','#a8ff7b','#ff5566'];
  const color = colors[Math.floor(Math.random()*colors.length)];
  const count = 40;
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2*i)/count;
    const speed = 2 + Math.random()*3;
    particles.push({
      x,y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 1, color
    });
  }
}
function fireworks(bursts){
  bursts = bursts || 3;
  for(let i=0;i<bursts;i++){
    setTimeout(()=>{
      launchFirework(innerWidth*(0.25+Math.random()*0.5), innerHeight*(0.2+Math.random()*0.35));
    }, i*260);
  }
  if(!fxRunning){ fxRunning = true; requestAnimationFrame(runFx); }
}
function runFx(){
  ctx2d.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.012;
    ctx2d.globalAlpha = Math.max(p.life,0);
    ctx2d.fillStyle = p.color;
    ctx2d.beginPath();
    ctx2d.arc(p.x,p.y,3,0,Math.PI*2);
    ctx2d.fill();
  });
  ctx2d.globalAlpha = 1;
  particles = particles.filter(p=>p.life>0);
  if(particles.length>0){
    requestAnimationFrame(runFx);
  } else {
    fxRunning = false;
    ctx2d.clearRect(0,0,canvas.width,canvas.height);
  }
}

function handleEffect(effectStr){
  const effects = effectStr.split(',');
  effects.forEach(effect=>{
    if(effect==='pulse') pulseTimer();
    if(effect==='glitch') glitchTimer();
    if(effect==='shake') shakeBody(false);
    if(effect==='shake-hard') shakeBody(true);
    if(effect==='invert') invertFlash();
    if(effect==='rain-slow') startRain(900);
    if(effect==='rain-fast') startRain(350);
    if(effect==='confetti') confettiBurst(40);
    if(effect==='confetti-big') confettiBurst(120);
    if(effect==='fireworks') fireworks(3);
    if(effect==='flash-white') flashScreen('rgba(255,255,255,0.9)');
    if(effect==='flash-accent') flashScreen('rgba(139,123,255,0.7)');
    if(effect==='siren-on') sirenEl.classList.add('active');
  });
}

function tick(){
  if(running){ elapsed = Date.now() - startTime; }
  timerEl.textContent = fmt(elapsed);

  if(firedMilestones.has(45)){
    document.documentElement.style.setProperty('--hue', Math.floor(elapsed/1000/2) % 360);
  }

  const sec = Math.floor(elapsed/1000);

  if(sec>=180 && !boredBtn.classList.contains('show')){
    boredBtn.classList.add('show');
  }

  for(const [t,msg,effect] of milestones){
    if(sec>=t && !firedMilestones.has(t)){
      firedMilestones.add(t);
      showToast(msg);
      pulseTimer();
      if(effect) handleEffect(effect);
    }
  }

  // final 10-second countdown before the alarm
  if(sec>=3590 && sec<3600){
    const n = 3600-sec;
    if(!firedSeconds.has(n)){
      firedSeconds.add(n);
      cdNumEl.textContent = n;
      cdNumEl.classList.remove('pop'); void cdNumEl.offsetWidth;
      cdNumEl.classList.add('pop');
      shakeBody(true);
      flashScreen('rgba(255,30,60,0.5)');
      beep();
    }
  }

  if(sec>=3600 && !firedMilestones.has(3600)){
    firedMilestones.add(3600);
    triggerAlarm();
  }
  requestAnimationFrame(tick);
}

function beep(){
  try{
    const ctx = beep._ctx || (beep._ctx = new (window.AudioContext||window.webkitAudioContext)());
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.3);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.32);
  }catch(e){}
}

function triggerAlarm(){
  running = false;
  fireworks(6);
  confettiBurst(150);
  shakeBody(true);
  flashScreen('rgba(255,30,60,0.8)');
  modalOverlay.classList.add('show');
  alarmAudio = setInterval(beep, 500);
}
function stopAlarm(){
  if(alarmAudio){ clearInterval(alarmAudio); alarmAudio = null; }
  modalOverlay.classList.remove('show');
  sirenEl.classList.remove('active');
}

toggleBtn.addEventListener('click', ()=>{
  if(running){ running = false; toggleBtn.textContent = '계속하기'; }
  else{ startTime = Date.now() - elapsed; running = true; toggleBtn.textContent = '일시정지'; }
});
resetBtn.addEventListener('click', doReset);
modalResetBtn.addEventListener('click', ()=>{ stopAlarm(); doReset(); });

function doReset(){
  elapsed = 0; startTime = Date.now(); running = true;
  toggleBtn.textContent = '일시정지';
  firedMilestones.clear(); firedSeconds.clear();
  document.documentElement.style.setProperty('--hue', 0);
  if(emojiTimer){ clearInterval(emojiTimer); emojiTimer=null; }
  document.querySelectorAll('.emoji,.confetti').forEach(el=>el.remove());
  particles = []; ctx2d.clearRect(0,0,canvas.width,canvas.height);
  sirenEl.classList.remove('active');
  boredBtn.classList.remove('show');
  closeEventPanel();
  subEl.textContent = '그냥 평범한 초시계입니다... 아마도.';
}

shareBtn.addEventListener('click', async ()=>{
  const shareData = { title:'수상한 초시계', text:'이 사이트에서 한 시간을 허비했어요. 당신도 버텨보실래요?', url: location.href };
  try{
    if(navigator.share){ await navigator.share(shareData); }
    else{ await navigator.clipboard.writeText(location.href); showToast('링크가 복사되었습니다!'); }
  }catch(e){}
});

tick();
</script>
</body>
